<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="shell"></iframe><script>
const shell=document.getElementById('shell');shell.src='/analysis-shell-v10.html'+location.search;
let hookTimer=null;
function deepest(){try{let w=shell.contentWindow,d=shell.contentDocument;for(let i=0;i<14;i++){if(!d)break;const f=d.querySelector('iframe#shell,iframe#app');if(!f?.contentWindow||!f.contentDocument)break;w=f.contentWindow;d=f.contentDocument}return d?{w,d}:null}catch{return null}}
const n=v=>{v=Number(v);return Number.isFinite(v)?v:null};
function pivots(c){const out=[];for(let i=3;i<c.length-3;i++){let hi=true,lo=true;for(let k=i-3;k<=i+3;k++){if(k===i)continue;if(+c[k].high>=+c[i].high)hi=false;if(+c[k].low<=+c[i].low)lo=false}if(hi)out.push({id:'BH-'+i,i,type:'H',price:+c[i].high,confirmedAt:i+3});if(lo)out.push({id:'BL-'+i,i,type:'L',price:+c[i].low,confirmedAt:i+3})}return out.sort((a,b)=>a.confirmedAt-b.confirmedAt||a.i-b.i)}
function canonical(raw){const sw=[];for(const p of raw){if(!sw.length||sw.at(-1).type!==p.type)sw.push({...p});else{const q=sw.at(-1),more=p.type==='H'?p.price>q.price:p.price<q.price;if(more)sw[sw.length-1]={...p}}}let H=null,L=null;for(const s of sw){if(s.type==='H'){s.label=H==null?'H':s.price>H?'HH':'LH';H=s.price}else{s.label=L==null?'L':s.price>L?'HL':'LL';L=s.price}}return sw}
function buildStructure(raw,symbol,interval){const rows=(Array.isArray(raw)?raw:[]).filter(k=>Number(k[6])<Date.now());if(rows.length<20)throw Error('선물 확정봉 데이터 부족');const candles=rows.map(k=>({time:+k[0],openTime:+k[0],closeTime:+k[6],open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5],quoteVolume:+k[7]||0,takerBuyQuote:+k[10]||0}));const rp=pivots(candles),sw=canonical(rp),cur=candles.at(-1).close;let score=0;for(const s of sw.slice(-6)){if(s.label==='HH'||s.label==='HL')score++;if(s.label==='LH'||s.label==='LL')score--}const bias={label:score>1?'bullish':score<-1?'bearish':'neutral',score,components:['Binance Futures browser fallback','Confirmed candles']};const range=Math.max(cur*.0025,(Math.max(...candles.slice(-20).map(x=>x.high))-Math.min(...candles.slice(-20).map(x=>x.low)))/20);const groups=[];for(const p of rp.slice(-36)){let g=groups.find(x=>Math.abs(x.center-p.price)<=range);if(!g){g={center:p.price,vals:[]};groups.push(g)}g.vals.push(p.price);g.center=g.vals.reduce((a,b)=>a+b,0)/g.vals.length}const zones=groups.filter(g=>g.vals.length>=2).map(g=>({low:Math.min(...g.vals)-range*.3,high:Math.max(...g.vals)+range*.3,center:g.center,type:g.center<cur?'support':'resistance',touchCount:g.vals.length,strengthScore:Math.min(100,g.vals.length*20),source:'browser_futures_pivot_cluster'})).sort((a,b)=>Math.abs(a.center-cur)-Math.abs(b.center-cur)).slice(0,6);const events=[];let hi=null,lo=null,trend='neutral',si=0,ord=[...sw].sort((a,b)=>a.confirmedAt-b.confirmedAt);for(let i=0;i<candles.length;i++){while(si<ord.length&&ord[si].confirmedAt<=i){const s=ord[si++];if(s.type==='H')hi=s;else lo=s}if(hi&&candles[i].close>hi.price){events.push({i,eventTime:candles[i].time,type:trend==='down'?'CHOCH':'BOS',dir:'up',level:hi.price,retestStatus:'pending'});trend='up';hi=null}if(lo&&candles[i].close<lo.price){events.push({i,eventTime:candles[i].time,type:trend==='up'?'CHOCH':'BOS',dir:'down',level:lo.price,retestStatus:'pending'});trend='down';lo=null}}return{ok:true,version:'browser-futures-structure-v2',market:'futures',dataSource:'Binance USD-M browser public klines fallback',symbol,interval,lastClosedCloseTime:candles.at(-1).closeTime,snapshotTime:candles.at(-1).closeTime,candles,rawPivots:rp,canonicalSwings:sw,swingRevisions:[],events:events.slice(-24),zones,bias,current:{price:cur,supportDistanceAtr:null,resistanceDistanceAtr:null},trendlines:{support:null,resistance:null,secondary:{support:[],resistance:[]},dedup:{support:{raw:0,unique:0},resistance:{raw:0,unique:0}}},trendlineComparison:{raw:{support:null,resistance:null},canonical:{support:null,resistance:null}},audit:{coreStatus:'PASS',checks:[{name:'Closed candle only',status:'PASS'},{name:'Browser futures fallback',status:'PASS'}]}}}
async function browserFutures(url,nativeFetch){const u=new URL(url,location.href),symbol=(u.searchParams.get('symbol')||'BTCUSDT').toUpperCase(),interval=u.searchParams.get('interval')||'1h',limit=Math.min(1000,Math.max(80,Number(u.searchParams.get('limit'))||500));let last;for(const host of ['https://www.binance.com','https://fapi.binance.com']){try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),7000);const r=await nativeFetch(`${host}/fapi/v1/klines?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(interval)}&limit=${limit}`,{cache:'no-store',signal:ctl.signal,mode:'cors'});const text=await r.text();clearTimeout(to);if(!r.ok||!text.trim())throw Error('HTTP '+r.status);const raw=JSON.parse(text),body=buildStructure(raw,symbol,interval);return new Response(JSON.stringify(body),{status:200,headers:{'content-type':'application/json'}})}catch(e){last=e}}throw last||Error('Binance Futures browser fallback failed')}
async function loadCatalog(w,d,nativeFetch){const input=d.getElementById('symbol');if(!input||d.getElementById('symbolCatalogV11'))return;const list=d.createElement('datalist');list.id='symbolCatalogV11';d.body.appendChild(list);input.setAttribute('list','symbolCatalogV11');input.placeholder='BTCUSDT / XPINUSDT 검색';const symbols=new Set();try{const r=await nativeFetch('/api/market?minVolume=0',{cache:'no-store'}),j=await r.json();(j.results||[]).forEach(x=>x?.symbol&&symbols.add(String(x.symbol).toUpperCase()))}catch{}for(const host of ['https://www.binance.com','https://fapi.binance.com']){try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6500),r=await nativeFetch(host+'/fapi/v1/exchangeInfo',{cache:'no-store',signal:ctl.signal,mode:'cors'}),j=await r.json();clearTimeout(to);(j.symbols||[]).filter(x=>x.status==='TRADING'&&x.quoteAsset==='USDT'&&x.contractType==='PERPETUAL').forEach(x=>symbols.add(x.symbol));if(symbols.size>250)break}catch{}}const a=[...symbols].sort();list.innerHTML=a.map(s=>`<option value="${s}"></option>`).join('');const status=d.getElementById('status');if(status&&!d.getElementById('universeBadgeV11')){const b=d.createElement('span');b.id='universeBadgeV11';b.className='badge ok';b.textContent=`종목 ${a.length}개`;status.parentNode?.insertBefore(b,status)} }
function install(){const q=deepest();if(!q)return;const{w,d}=q;if(w.__pulseUniverseV11)return;w.__pulseUniverseV11=true;const nativeFetch=w.fetch.bind(w);w.fetch=async function(input,init){const url=typeof input==='string'?input:input?.url||String(input);if(url.includes('/api/structure?')){try{const r=await nativeFetch(input,init);if(r.ok){const c=r.clone(),t=await c.text();if(t.trim()){try{const j=JSON.parse(t);if(j?.ok)return r}catch{}}}}catch{}try{return await browserFutures(url,nativeFetch)}catch(e){return new Response(JSON.stringify({ok:false,error:e?.message||'구조 데이터 없음'}),{status:502,headers:{'content-type':'application/json'}})}}return nativeFetch(input,init)};loadCatalog(w,d,nativeFetch).catch(()=>{});const st=d.createElement('style');st.id='universe-v11-style';st.textContent='@media(max-width:700px){#universeBadgeV11{grid-column:1/-1!important;justify-self:start!important}.toolbar input[list]{padding-right:28px!important}}';d.head.appendChild(st);setTimeout(()=>{const status=d.getElementById('status')?.textContent||'';if(/분석 실패|Unexpected end|JSON input/i.test(status)){try{w.run&&w.run()}catch{}}},700)}
function hook(){install();clearInterval(hookTimer);hookTimer=setInterval(install,1800)}
shell.addEventListener('load',()=>{setTimeout(hook,700);setTimeout(install,1800);setTimeout(install,3500)});window.addEventListener('beforeunload',()=>clearInterval(hookTimer));
</script></body></html>
