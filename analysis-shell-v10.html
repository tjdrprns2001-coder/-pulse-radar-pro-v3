<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="shell"></iframe><script>
const shell=document.getElementById('shell');shell.src='/analysis-shell-v9.html'+location.search;
let fixTimer=null,busy=false,lastKey='';
function deepest(){try{let w=shell.contentWindow,d=shell.contentDocument;for(let i=0;i<12;i++){if(!d)break;const f=d.querySelector('iframe#shell,iframe#app');if(!f?.contentWindow||!f.contentDocument)break;w=f.contentWindow;d=f.contentDocument}return d?{w,d}:null}catch{return null}}
const num=v=>{v=Number(v);return Number.isFinite(v)?v:null};
function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
async function jget(u){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),9000);try{const r=await fetch(u,{cache:'no-store',signal:ac.signal}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('응답 형식 오류')}if(!r.ok||!j.ok)throw Error(j.error||j.reason||('HTTP '+r.status));return j}finally{clearTimeout(to)}}
function state(){const q=deepest();if(!q)return null;const symbol=(q.d.getElementById('symbol')?.value||'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g,''),tf=q.d.querySelector('[data-tf].active')?.dataset?.tf||new URLSearchParams(location.search).get('tf')||'4h';let b=q.d.getElementById('bias')?.textContent||q.w.D?.bias?.label||q.w.D?.bias||'';const dir=/bull|상승|up/i.test(String(b))?1:/bear|하락|down/i.test(String(b))?-1:null;return{...q,symbol,tf,dir}}
function set(id,v){const e=deepest()?.d.getElementById(id);if(e)e.textContent=v}
function closesFrom(data){const a=data?.candles||data?.data?.candles||[];return a.map(x=>num(x.close??x.c??x[4])).filter(Number.isFinite)}
function currentPath(c){const a=c.slice(-41);if(a.length<20)return null;const base=a[0];return a.map((v,i)=>({x:i/(a.length-1)*40,y:(v/base-1)*100}))}
function split(a){a=[...a].sort((x,y)=>(+x.time||0)-(+y.time||0));const d=Math.floor(a.length*.5),v=Math.floor(a.length*.75);return{DEV:a.slice(0,d),VALID:a.slice(d,v),HOLDOUT:a.slice(v)}}
function points(e){return[{x:0,y:0},{x:10,y:num(e.r10)||0},{x:20,y:num(e.r20)||0},{x:40,y:num(e.r40)||0}]}
function interp(ps){const out=[];for(let x=0;x<=40;x++){let a=ps[0],b=ps.at(-1);for(let i=1;i<ps.length;i++)if(x<=ps[i].x){a=ps[i-1];b=ps[i];break}const t=(x-a.x)/Math.max(1,b.x-a.x);out.push({x,y:a.y+(b.y-a.y)*t})}return out}
function medianPath(events){if(!events.length)return[];const pp=events.map(points),xs=[0,10,20,40];return interp(xs.map((x,i)=>({x,y:med(pp.map(p=>p[i].y))||0})))}
function draw(cur,hold){const c=deepest()?.d.getElementById('cmpCanvasV9');if(!c)return;const rect=c.getBoundingClientRect(),W=Math.max(300,rect.width),H=Math.max(180,rect.height),dpr=Math.min(2,window.devicePixelRatio||1);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);const pad={l:38,r:12,t:14,b:24},samples=hold.slice(-6).map(e=>interp(points(e))),mp=medianPath(hold),all=[...cur,...mp,...samples.flat()];let ymin=Math.min(-1,...all.map(p=>p.y)),ymax=Math.max(1,...all.map(p=>p.y));const span=Math.max(2,ymax-ymin);ymin-=span*.12;ymax+=span*.12;const X=v=>pad.l+v/40*(W-pad.l-pad.r),Y=v=>pad.t+(ymax-v)/(ymax-ymin)*(H-pad.t-pad.b);ctx.clearRect(0,0,W,H);ctx.strokeStyle='#17283b';ctx.lineWidth=1;for(const gx of [0,10,20,30,40]){ctx.beginPath();ctx.moveTo(X(gx),pad.t);ctx.lineTo(X(gx),H-pad.b);ctx.stroke()}for(const gy of [ymin,(ymin+ymax)/2,ymax]){ctx.beginPath();ctx.moveTo(pad.l,Y(gy));ctx.lineTo(W-pad.r,Y(gy));ctx.stroke()}ctx.fillStyle='#8096af';ctx.font='9px system-ui';ctx.fillText('0',X(0)-2,H-7);ctx.fillText('10',X(10)-5,H-7);ctx.fillText('20',X(20)-5,H-7);ctx.fillText('40봉',X(40)-18,H-7);ctx.fillText(ymax.toFixed(1)+'%',3,Y(ymax)+3);ctx.fillText(((ymin+ymax)/2).toFixed(1)+'%',3,Y((ymin+ymax)/2)+3);ctx.fillText(ymin.toFixed(1)+'%',3,Y(ymin)+3);function line(arr,color,width,alpha=1,dash=[]){if(!arr?.length)return;ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();arr.forEach((p,i)=>i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));ctx.stroke();ctx.restore()}samples.forEach(a=>line(a,'#64748b',1,.3,[3,3]));line(mp,'#a78bfa',2.5,.95);line(cur,'#35d69a',2.6,1);ctx.strokeStyle='#40546b';ctx.beginPath();ctx.moveTo(pad.l,Y(0));ctx.lineTo(W-pad.r,Y(0));ctx.stroke()}
async function repair(force=false){if(busy)return;const s=state();if(!s||!s.d.getElementById('structureCompareV9'))return;const key=s.symbol+'|'+s.tf,status=s.d.getElementById('cmpStatusV9')?.textContent||'',nowVal=s.d.getElementById('cmpNowV9')?.textContent||'';if(!force&&key===lastKey&&!/오류|현재 캔들 부족/.test(status+nowVal)&&nowVal&&nowVal!=='-')return;busy=true;set('cmpStatusV9','복구 중');set('cmpRuleV9','현재 확정봉을 서버 API에서 직접 불러오는 중...');try{const [curR,hR]=await Promise.allSettled([jget(`/api/structure?symbol=${encodeURIComponent(s.symbol)}&interval=${encodeURIComponent(s.tf)}&limit=120&_=${Date.now()}`),jget(`/api/historical-structure-study?symbol=${encodeURIComponent(s.symbol)}&interval=${encodeURIComponent(s.tf)}&bars=3000&_=${Date.now()}`)]);if(curR.status!=='fulfilled')throw curR.reason;const closes=closesFrom(curR.value),cur=currentPath(closes);if(!cur)throw Error(`현재 확정봉 부족 (${closes.length}개)`);if(hR.status!=='fulfilled')throw hR.reason;let events=hR.value.canonical?.events||[];const same=s.dir==null?events:events.filter(e=>+e.dir===s.dir);if(same.length>=8)events=same;const hold=split(events).HOLDOUT||[];draw(cur,hold);const now=cur.at(-1)?.y,hm=med(hold.map(e=>num(e.r40)));set('cmpNowV9',now==null?'-':`${now>=0?'+':''}${now.toFixed(2)}%`);set('cmpHistV9',hm==null?'-':`${hm>=0?'+':''}${hm.toFixed(2)}%`);set('cmpNV9',`${events.length}개 · HOLDOUT ${hold.length}개`);set('cmpRuleV9',`${s.symbol} ${s.tf} · 현재 확정봉 41개 vs 방향 유사 canonical HOLDOUT · 서버 API 직접 로딩`);set('cmpStatusV9','완료');lastKey=key}catch(e){set('cmpStatusV9','오류');set('cmpRuleV9','비교 로딩 실패 · '+(e?.message||String(e)));set('cmpNowV9','-');set('cmpHistV9','-');set('cmpNV9','-')}finally{busy=false}}
function hook(){setTimeout(()=>repair(true),2200);clearInterval(fixTimer);fixTimer=setInterval(()=>repair(false),7000)}
shell.addEventListener('load',()=>{setTimeout(hook,1200);setTimeout(()=>repair(true),4200)});window.addEventListener('resize',()=>setTimeout(()=>repair(true),300));window.addEventListener('orientationchange',()=>setTimeout(()=>repair(true),450));window.addEventListener('beforeunload',()=>clearInterval(fixTimer));
</script></body></html>
