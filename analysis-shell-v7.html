<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;min-width:0;background:#06101a;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="shell"></iframe><script>
const shell=document.getElementById('shell');shell.src='/analysis-shell-v6.html'+location.search;
const TFS=['15m','1h','4h','1d'];let timer=null,lastSnapshot={};
function deep(){try{const d1=shell.contentDocument,f1=d1?.getElementById('shell');const d2=f1?.contentDocument,f2=d2?.getElementById('app');if(!f2?.contentWindow)return null;return{w:f2.contentWindow,d:f2.contentDocument}}catch{return null}}
const num=v=>{v=Number(v);return Number.isFinite(v)?v:null};
function price(v){v=num(v);if(v==null)return'-';return v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toPrecision(5)}
async function json(u){const r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'HTTP '+r.status);return j}
function pivots(c){const out=[];for(let i=3;i<c.length-3;i++){let hi=true,lo=true;for(let k=i-3;k<=i+3;k++){if(k===i)continue;if(+c[k].high>=+c[i].high)hi=false;if(+c[k].low<=+c[i].low)lo=false}if(hi)out.push({type:'H',i,price:+c[i].high,time:c[i].time});if(lo)out.push({type:'L',i,price:+c[i].low,time:c[i].time})}return out.sort((a,b)=>a.i-b.i)}
function liquidityDiag(data,tf){const c=(data.candles||[]).slice(-220);if(c.length<50)return null;const p=pivots(c),last=+c.at(-1).close,tr=c.slice(1).map((x,i)=>Math.max(+x.high-+x.low,Math.abs(+x.high-+c[i].close),Math.abs(+x.low-+c[i].close))),atr=tr.slice(-14).reduce((a,b)=>a+b,0)/Math.max(1,tr.slice(-14).length);const tol=atr*({"15m":.2,"1h":.25,"4h":.3,"1d":.35}[tf]||.25);const highs=p.filter(x=>x.type==='H'),lows=p.filter(x=>x.type==='L');function pools(a,side){const out=[];for(let i=0;i<a.length;i++){let group=[a[i]];for(let j=i+1;j<a.length;j++)if(Math.abs(a[j].price-a[i].price)<=tol)group.push(a[j]);if(group.length>=2){const level=group.reduce((s,x)=>s+x.price,0)/group.length;out.push({side,level,touches:group.length,i:group.at(-1).i})}}return out.filter((x,i,a)=>a.findIndex(y=>Math.abs(y.level-x.level)<=tol&&y.side===x.side)===i)}const eq=[...pools(highs,'buy'),...pools(lows,'sell')];const buy=eq.filter(x=>x.side==='buy'&&x.level>last).sort((a,b)=>a.level-b.level)[0]||highs.filter(x=>x.price>last).sort((a,b)=>a.price-b.price).map(x=>({side:'buy',level:x.price,touches:1,i:x.i}))[0];const sell=eq.filter(x=>x.side==='sell'&&x.level<last).sort((a,b)=>b.level-a.level)[0]||lows.filter(x=>x.price<last).sort((a,b)=>b.price-a.price).map(x=>({side:'sell',level:x.price,touches:1,i:x.i}))[0];let sweep=null;for(let i=Math.max(20,c.length-14);i<c.length;i++){const ph=Math.max(...c.slice(i-20,i).map(x=>+x.high)),pl=Math.min(...c.slice(i-20,i).map(x=>+x.low));if(+c[i].high>ph&&+c[i].close<ph)sweep={side:'buy',level:ph,i};if(+c[i].low<pl&&+c[i].close>pl)sweep={side:'sell',level:pl,i}}const bias=data.bias?.label||'neutral',score=Math.min(100,(sweep?30:0)+(buy?20:0)+(sell?20:0)+Math.min(20,eq.length*5)+(bias!=='neutral'?10:0));return{tf,last,buy,sell,sweep,eq:eq.slice(-6),bias,score}}
function ensureUI(){const q=deep();if(!q)return false;const{d}=q;if(d.getElementById('integrated-v7'))return true;const nav=d.querySelector('.nav');if(nav&&!d.getElementById('liqNav')){const a=d.createElement('a');a.id='liqNav';a.className='btn';a.textContent='유동성';a.href='/liquidity?symbol='+encodeURIComponent(d.getElementById('symbol')?.value||'BTCUSDT');nav.appendChild(a)}const aside=d.querySelector('.side');if(!aside)return false;const box=d.createElement('div');box.id='integrated-v7';box.innerHTML=`<div class="box" style="margin-top:9px"><h3>시장 상태 점수판</h3><div class="scoreGrid" style="margin-top:7px"><div class="score"><b>유동성 MTF</b><strong id="liqScoreV7">-</strong><small>외부/내부·스윕·Equal H/L</small></div><div class="score"><b>상태 합성</b><strong id="blendScoreV7">-</strong><small>확률 아님 · 구조 합성 지표</small></div></div><div class="rows"><div class="row"><span>상위 TF 최근 스윕</span><b id="htfSweepV7">-</b></div><div class="row"><span>가까운 Buy-side</span><b id="buyV7">-</b></div><div class="row"><span>가까운 Sell-side</span><b id="sellV7">-</b></div><div class="row"><span>외부 유동성 타겟</span><b id="targetV7">-</b></div></div></div><div class="box" style="margin-top:9px"><h3>실시간 변화</h3><div id="liveChangesV7" class="muted" style="line-height:1.7">변화 감시 준비</div></div><div class="box" style="margin-top:9px"><h3>구조 이벤트 타임라인</h3><div id="timelineV7" style="font-size:10px;line-height:1.7;color:#c4d3e4">-</div></div><div class="box" style="margin-top:9px"><h3>검증</h3><div class="muted">현재 점수는 휴리스틱입니다. 과거 검증은 별도 연구 화면에서 확인합니다.</div><a class="btn" style="display:inline-block;margin-top:7px" href="/historical-validation.html">과거 검증 보기</a></div>`;aside.appendChild(box);const st=d.createElement('style');st.textContent='@media(max-width:700px){#integrated-v7 .scoreGrid{grid-template-columns:1fr 1fr!important}#timelineV7{font-size:9px!important}} .newTag{display:inline-block;margin-left:4px;padding:1px 5px;border-radius:999px;background:#4f8cff;color:white;font-size:8px}';d.head.appendChild(st);return true}
function set(id,val){const q=deep(),e=q?.d.getElementById(id);if(e)e.textContent=val}
function txt(id){return deep()?.d.getElementById(id)?.textContent?.trim()||''}
function eventTimeline(){const q=deep();if(!q)return;const w=q.w,D=w.D,F=w.F,arr=[];(D?.events||F?.events||[]).slice(-8).forEach(e=>arr.push(`${String(e.type||'EVENT').toUpperCase()} ${e.dir||''}${Number.isFinite(+e.level)?' · '+price(e.level):''}`));if(F?.fvg?.some(x=>x.open))arr.push(`미체결 FVG ${F.fvg.filter(x=>x.open).length}개`);if(F?.obs?.length)arr.push(`OB 후보 ${F.obs.length}개`);set('timelineV7',arr.length?arr.slice(-10).map((x,i)=>`${i+1}. ${x}`).join('\n'):'최근 구조 이벤트 없음')}
async function refreshLiquidity(){if(!ensureUI())return;const q=deep(),symbol=(q.d.getElementById('symbol')?.value||'BTCUSDT').toUpperCase(),rs=await Promise.allSettled(TFS.map(tf=>json(`/api/structure?symbol=${encodeURIComponent(symbol)}&interval=${tf}&limit=260&_=${Date.now()}`))),all={};rs.forEach((r,i)=>{if(r.status==='fulfilled')all[TFS[i]]=liquidityDiag(r.value,TFS[i])});const v=TFS.map(tf=>all[tf]).filter(Boolean);if(!v.length)return;const score=Math.round(v.reduce((s,x)=>s+x.score,0)/v.length),major=all['1d']||all['4h']||v.at(-1),recentSweep=[all['1d'],all['4h'],all['1h'],all['15m']].find(x=>x?.sweep);set('liqScoreV7',score+'/100');set('htfSweepV7',recentSweep?`${recentSweep.tf} · ${recentSweep.sweep.side==='buy'?'상단':'하단'} 스윕`:'최근 없음');set('buyV7',major?.buy?price(major.buy.level):'-');set('sellV7',major?.sell?price(major.sell.level):'-');const target=major?.bias==='bullish'?major.buy?.level:major?.bias==='bearish'?major.sell?.level:(major?.buy?.level||major?.sell?.level);set('targetV7',target?price(target):'-');const surge=parseFloat(txt('surgeScore'))||0,ict=parseFloat(txt('ictScore'))||0,der=txt('pressure'),derScore=der.includes('과열')?75:der.includes('확대')?60:50,mtf=txt('mtfState'),mtfScore=/상승|하락.*정렬/.test(mtf)?70:50,blend=Math.round(surge*.25+ict*.25+score*.30+derScore*.10+mtfScore*.10);set('blendScoreV7',blend+'/100');const ln=q.d.getElementById('liqNav');if(ln)ln.href='/liquidity?symbol='+encodeURIComponent(symbol);eventTimeline()}
function watchChanges(){const q=deep();if(!q)return;const ids=['oi','oi24','fund','taker','liveVol','event'],labels={oi:'OI',oi24:'OI 24h',fund:'펀딩',taker:'Taker',liveVol:'진행봉 거래량',event:'구조 이벤트'},changes=[];for(const id of ids){const v=txt(id);if(lastSnapshot[id]&&v&&v!==lastSnapshot[id]&&v!=='-')changes.push(`${labels[id]}: ${lastSnapshot[id]} → ${v} <span class="newTag">NEW</span>`);if(v)lastSnapshot[id]=v}const e=q.d.getElementById('liveChangesV7');if(e)e.innerHTML=changes.length?changes.join('<br>'):'새 변화 없음 · 실시간 감시 중'}
function tick(){ensureUI();refreshLiquidity().catch(()=>{});watchChanges();eventTimeline()}
function hook(){setTimeout(tick,1200);clearInterval(timer);timer=setInterval(tick,12000)}
shell.addEventListener('load',()=>{setTimeout(hook,700);setTimeout(hook,1800)});window.addEventListener('beforeunload',()=>clearInterval(timer));
</script></body></html>
