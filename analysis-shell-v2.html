<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#06101a}</style></head><body><iframe id="app" title="PulseRadar Pro 통합 분석"></iframe><script>
const q=new URLSearchParams(location.search),initSymbol=(q.get('symbol')||'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g,''),initTf=['15m','1h','4h','1d'].includes(q.get('tf'))?q.get('tf'):'4h',initMode=['snapshot','detail'].includes(q.get('mode'))?q.get('mode'):'snapshot';
const frame=document.getElementById('app');frame.src=`/analysis-v3.html?symbol=${encodeURIComponent(initSymbol)}&tf=${initTf}&mode=${initMode}`;
let derivTimer=null,liveTimer=null,stopped=false;
function doc(){try{return frame.contentDocument}catch{return null}}
function state(){const d=doc();let symbol=initSymbol,tf=initTf;if(d){const s=d.getElementById('symbol');if(s?.value)symbol=String(s.value).toUpperCase().replace(/[^A-Z0-9]/g,'')||symbol;const a=d.querySelector('[data-tf].active');if(a?.dataset?.tf)tf=a.dataset.tf}return{symbol,tf}}
function set(id,text,cls){const d=doc(),e=d&&d.getElementById(id);if(!e)return;if(text!=null)e.textContent=text;if(cls!=null)e.className=cls}
function comp(v){v=Number(v);return Number.isFinite(v)?Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}).format(v):'-'}
function fmt(v){v=Number(v);if(!Number.isFinite(v))return'-';return v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6)}
async function api(url){const r=await fetch(url,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.reason||j.error||`HTTP ${r.status}`);return j}
function oiKey(symbol){return`pr_oi_hist_${symbol}`}
function rememberOi(symbol,value){value=Number(value);if(!Number.isFinite(value)||value<=0)return null;const now=Date.now(),key=oiKey(symbol);let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!Array.isArray(arr))arr=[];arr=arr.filter(x=>x&&Number.isFinite(+x.t)&&Number.isFinite(+x.v)&&now-(+x.t)<30*60*60*1000);const last=arr.at(-1);if(!last||now-(+last.t)>5*60*1000)arr.push({t:now,v:value});try{localStorage.setItem(key,JSON.stringify(arr.slice(-400)))}catch{}const target=now-24*60*60*1000,cands=arr.filter(x=>now-(+x.t)>=20*60*60*1000);if(!cands.length)return null;let best=cands[0],dist=Math.abs((+best.t)-target);for(const x of cands){const z=Math.abs((+x.t)-target);if(z<dist){best=x;dist=z}}const old=+best.v;return old>0?(value-old)/old*100:null}
async function pullDeriv(){const {symbol}=state();try{const d=await api(`/api/htf?mode=deriv&symbol=${encodeURIComponent(symbol)}&_=${Date.now()}`);if(!d.available){set('pressure','미지원');set('pressureNote',d.reason||'USD-M 데이터 없음');set('oi','-');set('oi24','-');set('fund','-');set('taker','-');set('derSource','-');return}set('pressure',d.pressure||'중립');set('pressureNote',(d.flags||[]).slice(0,2).join(' · ')||'뚜렷한 쏠림 없음');set('oi',Number.isFinite(d.openInterestUsdApprox)?'$'+comp(d.openInterestUsdApprox):comp(d.openInterestContracts));let oi24=Number.isFinite(d.openInterestChange24hPct)?d.openInterestChange24hPct:null;if(oi24==null&&Number.isFinite(d.openInterestUsdApprox))oi24=rememberOi(symbol,d.openInterestUsdApprox);set('oi24',Number.isFinite(oi24)?`${oi24>=0?'+':''}${oi24.toFixed(1)}%`:'수집 중');set('fund',Number.isFinite(d.fundingRatePct)?d.fundingRatePct.toFixed(4)+'%':'-');set('taker',Number.isFinite(d.takerBuySellRatio)?d.takerBuySellRatio.toFixed(2)+'x':'-');set('derSource',d.source||'Binance USD-M REST')}catch(e){set('pressure','재시도');set('pressureNote','파생 데이터 재연결 중')}}
async function pullLive(){const {symbol,tf}=state();try{const d=await api(`/api/htf?mode=live&symbol=${encodeURIComponent(symbol)}&interval=${tf}&_=${Date.now()}`);if(!d.available)return;set('ohlc',`O ${fmt(d.open)} · H ${fmt(d.high)} · L ${fmt(d.low)} · C ${fmt(d.close)}`);set('liveVol',Number.isFinite(d.projectedVolumeRatio)?d.projectedVolumeRatio.toFixed(2)+'x':'-');const dd=doc(),live=dd&&dd.getElementById('live');if(live&&!/WebSocket 실시간|실시간 연결/.test(live.textContent||'')){live.textContent='● REST 실시간';live.className='badge ok'}}catch(e){const dd=doc(),live=dd&&dd.getElementById('live');if(live&&/연결 오류|연결 준비|재연결|REST/.test(live.textContent||'')){live.textContent='● REST 재시도';live.className='badge warn'}}}
function start(){if(stopped)return;clearInterval(derivTimer);clearInterval(liveTimer);pullDeriv();pullLive();derivTimer=setInterval(pullDeriv,10000);liveTimer=setInterval(pullLive,3000)}
frame.addEventListener('load',()=>setTimeout(start,900));window.addEventListener('beforeunload',()=>{stopped=true;clearInterval(derivTimer);clearInterval(liveTimer)});
</script></body></html>
