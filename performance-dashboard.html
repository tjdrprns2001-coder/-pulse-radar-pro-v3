<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar · Outcome Performance</title><style>:root{--bg:#06101a;--p:#0b1622;--l:#20344b;--t:#eef5ff;--m:#8fa5bd;--g:#2fd6a1;--a:#ffc45f;--r:#ff6677}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:12px system-ui}.app{max-width:1400px;margin:auto;padding:10px}.top,.filters,.cards,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:10px}.cards{margin:10px 0}.card{flex:1;min-width:145px}.card small{color:var(--m)}.card b{display:block;font-size:20px;margin-top:4px}.filters{position:sticky;top:0;z-index:4;background:#06101ae8;padding:8px 0}.filters select,.filters input,.btn{background:#091522;border:1px solid var(--l);color:#fff;border-radius:9px;padding:8px}.btn{text-decoration:none}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:10px}.panel{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px;border-bottom:1px solid #1a2b40;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.muted{color:var(--m)}.good{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}pre{white-space:pre-wrap;word-break:break-word;font:10px ui-monospace;max-height:300px;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}.cards{display:grid;grid-template-columns:1fr 1fr}.filters>*{flex:1}.app{padding:7px}}</style><script src="/lib/signal-quality/outcome-recorder.js"></script><script src="/lib/signal-quality/calibration.js"></script><script src="/lib/signal-quality/drift-monitor.js"></script><script src="/lib/signal-quality/performance.js"></script><script src="/lib/signal-quality/alert-history.js"></script><script src="/ui/signal-quality/performance-dashboard.js" defer></script></head><body><main class="app"><header class="top"><div><h1 style="margin:0;font-size:20px">Outcome Performance</h1><div class="muted">LIVE_VALIDATED와 BACKTESTED를 분리해 성과·캘리브레이션·Drift를 확인합니다.</div></div><div><a class="btn" href="/historical-backfill.html">Historical Backfill</a> <a class="btn" href="/">목록</a></div></header><section class="filters"><select id="source"><option value="LIVE_VALIDATED">LIVE_VALIDATED</option><option value="BACKTESTED">BACKTESTED</option><option value="ALL">전체(분리 표시)</option></select><select id="group"><option value="pattern">Pattern</option><option value="tf">TF</option><option value="regime">Regime</option><option value="venue">Venue</option><option value="alertStateAtCapture">Alert State</option></select><select id="horizon"><option>20</option><option>50</option><option>10</option><option>5</option></select><input id="symbol" placeholder="BTCUSDT (선택)"><button class="btn" id="refresh">새로고침</button></section><section class="cards"><div class="card"><small>표본</small><b id="n">0</b></div><div class="card"><small>적중률</small><b id="hit">—</b></div><div class="card"><small>평균 수익률</small><b id="avg">—</b></div><div class="card"><small>Abstain</small><b id="abstain">—</b></div></section><div class="grid"><section class="panel"><h2 style="font-size:14px">성과 그룹</h2><table><thead><tr><th>그룹</th><th>Source</th><th>N</th><th>Hit</th><th>Avg</th><th>Median</th><th>Avg R</th><th>DD proxy</th><th>Brier</th><th>ECE</th></tr></thead><tbody id="tbody"></tbody></table></section><aside><section class="panel"><h2 style="font-size:14px">Feature Drift 30 / 90</h2><div id="drift" class="muted">resolved outcome 부족 시 insufficient</div></section><section class="panel" style="margin-top:10px"><h2 style="font-size:14px">Alert History</h2><div id="alerts" class="muted">기록 없음</div></section><section class="panel" style="margin-top:10px"><h2 style="font-size:14px">Snapshot drilldown</h2><pre id="drill">행을 선택하세요.</pre></section></aside></div></main></body></html>
