<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;min-width:0;background:#06101a;overflow:hidden;-webkit-text-size-adjust:100%}iframe{position:fixed;inset:0;display:block;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="shell" title="PulseRadar Pro 통합 분석"></iframe><script>
const shell=document.getElementById('shell');shell.src='/analysis-shell-v4.html'+location.search;
function deepest(){try{const sd=shell.contentDocument;if(!sd)return null;const inner=sd.getElementById('app');if(!inner?.contentWindow)return null;return{w:inner.contentWindow,d:inner.contentDocument}}catch{return null}}
function patchLabels(){const q=deepest();if(!q)return;const {w,d}=q;if(w.__pulseLabelPatchV2)return;w.__pulseLabelPatchV2=true;const proto=w.CanvasRenderingContext2D?.prototype;if(!proto)return;const nativeFillText=proto.fillText,nativeFillRect=proto.fillRect,nativeMeasure=proto.measureText;let boxes=[];
function isTarget(t){return /^(BOS|CHOCH|CHoCH|FVG|support|resistance|상승 OB|하락 OB|상단 유동성|하단 유동성)$/i.test(String(t).trim())}
function isZoneLabel(t){return /^(FVG|support|resistance|상승 OB|하락 OB|상단 유동성|하단 유동성)$/i.test(String(t).trim())}
function shortText(t){t=String(t);if(innerWidth>700)return t;if(/^support$/i.test(t))return'지지';if(/^resistance$/i.test(t))return'저항';if(/^CHOCH$/i.test(t))return'CHoCH';return t}
function hit(a,b){return !(a.r<b.l||a.l>b.r||a.b<b.t||a.t>b.b)}
proto.fillRect=function(x,y,ww,hh){try{if(this.canvas?.id==='price'&&x===0&&y===0&&ww>this.canvas.clientWidth*.7&&hh>this.canvas.clientHeight*.7)boxes=[]}catch{}return nativeFillRect.call(this,x,y,ww,hh)};
proto.fillText=function(text,x,y,maxWidth){try{if(this.canvas?.id==='price'&&isTarget(text)){const mobile=this.canvas.clientWidth<=700||innerWidth<=700;if(mobile&&isZoneLabel(text))return;let t=shortText(text),m=nativeMeasure.call(this,t),bw=Math.max(24,m.width+8),bh=14,opts=[0,-14,14,-28,28,-42,42],chosen=null;for(const dy of opts){let yy=Math.max(16,Math.min(this.canvas.clientHeight-12,y+dy)),b={l:x-4,r:x+bw,t:yy-bh,b:yy+4};if(!boxes.some(z=>hit(b,z))){chosen={yy,b};break}}if(!chosen)return;let nearSame=boxes.some(z=>z.txt===t&&Math.abs(z.b.t-chosen.b.t)<20&&Math.abs(z.b.l-chosen.b.l)<54);if(nearSame)return;boxes.push({...chosen.b,txt:t});text=t;y=chosen.yy}}
catch{}return maxWidth===undefined?nativeFillText.call(this,text,x,y):nativeFillText.call(this,text,x,y,maxWidth)};
const st=d.createElement('style');st.id='chart-label-mobile-polish';st.textContent='@media(max-width:700px){.chartWrap{min-height:390px!important}.legend{padding:6px!important}.legend:after{content:" · 모바일은 구간명이 겹치지 않도록 FVG/OB/유동성 텍스트를 숨기고 색상 영역만 표시";color:#667c95}.side{margin-top:8px!important}.scoreGrid{gap:5px!important}.row{overflow:hidden!important}.row b{white-space:normal!important;line-height:1.35!important}.toggles{scrollbar-width:none!important}.toggles::-webkit-scrollbar{display:none!important}}';d.head.appendChild(st);
}
function hook(){try{const sd=shell.contentDocument,inner=sd&&sd.getElementById('app');if(inner){inner.addEventListener('load',()=>{setTimeout(patchLabels,120);setTimeout(patchLabels,800)},{once:false});setTimeout(patchLabels,220)}}catch{}}
shell.addEventListener('load',()=>{hook();setTimeout(hook,600)});window.addEventListener('resize',()=>setTimeout(patchLabels,100));window.addEventListener('orientationchange',()=>setTimeout(patchLabels,250));
</script></body></html>
