<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar Unified Chart</title><link rel="stylesheet" href="/ui/chart/unified-chart.css"></head><body><main class="ucApp"><header class="ucTop"><div class="ucBrand"><b>PulseRadar Unified Chart</b><small>Lightweight Charts v5 · Structure / Dante plugin workspace</small></div><a id="legacyTop" class="ucBtn ucStandaloneBack" href="/technique-lab.html">기존 분석 화면</a></header><section class="ucToolbar"><input id="symbol" value="BTCUSDT" autocomplete="off" spellcheck="false"><select id="tf"><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select><button id="run" class="ucBtn ucPrimary">분석 실행</button><span id="presetBadge" class="ucBadge">Clean</span><span id="dataState" class="ucBadge" data-pulse-data-state="live">실시간</span></section><section class="ucChartCard"><div id="unifiedChart" class="ucChart"></div><div id="fallback" class="ucOverlay"><div class="box"><b id="fallbackTitle">차트를 불러오지 못했습니다</b><p id="fallbackText" class="ucMuted">기존 분석 화면은 계속 사용할 수 있습니다.</p><a id="legacyLink" class="ucBtn ucPrimary" href="/technique-lab.html">기존 분석 화면 열기</a></div></div></section><div id="status" class="ucStatus">대기</div><section class="ucBottom"><details class="ucPanel"><summary>지표 pane</summary><div class="ucPaneControls"><label><input type="checkbox" data-pane="rsi"> RSI</label><label><input type="checkbox" data-pane="macd"> MACD</label><label><input type="checkbox" data-pane="stoch"> Stoch RSI</label></div></details><div class="ucPanel ucLegend"><span>Structure = 기존 API 구조/추세선</span><span>Dante = EMA 5·20·60·112·224·256·448</span></div></section></main><script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script><script src="/ui/pulse-presets.js"></script><script src="/ui/pulse-data-state.js"></script><script src="/ui/chart/chart-data.js"></script><script src="/ui/chart/chart-plugins.js"></script><script src="/ui/chart/chart-core.js"></script><script src="/ui/chart/plugins/structure-plugin.js"></script><script src="/ui/chart/plugins/dante-plugin.js"></script><script>(()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),symbolEl=$('symbol'),tfEl=$('tf'),status=$('status'),fallback=$('fallback'),P=window.PulsePresets,D=window.PulseDataState,CD=window.PulseChartData,CP=window.PulseChartPlugins,CC=window.PulseChartCore;let core=null,registry=null,currentPreset=null;if(q.get('shell')==='1')document.documentElement.dataset.shell='1';function cleanSymbol(v){v=String(v||'BTCUSDT').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');return v||'BTCUSDT'}function legacyHref(){return '/technique-lab.html?symbol='+encodeURIComponent(cleanSymbol(symbolEl.value))+'&tf='+encodeURIComponent(tfEl.value)}function updateLegacy(){const h=legacyHref();$('legacyLink').href=h;$('legacyTop').href=h}function setState(id){if(!D)return;const m=D.formatDataState(id),el=$('dataState');el.dataset.pulseDataState=m.id;el.dataset.severity=m.severity;el.textContent=m.label}function showError(title,text){$('fallbackTitle').textContent=title;$('fallbackText').textContent=text;fallback.classList.add('show');setState('api-degraded');window.dispatchEvent(new CustomEvent('pulse:chart-error',{detail:{title,text}}))}function paneDefaults(preset){return preset&&preset.id==='full'?['rsi','macd','stoch']:[]}function syncPaneControls(){document.querySelectorAll('[data-pane]').forEach(x=>x.checked=paneDefaults(currentPreset).includes(x.dataset.pane))}async function run(){fallback.classList.remove('show');updateLegacy();const s=cleanSymbol(symbolEl.value),tf=tfEl.value;symbolEl.value=s;currentPreset=P?.getPreset(q.get('preset')||P?.loadPreset()?.id||'clean')||{id:'clean',label:'Clean',panes:[],maxZones:3};$('presetBadge').textContent=currentPreset.label||currentPreset.id;syncPaneControls();status.textContent='구조 데이터 불러오는 중…';setState('live');if(!window.LightweightCharts||!CD||!CP||!CC){showError('차트 라이브러리를 불러오지 못했습니다','네트워크 또는 라이브러리 로드 문제입니다. 기존 분석 화면을 사용할 수 있습니다.');return}try{const analysis=await CD.fetchStructure({symbol:s,interval:tf,limit:500});const raw=Array.isArray(analysis.candles)?analysis.candles:[];if(!raw.length)throw new Error('확정봉 데이터가 없습니다');const normalized=CD.normalizeCandles(raw),indicators={rsi:CD.rsiSeries(raw),macd:CD.macdSeries(raw),stoch:CD.stochRsiSeries(raw)};registry?.disposeAll();core?.dispose();core=CC.createUnifiedChart({container:$('unifiedChart'),library:window.LightweightCharts,preset:currentPreset});core.setData({...normalized,indicators});registry=CP.createPluginRegistry();registry.register(window.PulseStructurePlugin.createStructurePlugin({maxItems:currentPreset.maxZones}));registry.register(window.PulseDantePlugin.createDantePlugin());registry.mountAll(core);registry.setVisible('structure',currentPreset.id!=='clean');registry.setVisible('dante',currentPreset.id==='dante'||currentPreset.id==='full');registry.updateAll({analysis,rawCandles:raw,candles:normalized.candles,preset:currentPreset,dataApi:CD});status.textContent=`${s} · ${tf} · ${raw.length}개 확정봉`;setState('confirmed');const u=new URL(location.href);u.searchParams.set('symbol',s);u.searchParams.set('tf',tf);u.searchParams.set('preset',currentPreset.id);history.replaceState(null,'',u);window.dispatchEvent(new CustomEvent('pulse:chart-ready',{detail:{symbol:s,tf,preset:currentPreset.id}}))}catch(e){console.error(e);showError('분석 데이터를 불러오지 못했습니다',e?.message||'API 오류');status.textContent='오류: '+(e?.message||'unknown')}}$('run').onclick=run;symbolEl.addEventListener('keydown',e=>{if(e.key==='Enter')run()});tfEl.onchange=run;document.querySelectorAll('[data-pane]').forEach(box=>box.onchange=()=>{if(!core)return;core.ensurePane(box.dataset.pane);core.setPaneVisibility(box.dataset.pane,box.checked)});symbolEl.value=cleanSymbol(q.get('symbol')||'BTCUSDT');if(['15m','1h','4h','1d'].includes(q.get('tf')))tfEl.value=q.get('tf');updateLegacy();run();})();</script></body></html>
