<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 성과 검증</title><link rel="stylesheet" href="/ui/signal-performance.css?v=20260918-intel2"></head><body><main class="perfApp"><header class="perfTop"><div><h1>성과 검증</h1><p>실제 신호 결과와 과거 백필을 분리해 15분 · 1시간 · 4시간 · 24시간 성과를 검증합니다.</p></div><a class="back" href="/coin-scan.html">자동 코인 분류</a></header><section class="notice">과거 상승 비율과 과거 평균 수익률은 관측된 과거 결과이며 미래 수익을 보장하지 않습니다. 평가 표본 30개 미만은 <b>표본 부족</b>으로 유지합니다.</section><section class="filters"><label>분류 <select id="classFilter"><option value="">전체</option><option value="PRE-SURGE">🔥 급등 직전</option><option value="ACCUMULATION-PRE">🟢 잠복 축적</option><option value="META-PRE">🟢 메타 선행</option><option value="SECTOR-ROTATION">🟣 섹터 순환매</option><option value="ANOMALY">🟠 이상징후</option></select></label><label>표본 <select id="sourceFilter"><option value="">전체</option><option value="live">실시간</option><option value="backfill">과거 백필</option></select></label><label>기간 <select id="horizonFilter"><option value="">전체</option><option value="m15">15분</option><option value="h1">1시간</option><option value="h4">4시간</option><option value="h24">24시간</option></select></label><button id="refreshBtn">새로고침</button></section><div id="status" class="status">불러오는 중…</div><section class="dashSection"><h2>성과 검증</h2><div id="stats" class="stats"></div></section><section class="dashSection"><h2>보정 신뢰도</h2><div id="calibration" class="panelGrid"></div></section><section class="dashSection"><h2>오탐 분석</h2><div id="penalties" class="panelGrid"></div></section><section class="dashSection"><h2>상태전환</h2><div id="alerts" class="panelGrid"></div></section><section class="dashSection"><h2>메타 근거</h2><div id="evidence" class="panelGrid"></div></section><section class="dashSection"><h2>시스템 상태</h2><div id="health" class="healthGrid"></div></section><section class="recentSection"><h2>최근 신호</h2><div id="recent" class="recent"></div></section><p class="foot">평가가 끝나지 않은 기간은 평가 대기로 남기며 임의의 현재가로 채우지 않습니다.</p></main><script src="/ui/signal-performance.js?v=20260918-intel2" defer></script></body></html>
