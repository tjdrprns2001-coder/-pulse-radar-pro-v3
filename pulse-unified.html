<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PulseRadar Pro v3</title>
<link rel="stylesheet" href="/ui/pulse-shell.css">
<script src="/ui/pulse-presets.js"></script>
<script src="/ui/pulse-data-state.js"></script>
<script src="/ui/pulse-shell.js?v=20260917-pulseai1" defer></script>
<script src="/ui/pulse-shell-snapshot-restore.js" defer></script>
<script src="/ui/pulse-shell-v2-operations.js" defer></script>
</head>
<body>
<div class="drawerShade" id="shade"></div>
<div class="app">
<aside class="side" id="side" aria-label="전체 메뉴">
  <div class="brand"><div class="logo">P</div><div><b>PulseRadar Pro v3</b><small>Unified Trading Research Workspace</small></div></div>
  <div class="group"><div class="groupTitle">Core</div>
    <button class="navBtn active" data-view="scanner"><span class="icon">⌁</span>시장 스캐너<span class="badge">LIVE</span></button>
    <button class="navBtn" data-view="pulseai"><span class="icon">✦</span>Pulse AI<span class="badge">AI</span></button>
    <button class="navBtn" data-view="autoscan"><span class="icon">⌕</span>자동 코인 분류<span class="badge">NEW</span></button>
    <button class="navBtn" data-view="radar"><span class="icon">◉</span>LIVE RADAR<span class="badge">NEW</span></button>
    <button class="navBtn" data-view="analysis"><span class="icon">◫</span>통합 상세 분석</button>
    <button class="navBtn" data-view="multi"><span class="icon">▦</span>다중 차트</button>
    <button class="navBtn" data-view="intel"><span class="icon">◎</span>코인 정보</button>
  </div>
  <div class="group"><div class="groupTitle">Smart Money</div>
    <button class="navBtn" data-view="ict"><span class="icon">◇</span>ICT · IPDA 서사</button>
    <button class="navBtn" data-view="liquidity"><span class="icon">≈</span>유동성 랩</button>
    <button class="navBtn" data-view="structure"><span class="icon">⌁</span>시장 구조 랩</button>
  </div>
  <div class="group"><div class="groupTitle">Patterns & MTF</div>
    <button class="navBtn" data-view="surge"><span class="icon">↗</span>급등 패턴</button>
    <button class="navBtn" data-view="snapshot"><span class="icon">▣</span>MTF 스냅샷</button>
    <button class="navBtn" data-view="reaction"><span class="icon">⚡</span>반응 분석</button>
  </div>
  <div class="group"><div class="groupTitle">Validation</div>
    <button class="navBtn" data-view="backtest"><span class="icon">↺</span>백테스트</button>
    <button class="navBtn" data-view="historical"><span class="icon">◷</span>과거 검증</button>
    <button class="navBtn" data-view="independent"><span class="icon">✓</span>독립 검증</button>
    <button class="navBtn" data-view="temporal"><span class="icon">⏱</span>시간축 검증</button>
  </div>
  <div class="group"><div class="groupTitle">Research Tools</div>
    <button class="navBtn" data-view="patterns"><span class="icon">△</span>패턴 검증</button>
    <button class="navBtn" data-view="trendline"><span class="icon">╱</span>추세선 연구</button>
    <button class="navBtn" data-view="diagnostics"><span class="icon">⚙</span>진단 센터</button>
    <button class="navBtn" data-view="featurediag"><span class="icon">≡</span>기능 진단</button>
  </div>
  <div class="quick"><b>빠른 사용법</b><small>종목과 프리셋은 화면을 이동해도 유지됩니다.<br><span class="kbd">ESC</span> 메뉴 닫기</small></div>
</aside>
<main class="main">
  <header class="topbar">
    <button class="menuBtn" id="menuBtn" aria-label="전체 메뉴 열기">☰</button>
    <div class="topTitle"><b id="pageTitle">시장 스캐너</b><span id="pageDesc">현물·선물 전체 종목 탐색</span></div>
    <span class="stateBadge" id="dataState" data-pulse-data-state="live" data-severity="ok">실시간</span>
    <select class="presetSelect" id="preset" aria-label="차트 프리셋"><option value="clean">Clean</option><option value="structure">Structure</option><option value="smc">SMC</option><option value="dante">Dante</option><option value="full">Full</option></select>
    <div class="symbolBox"><input id="symbol" value="BTCUSDT" aria-label="symbol"><button class="go" id="go">적용</button></div>
    <button class="openTab" id="openTab">새 탭 ↗</button>
  </header>
  <section class="frameWrap"><div class="loading" id="loading">화면 불러오는 중…</div><iframe class="frame" id="frame" title="PulseRadar module"></iframe></section>
</main>
</div>
<nav class="mobileNav" aria-label="모바일 핵심 메뉴">
  <button class="mBtn" data-view="pulseai"><span>✦</span>Pulse AI</button>
  <button class="mBtn" data-view="radar"><span>◉</span>Radar</button>
  <button class="mBtn" data-view="analysis"><span>◫</span>차트</button>
  <button class="mBtn" data-view="multi"><span>▦</span>MTF</button>
  <button class="mBtn" data-view="structure"><span>⌁</span>구조</button>
  <button class="mBtn" id="moreBtn"><span>☰</span>전체</button>
</nav>
</body>
</html>
