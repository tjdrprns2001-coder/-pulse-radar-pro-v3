<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PulseRadar Pro v3</title>
<style>
:root{--bg:#050a11;--panel:#0b1420;--panel2:#0f1b2a;--line:#20344b;--txt:#edf5ff;--muted:#8296ad;--blue:#4f8cff;--green:#34d399;--amber:#fbbf24;--red:#fb7185;--sidebar:254px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{height:100%;display:grid;grid-template-columns:var(--sidebar) 1fr;overflow:hidden}.side{height:100%;background:linear-gradient(180deg,#08121f,#060c14);border-right:1px solid var(--line);padding:14px 10px 18px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#4f8cff,#7c3aed);display:grid;place-items:center;font-weight:950;box-shadow:0 8px 28px rgba(79,140,255,.25)}.brand b{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.group{margin:10px 0}.groupTitle{padding:7px 9px;color:#60758d;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.navBtn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#b9c8d8;border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;font-size:12px;margin:2px 0}.navBtn:hover{background:#0f1d2d;color:#fff}.navBtn.active{background:#153153;color:#fff;box-shadow:inset 0 0 0 1px #315a89}.icon{width:22px;text-align:center;font-size:14px}.badge{margin-left:auto;font-size:8px;color:#88a4c2;border:1px solid #2d4764;border-radius:99px;padding:2px 5px}.main{height:100%;min-width:0;display:grid;grid-template-rows:auto 1fr;background:radial-gradient(circle at top right,rgba(79,140,255,.07),transparent 30%),var(--bg)}.topbar{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(6,12,20,.92);backdrop-filter:blur(16px);z-index:20}.menuBtn{display:none}.topTitle{min-width:150px}.topTitle b{display:block;font-size:13px}.topTitle span{color:var(--muted);font-size:9px}.symbolBox{margin-left:auto;display:flex;align-items:center;gap:6px;background:#09131f;border:1px solid var(--line);border-radius:11px;padding:4px}.symbolBox input{width:110px;border:0;outline:0;background:transparent;color:#fff;text-transform:uppercase;padding:7px 8px;font-weight:800}.go{border:0;background:#1f64e8;color:#fff;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}.openTab{border:1px solid var(--line);background:#0b1624;color:#d7e5f4;border-radius:9px;padding:8px 10px;cursor:pointer}.frameWrap{position:relative;min-height:0}.frame{width:100%;height:100%;border:0;background:#07101a;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#07101a;color:var(--muted);font-size:12px;z-index:2}.loading.hide{display:none}.drawerShade{display:none}.mobileNav{display:none}.quick{padding:10px 8px;margin-top:12px;border-top:1px solid #142438}.quick small{display:block;color:#71869d;font-size:9px;line-height:1.5}.quick b{display:block;font-size:11px;margin-bottom:4px}.kbd{border:1px solid #29415d;border-radius:6px;padding:1px 5px;font-size:8px;color:#90a7bd}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:60;left:0;top:0;bottom:0;width:278px;transform:translateX(-102%);transition:.22s ease;box-shadow:24px 0 70px rgba(0,0,0,.45)}.side.open{transform:none}.drawerShade{display:block;position:fixed;z-index:55;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s}.drawerShade.open{opacity:1;pointer-events:auto}.menuBtn{display:inline-flex;border:1px solid var(--line);background:#0c1724;color:#fff;border-radius:9px;padding:8px 10px}.topTitle{min-width:0}.symbolBox{margin-left:auto}.main{padding-bottom:58px}.mobileNav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:45;bottom:0;left:0;right:0;height:58px;padding-bottom:env(safe-area-inset-bottom);background:rgba(7,14,23,.97);border-top:1px solid var(--line);backdrop-filter:blur(16px)}.mBtn{border:0;background:transparent;color:#7388a0;font-size:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px}.mBtn span{font-size:16px}.mBtn.active{color:#fff}.openTab{display:none}}
@media(max-width:520px){.topbar{padding:8px}.topTitle span{display:none}.symbolBox input{width:82px}.go{padding:7px 8px}.topTitle b{font-size:12px}}
</style>
</head>
<body>
<div class="drawerShade" id="shade"></div>
<div class="app">
<aside class="side" id="side">
  <div class="brand"><div class="logo">P</div><div><b>PulseRadar Pro v3</b><small>Unified Trading Research Workspace</small></div></div>
  <div class="group">
    <div class="groupTitle">Core</div>
    <button class="navBtn active" data-view="scanner"><span class="icon">⌁</span>시장 스캐너<span class="badge">LIVE</span></button>
    <button class="navBtn" data-view="analysis"><span class="icon">◫</span>통합 상세 분석</button>
    <button class="navBtn" data-view="intel"><span class="icon">◎</span>코인 정보</button>
  </div>
  <div class="group">
    <div class="groupTitle">Smart Money</div>
    <button class="navBtn" data-view="ict"><span class="icon">◇</span>ICT · IPDA 서사</button>
    <button class="navBtn" data-view="liquidity"><span class="icon">≈</span>유동성 랩</button>
    <button class="navBtn" data-view="structure"><span class="icon">⌁</span>시장 구조 랩</button>
  </div>
  <div class="group">
    <div class="groupTitle">Patterns & Surge</div>
    <button class="navBtn" data-view="surge"><span class="icon">↗</span>급등 패턴</button>
    <button class="navBtn" data-view="snapshot"><span class="icon">▣</span>MTF 스냅샷</button>
    <button class="navBtn" data-view="reaction"><span class="icon">⚡</span>반응 분석</button>
  </div>
  <div class="group">
    <div class="groupTitle">Validation</div>
    <button class="navBtn" data-view="backtest"><span class="icon">↺</span>백테스트</button>
    <button class="navBtn" data-view="historical"><span class="icon">◷</span>과거 검증</button>
    <button class="navBtn" data-view="independent"><span class="icon">✓</span>독립 검증</button>
    <button class="navBtn" data-view="temporal"><span class="icon">⏱</span>시간축 검증</button>
  </div>
  <div class="group">
    <div class="groupTitle">Research Tools</div>
    <button class="navBtn" data-view="patterns"><span class="icon">△</span>패턴 검증</button>
    <button class="navBtn" data-view="trendline"><span class="icon">╱</span>추세선 연구</button>
    <button class="navBtn" data-view="diagnostics"><span class="icon">⚙</span>진단 센터</button>
    <button class="navBtn" data-view="featurediag"><span class="icon">≡</span>기능 진단</button>
  </div>
  <div class="quick"><b>빠른 사용법</b><small>상단에서 종목을 바꾸면 새로 여는 분석 화면에 같은 심볼이 자동 적용됩니다.<br><span class="kbd">ESC</span> 모바일 메뉴 닫기</small></div>
</aside>
<main class="main">
  <header class="topbar">
    <button class="menuBtn" id="menuBtn">☰</button>
    <div class="topTitle"><b id="pageTitle">시장 스캐너</b><span id="pageDesc">현물·선물 전체 종목 탐색</span></div>
    <div class="symbolBox"><input id="symbol" value="BTCUSDT" aria-label="symbol"><button class="go" id="go">적용</button></div>
    <button class="openTab" id="openTab">새 탭 ↗</button>
  </header>
  <section class="frameWrap"><div class="loading" id="loading">화면 불러오는 중…</div><iframe class="frame" id="frame" title="PulseRadar module"></iframe></section>
</main>
</div>
<nav class="mobileNav">
  <button class="mBtn active" data-view="scanner"><span>⌁</span>스캐너</button>
  <button class="mBtn" data-view="analysis"><span>◫</span>분석</button>
  <button class="mBtn" data-view="ict"><span>◇</span>ICT</button>
  <button class="mBtn" data-view="surge"><span>↗</span>패턴</button>
  <button class="mBtn" id="moreBtn"><span>☰</span>전체</button>
</nav>
<script>
const V={
 scanner:{title:'시장 스캐너',desc:'현물·선물 전체 종목 탐색',path:'/scanner-shell-v13.html'},
 analysis:{title:'통합 상세 분석',desc:'구조 · SMC · 단테 · MTF · 모멘텀',path:'/technique-lab.html'},
 intel:{title:'코인 정보',desc:'종목 정보 · 일정 · 데이터',path:'/coin-intel.html'},
 ict:{title:'ICT · IPDA 서사',desc:'유동성 · MSS/CISD · PD Array · 프렉탈',path:'/ict-narrative-lab.html'},
 liquidity:{title:'유동성 랩',desc:'Liquidity · FVG · Sweep 연구',path:'/liquidity-lab.html'},
 structure:{title:'시장 구조 랩',desc:'스윙 · BOS · CHoCH · 구조 연구',path:'/structure-lab.html'},
 surge:{title:'급등 패턴',desc:'PRE-SURGE · 급등 전후 패턴',path:'/surge-pattern-lab.html'},
 snapshot:{title:'MTF 스냅샷',desc:'다중 타임프레임 구조 스냅샷',path:'/snapshot-analysis.html'},
 reaction:{title:'반응 분석',desc:'레벨 반응 · 변위 · 추세 반응',path:'/reaction-lab.html'},
 backtest:{title:'백테스트',desc:'과거 구간 전략 검증',path:'/backtest.html'},
 historical:{title:'과거 검증',desc:'Historical structure validation',path:'/historical-validation.html'},
 independent:{title:'독립 검증',desc:'독립 데이터셋 검증',path:'/independent-validation.html'},
 temporal:{title:'시간축 검증',desc:'Temporal stability validation',path:'/temporal-validation.html'},
 patterns:{title:'패턴 검증',desc:'차트 패턴 품질 · Calibration',path:'/v311-validation.html'},
 trendline:{title:'추세선 연구',desc:'Trendline study & visual validation',path:'/trendline-study.html'},
 diagnostics:{title:'진단 센터',desc:'API · 데이터 · 분석 모듈 상태',path:'/diagnostics.html'},
 featurediag:{title:'기능 진단',desc:'세부 기능별 상태 점검',path:'/feature-diagnostics.html'}
};
const $=id=>document.getElementById(id), frame=$('frame'), loading=$('loading'), side=$('side'), shade=$('shade');
let current='scanner';
function cleanSymbol(v){v=String(v||'BTCUSDT').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v)return'BTCUSDT';if(!v.endsWith('USDT')&&v.length<=12)v+='USDT';return v}
function readRecent(){try{const a=JSON.parse(localStorage.getItem('pr_recent')||'[]');return Array.isArray(a)&&a[0]?a[0]:'BTCUSDT'}catch{return'BTCUSDT'}}
function symbol(){return cleanSymbol($('symbol').value)}
function srcFor(key){const o=V[key]||V.scanner,s=symbol(),join=o.path.includes('?')?'&':'?';return o.path+join+'symbol='+encodeURIComponent(s)+'&shell=1'}
function injectShellMode(){try{const d=frame.contentDocument;if(!d)return;let st=d.getElementById('pulseShellInjected');if(!st){st=d.createElement('style');st.id='pulseShellInjected';st.textContent='header.top>nav,header.top>.links,header .nav,header .links{display:none!important} body{min-height:100vh!important}';d.head.appendChild(st)}const links=d.querySelectorAll('a[href="/"],a[href="/scanner-shell-v13.html"]');links.forEach(a=>{a.onclick=e=>{e.preventDefault();parent.postMessage({type:"pulse-nav",view:"scanner"},"*")}})}catch(e){}}
function setView(key,push=true){if(!V[key])key='scanner';current=key;const o=V[key];$('pageTitle').textContent=o.title;$('pageDesc').textContent=o.desc;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));loading.classList.remove('hide');frame.src=srcFor(key);if(push){const u=new URL(location.href);u.searchParams.set('view',key);u.searchParams.set('symbol',symbol());history.replaceState(null,'',u)}closeMenu()}
function applySymbol(){const s=symbol();$('symbol').value=s;setView(current,true)}
function openMenu(){side.classList.add('open');shade.classList.add('open')}function closeMenu(){side.classList.remove('open');shade.classList.remove('open')}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view,true)));
$('menuBtn').onclick=openMenu;$('moreBtn').onclick=openMenu;shade.onclick=closeMenu;$('go').onclick=applySymbol;$('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')applySymbol()});$('openTab').onclick=()=>window.open(srcFor(current),'_blank');
frame.addEventListener('load',()=>{loading.classList.add('hide');injectShellMode()});
window.addEventListener('message',e=>{if(e.data?.type==='pulse-nav'&&V[e.data.view])setView(e.data.view,true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
const q=new URLSearchParams(location.search);$('symbol').value=cleanSymbol(q.get('symbol')||readRecent());setView(q.get('view')||'scanner',false);
</script>
</body></html>
