<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar · Historical Backfill</title><style>:root{--bg:#06101a;--p:#0b1622;--l:#20344b;--t:#edf5ff;--m:#8ea4bb;--g:#2fd6a1;--a:#ffc45f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px system-ui}.app{max-width:900px;margin:auto;padding:10px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}input,select,.btn{width:100%;padding:10px;border:1px solid var(--l);border-radius:9px;background:#08131f;color:#fff}.btn{background:#123d70;cursor:pointer}.muted{color:var(--m);line-height:1.55}.stat{font-size:20px;font-weight:850}.good{color:var(--g)}.warn{color:var(--a)}pre{white-space:pre-wrap;word-break:break-word;font:11px ui-monospace;max-height:340px;overflow:auto}@media(max-width:600px){.app{padding:7px}.row>*{min-width:46%}}</style><script src="/lib/signal-quality/outcome-recorder.js"></script><script src="/lib/signal-quality/historical-backfill.js"></script><script src="/lib/signal-quality/regime.js"></script><script src="/ui/signal-quality/historical-backfill-ui.js" defer></script></head><body><main class="app"><header><h1 style="margin-bottom:3px">Historical Outcome Backfill</h1><div class="muted">과거 OHLCV를 재생해 BACKTESTED 표본만 생성합니다. LIVE_VALIDATED와 합쳐서 표시하지 않습니다.</div></header><section class="card"><div class="row"><input id="symbol" value="BTCUSDT" aria-label="symbol"><select id="tf"><option>15m</option><option>1h</option><option selected>4h</option><option>1d</option></select><select id="limit"><option>300</option><option selected>500</option><option>1000</option></select><button id="run" class="btn">BACKTESTED 생성</button></div><div id="status" class="muted" style="margin-top:9px">대기</div></section><section class="row"><div class="card"><div class="muted">생성</div><
