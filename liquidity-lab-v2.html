<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar · 유동성 랩</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="app"></iframe><script>const q=location.search||'?symbol=BTCUSDT',f=document.getElementById('app');f.src='/liquidity-lab.html'+q;const IDS=['flow','source','target','buy','sell','score','tfgrid','story','priority','pools'];function patch(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||w.__liqAliasFix)return;w.__liqAliasFix=true;const box=d.createElement('div');box.style.display='none';box.id='liq-alias-box';d.body.appendChild(box);for(const id of IDS){const real=d.getElementById(id);if(!real)continue;const alias=d.createElement(real.tagName==='SPAN'?'span':'div');alias.setAttribute('id','#'+id);box.appendChild(alias);const sync=()=>{if(id==='tfgrid'||id==='priority'||id==='pools')real.innerHTML=alias.innerHTML;else real.textContent=alias.textContent};new MutationObserver(sync).observe(alias,{subtree:true,childList:true,characterData:true});sync()}if(w.run)setTimeout(()=>w.run(),80)}catch(e){}}f.addEventListener('load',()=>{setTimeout(patch,80);setTimeout(patch,700)});</script></body></html>
