<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;min-width:0;background:#06101a;overflow:hidden;-webkit-text-size-adjust:100%}iframe{position:fixed;inset:0;display:block;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="app" title="PulseRadar Pro 통합 분석"></iframe><script>
const q=new URLSearchParams(location.search),initSymbol=(q.get('symbol')||'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g,''),initTf=['15m','1h','4h','1d'].includes(q.get('tf'))?q.get('tf'):'4h',initMode=['snapshot','detail'].includes(q.get('mode'))?q.get('mode'):'snapshot';
const frame=document.getElementById('app');frame.src=`/analysis-v3.html?symbol=${encodeURIComponent(initSymbol)}&tf=${initTf}&mode=${initMode}`;
let derivTimer=null,liveTimer=null,stopped=false;
function doc(){try{return frame.contentDocument}catch{return null}}
function state(){const d=doc();let symbol=initSymbol,tf=initTf;if(d){const s=d.getElementById('symbol');if(s?.value)symbol=String(s.value).toUpperCase().replace(/[^A-Z0-9]/g,'')||symbol;const a=d.querySelector('[data-tf].active');if(a?.dataset?.tf)tf=a.dataset.tf}return{symbol,tf}}
function set(id,text,cls){const d=doc(),e=d&&d.getElementById(id);if(!e)return;if(text!=null)e.textContent=text;if(cls!=null)e.className=cls}
function comp(v){v=Number(v);return Number.isFinite(v)?Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}).format(v):'-'}
function fmt(v){v=Number(v);if(!Number.isFinite(v))return'-';return v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6)}
const n=v=>{v=Number(v);return Number.isFinite(v)?v:null};
async function api(url){const r=await fetch(url,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.reason||j.error||`HTTP ${r.status}`);return j}
async function publicJson(url){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),5500);try{const r=await fetch(url,{cache:'no-store',signal:ac.signal,mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function pct(a,b){a=n(a);b=n(b);return a!=null&&b!=null&&a!==0?(b-a)/Math.abs(a)*100:null}
function avg(a){const v=a.filter(Number.isFinite);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
function derivePressure(oi24,fundPct,taker){const flags=[];if(oi24!=null&&oi24>=15)flags.push('OI 증가');if(oi24!=null&&oi24<=-15)flags.push('OI 감소');if(fundPct!=null&&fundPct>=.03)flags.push('양(+) 펀딩 쏠림');if(fundPct!=null&&fundPct<=-.03)flags.push('음(-) 펀딩 쏠림');if(taker!=null&&taker>=1.15)flags.push('공격적 매수 우위');if(taker!=null&&taker<=.87)flags.push('공격적 매도 우위');return{pressure:flags.length>=3?'레버리지 과열':flags.length?'레버리지 확대':'중립',flags}}
async function directBinance(symbol){const base='https://fapi.binance.com',enc=encodeURIComponent(symbol);const [pR,oR,hR,tR]=await Promise.allSettled([publicJson(`${base}/fapi/v1/premiumIndex?symbol=${enc}`),publicJson(`${base}/fapi/v1/openInterest?symbol=${enc}`),publicJson(`${base}/futures/data/openInterestHist?symbol=${enc}&period=1h&limit=25`),publicJson(`${base}/futures/data/takerlongshortRatio?symbol=${enc}&period=1h&limit=12`)]);const p=pR.status==='fulfilled'?pR.value:{},o=oR.status==='fulfilled'?oR.value:{},h=hR.status==='fulfilled'&&Array.isArray(hR.value)?hR.value:[],t=tR.status==='fulfilled'&&Array.isArray(tR.value)?tR.value:[];const mark=n(p.markPrice),contracts=n(o.openInterest),oiUsd=mark!=null&&contracts!=null?mark*contracts:null,oi24=h.length>1?pct(h[0]?.sumOpenInterestValue??h[0]?.sumOpenInterest,h.at(-1)?.sumOpenInterestValue??h.at(-1)?.sumOpenInterest):null,fund=n(p.lastFundingRate),fundPct=fund!=null?fund*100:null,taker=avg(t.map(x=>n(x.buySellRatio)).filter(Number.isFinite)),pr=derivePressure(oi24,fundPct,taker),available=[mark,contracts,oi24,fundPct,taker].some(Number.isFinite);return{ok:true,available,openInterestContracts:contracts,openInterestUsdApprox:oiUsd,openInterestChange24hPct:oi24,fundingRatePct:fundPct,takerBuySellRatio:taker,pressure:pr.pressure,flags:pr.flags,source:'Binance USD-M browser public REST'}}
async function directOkx(symbol){const base=String(symbol).replace(/USDT$/,''),instId=`${base}-USDT-SWAP`,host='https://www.okx.com';const [oiR,fR,mR,tR]=await Promise.allSettled([publicJson(`${host}/api/v5/public/open-interest?instType=SWAP&instId=${encodeURIComponent(instId)}`),publicJson(`${host}/api/v5/public/funding-rate?instId=${encodeURIComponent(instId)}`),publicJson(`${host}/api/v5/public/mark-price?instType=SWAP&instId=${encodeURIComponent(instId)}`),publicJson(`${host}/api/v5/market/ticker?instId=${encodeURIComponent(instId)}`)]);const oi=oiR.status==='fulfilled'?oiR.value?.data?.[0]:null,f=fR.status==='fulfilled'?fR.value?.data?.[0]:null,m=mR.status==='fulfilled'?mR.value?.data?.[0]:null,t=tR.status==='fulfilled'?tR.value?.data?.[0]:null;if(!oi)throw Error('OKX browser OI unavailable');const mark=n(m?.markPx??t?.last),oiCcy=n(oi.oiCcy),contracts=n(oi.oi),oiUsd=oiCcy!=null&&mark!=null?oiCcy*mark:null,fund=n(f?.fundingRate),fundPct=fund!=null?fund*100:null,pr=derivePressure(null,fundPct,null);return{ok:true,available:true,openInterestContracts:contracts,openInterestUsdApprox:oiUsd,openInterestChange24hPct:null,fundingRatePct:fundPct,takerBuySellRatio:null,pressure:pr.pressure,flags:pr.flags,source:'OKX browser public REST',fallback:true}}
function oiKey(symbol){return`pr_oi_hist_${symbol}`}
function rememberOi(symbol,value){value=Number(value);if(!Number.isFinite(value)||value<=0)return null;const now=Date.now(),key=oiKey(symbol);let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!Array.isArray(arr))arr=[];arr=arr.filter(x=>x&&Number.isFinite(+x.t)&&Number.isFinite(+x.v)&&now-(+x.t)<30*60*60*1000);const last=arr.at(-1);if(!last||now-(+last.t)>5*60*1000)arr.push({t:now,v:value});try{localStorage.setItem(key,JSON.stringify(arr.slice(-400)))}catch{}const target=now-24*60*60*1000,cands=arr.filter(x=>now-(+x.t)>=20*60*60*1000);if(!cands.length)return null;let best=cands[0],dist=Math.abs((+best.t)-target);for(const x of cands){const z=Math.abs((+x.t)-target);if(z<dist){best=x;dist=z}}const old=+best.v;return old>0?(value-old)/old*100:null}
function renderDeriv(d,symbol){if(!d?.available){set('pressure','미지원');set('pressureNote',d?.reason||'파생 데이터 없음');set('oi','-');set('oi24','-');set('fund','-');set('taker','-');set('derSource','-');return}set('pressure',d.pressure||'중립');set('pressureNote',(d.flags||[]).slice(0,2).join(' · ')||'뚜렷한 쏠림 없음');set('oi',Number.isFinite(d.openInterestUsdApprox)?'$'+comp(d.openInterestUsdApprox):comp(d.openInterestContracts));let oi24=Number.isFinite(d.openInterestChange24hPct)?d.openInterestChange24hPct:null;if(oi24==null&&Number.isFinite(d.openInterestUsdApprox))oi24=rememberOi(symbol,d.openInterestUsdApprox);set('oi24',Number.isFinite(oi24)?`${oi24>=0?'+':''}${oi24.toFixed(1)}%`:'수집 중');set('fund',Number.isFinite(d.fundingRatePct)?d.fundingRatePct.toFixed(4)+'%':'-');set('taker',Number.isFinite(d.takerBuySellRatio)?d.takerBuySellRatio.toFixed(2)+'x':'미지원');set('derSource',d.source||'공개 파생 데이터')}
async function pullDeriv(){const {symbol}=state();let d=null;try{d=await api(`/api/htf?mode=deriv&symbol=${encodeURIComponent(symbol)}&_=${Date.now()}`)}catch{}if(!d?.available){try{d=await directBinance(symbol)}catch{}}if(!d?.available){try{d=await directOkx(symbol)}catch{}}if(d?.available)renderDeriv(d,symbol);else{set('pressure','재시도');set('pressureNote','파생 데이터 재연결 중');set('derSource','-')}}
async function pullLive(){const {symbol,tf}=state();try{const d=await api(`/api/htf?mode=live&symbol=${encodeURIComponent(symbol)}&interval=${tf}&_=${Date.now()}`);if(!d.available)return;set('ohlc',`O ${fmt(d.open)} · H ${fmt(d.high)} · L ${fmt(d.low)} · C ${fmt(d.close)}`);set('liveVol',Number.isFinite(d.projectedVolumeRatio)?d.projectedVolumeRatio.toFixed(2)+'x':'-');const dd=doc(),live=dd&&dd.getElementById('live');if(live&&!/WebSocket 실시간|실시간 연결/.test(live.textContent||'')){live.textContent='● REST 실시간';live.className='badge ok'}}catch{const dd=doc(),live=dd&&dd.getElementById('live');if(live&&/연결 오류|연결 준비|재연결|REST/.test(live.textContent||'')){live.textContent='● REST 재시도';live.className='badge warn'}}}
function injectResponsive(){const d=doc();if(!d||d.getElementById('mobile-responsive-fix'))return;let meta=d.querySelector('meta[name="viewport"]');if(!meta){meta=d.createElement('meta');meta.name='viewport';d.head.appendChild(meta)}meta.content='width=device-width,initial-scale=1,viewport-fit=cover';const st=d.createElement('style');st.id='mobile-responsive-fix';st.textContent=`html,body{width:100%!important;max-width:100vw!important;min-width:0!important;overflow-x:hidden!important;-webkit-text-size-adjust:100%!important}body{margin:0!important}.app{width:100%!important;max-width:100vw!important;min-width:0!important;margin:0 auto!important}.layout,.layout>section,.card,.side,.chartWrap,.indStack,.detail,.rows,.row,.scoreGrid,.mtf{min-width:0!important;max-width:100%!important}.chartWrap,.indCanvas{width:100%!important}.head>*{min-width:0!important}.row b,.score,.mini,.comment,.watch{min-width:0!important;overflow-wrap:anywhere!important;word-break:keep-all!important}@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)!important}.side{position:static!important;width:100%!important}}@media(max-width:700px){html,body{font-size:14px!important}.app{padding:5px!important}.top{width:100%!important;align-items:stretch!important}.brand{font-size:18px!important}.sub{font-size:10px!important;line-height:1.4!important}.nav{width:100%!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;overflow:visible!important}.nav .btn{padding:8px 4px!important;text-align:center!important;font-size:11px!important;white-space:nowrap!important}.toolbar{width:100%!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px!important}.toolbar>input{grid-column:1/-1!important;width:100%!important;min-width:0!important}.toolbar .tfs{grid-column:1/-1!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;width:100%!important}.toolbar .tfs .btn{width:100%!important;padding:8px 3px!important}.toolbar .modes{grid-column:1/3!important;width:100%!important;margin:0!important;display:grid!important;grid-template-columns:1fr 1fr!important}.toolbar .modes .btn{width:100%!important}.toolbar>#fit{grid-column:3!important}.toolbar>#run{grid-column:4!important}.toolbar>#live,.toolbar>#status{grid-column:1/-1!important;justify-self:start!important}.head{flex-direction:column!important;align-items:stretch!important}.toggles{width:100%!important;max-width:100%!important;display:flex!important;overflow-x:auto!important;overflow-y:hidden!important;flex-wrap:nowrap!important;padding-bottom:3px!important;-webkit-overflow-scrolling:touch!important}.toggles label{flex:0 0 auto!important;font-size:10px!important}.chartWrap{height:min(58vh,470px)!important;min-height:360px!important}.legend{font-size:8px!important;line-height:1.35!important;white-space:normal!important}.scoreGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.score strong{font-size:18px!important}.row{grid-template-columns:minmax(0,112px) minmax(0,1fr)!important;gap:6px!important;padding:8px!important}.row b{text-align:right!important;font-size:10px!important}.mtf{grid-template-columns:repeat(2,minmax(0,1fr))!important}.detail.show{grid-template-columns:1fr!important}.indCanvas{height:100px!important}.side{padding:8px!important}.comment p,.watch div{font-size:10px!important}}`;d.head.appendChild(st);requestAnimationFrame(()=>{try{d.documentElement.scrollLeft=0;d.body.scrollLeft=0;window.scrollTo(0,0)}catch{}})}
function start(){if(stopped)return;injectResponsive();clearInterval(derivTimer);clearInterval(liveTimer);pullDeriv();pullLive();derivTimer=setInterval(pullDeriv,10000);liveTimer=setInterval(pullLive,3000)}
frame.addEventListener('load',()=>{injectResponsive();setTimeout(start,700);setTimeout(injectResponsive,1800)});window.addEventListener('resize',injectResponsive);window.addEventListener('orientationchange',()=>setTimeout(injectResponsive,200));window.addEventListener('beforeunload',()=>{stopped=true;clearInterval(derivTimer);clearInterval(liveTimer)});
</script></body></html>
