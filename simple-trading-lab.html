<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><link rel="stylesheet" href="/ui/pulse-child-normalize.css?v=20260922-stb1"><title>PulseRadar · 클래식 패턴 실전 랩</title><link rel="stylesheet" href="/ui/simple-trading/simple-trading-lab.css?v=20260922-stb1"></head><body><main class="stbApp">
<header class="stbTop"><div><b>클래식 패턴 실전 랩</b><small>Simple Trading Book 기반 · 캔들 · 전략 1~7 · 차트 패턴 · 한글 판정</small></div><span class="stbSource">책 규칙 + 자동화 근사</span></header>
<section class="stbToolbar"><input id="symbol" value="BTCUSDT" autocomplete="off" spellcheck="false" aria-label="종목"><select id="tf" aria-label="시간봉"><option>5m</option><option>15m</option><option selected>1h</option><option>4h</option><option>12h</option><option>1d</option><option>3d</option><option>1w</option></select><button id="run" class="stbBtn primary">분석 실행</button><span id="status">대기</span></section>
<section class="stbStats"><div><span>현재 대표 패턴</span><b id="bestPattern">-</b></div><div><span>단계</span><b id="bestStage">-</b></div><div><span>책 전략</span><b id="bestStrategy">-</b></div><div><span>추격 경고</span><b id="chaseRisk">-</b></div></section>
<section class="stbChartCard"><div id="chart" class="stbChart"></div><div id="chartFallback" class="stbFallback" hidden>차트 데이터를 불러오지 못했습니다.</div></section>
<nav class="stbTabs" aria-label="분석 탭"><button class="active" data-tab="summary">요약</button><button data-tab="candles">캔들</button><button data-tab="patterns">차트 패턴</button><button data-tab="strategies">전략 1~7</button></nav>
<section id="summary" class="tabPanel active"><div class="stbNotice"><b>판정 원칙</b><p>책에서 설명한 형태·돌파·리테스트 개념을 보존합니다. 책에 숫자 임계값이 없는 항목은 자동 탐지를 위해 ATR·스윙·허용오차를 사용한 근사 판정으로 표시합니다.</p></div><div id="summaryCards" class="stbGrid"></div></section>
<section id="candles" class="tabPanel"><div id="candleCards" class="stbGrid"></div></section>
<section id="patterns" class="tabPanel"><div id="patternCards" class="stbGrid"></div></section>
<section id="strategies" class="tabPanel"><div id="strategyCards" class="stbGrid"></div></section>
<footer>교육·연구용 · 자동 주문 없음 · 패턴 완성도는 수익 확률이 아님</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script><script src="/ui/chart/chart-data.js"></script><script src="/ui/chart/chart-plugins.js"></script><script src="/ui/chart/chart-core.js"></script><script src="/ui/simple-trading/simple-trading-engine.js?v=20260922-stb1"></script><script src="/ui/chart/plugins/simple-trading-plugin.js?v=20260922-stb1"></script><script src="/ui/simple-trading/simple-trading-lab.js?v=20260922-stb1"></script></body></html>
