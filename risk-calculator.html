<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar · Risk Research Calculator</title><style>:root{--bg:#06101a;--p:#0b1622;--l:#20344b;--t:#eef5ff;--m:#8ea4bb;--b:#2c79e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px system-ui}.app{max-width:850px;margin:auto;padding:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{color:var(--m);font-size:11px}input{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--l);border-radius:9px;background:#08131f;color:#fff}.btn{display:inline-block;padding:9px 12px;border:1px solid #35649a;border-radius:9px;background:#123d70;color:#fff;text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#08131f;border:1px solid var(--l);border-radius:10px;padding:9px}.metric span{display:block;color:var(--m);font-size:10px}.metric b{font-size:17px}.note{color:var(--m);line-height:1.6}.targets{line-height:1.8}@media(max-width:620px){.grid,.metrics{grid-template-columns:1fr 1fr}.app{padding:7px}}</style><script src="/lib/signal-quality/risk-calculator.js"></script></head><body><main class="app"><header><h1 style="margin-bottom:3px">Risk Research Calculator</h1><div class="note">참고용(reference-only) 계산기입니다. 거래소 연결 없이 입력한 숫자의 R:R·리스크 규모만 계산합니다.</div></header><section class="card grid"><label>계좌 규모<input id="account" type="number" value="10000" min="0" step="any"></label><label>최대 리스크 %<input id="risk" type="number" value="1" min="0" step="0.1"></label><label>Entry<input id="entry" type="number" value="100" step="any"></label><label>Invalidation<input id="stop" type="number" value="95" step="any"></label><label>Targets (쉼표)<input id="targets" value="110,120"></label><label>부분청산 비중 % (쉼표)<input id="weights" value="50,50"></label><button id="calc" class="btn">계산</button><a class="btn" href="/">돌아가기</a></section><section class="card"><div class="metrics"><div class="metric"><span>Risk amount</span><b id="riskAmt">—</b></div><div class="metric"><span>Quantity</span><b id="qty">—</b></div><div class="metric"><span>Notional</span><b id="notional">—</b></div><div class="metric"><span>Stop distance</span><b id="distance">—</b></div><div class="metric"><span>Stop %</span><b id="stopPct">—</b></div><div class="metric"><span>Side geometry</span><b id="side">—</b></div></div><div id="targetRows" class="targets" style="margin-top:10px"></div></section><section class="card note">이 화면은 교육·연구용 산술 도구이며 특정 포지션 진입을 권하지 않습니다. 계산 결과는 입력값에만 의존합니다.</section></main><script>(()=>{const R=window.PulseRiskCalculator,$=id=>document.getElementById(id),vals=id=>$(id).value.split(',').map(Number).filter(Number.isFinite),f=(v,d=4)=>Number.isFinite(v)?Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d}):'—';function run(){const r=R.calculate({accountSize:+$('account').value,riskPct:+$('risk').value,entry:+$('entry').value,invalidation:+$('stop').value,targets:vals('targets'),exitWeights:vals('weights')});$('riskAmt').textContent=f(r.riskAmount);$('qty').textContent=f(r.quantity,8);$('notional').textContent=f(r.notional);$('distance').textContent=f(r.stopDistance,8);$('stopPct').textContent=Number.isFinite(r.stopPct)?f(r.stopPct)+'%':'—';$('side').textContent=r.valid?r.side.toUpperCase():'INVALID';$('targetRows').innerHTML=r.valid?r.stagedExits.map((x,i)=>`T${i+1} ${f(x.target,8)} · R:R ${f(x.rewardRisk,2)} · 비중 ${f(x.weightPct,1)}% · 수량 ${f(x.quantity,8)}`).join('<br>'):'Entry와 Invalidation을 다르게 입력하세요.'}[$('account'),$('risk'),$('entry'),$('stop'),$('targets'),$('weights')].forEach(x=>x.addEventListener('input',run));$('calc').onclick=run;const q=new URLSearchParams(location.search);if(q.get('entry'))$('entry').value=q.get('entry');if(q.get('invalidation'))$('stop').value=q.get('invalidation');run()})();</script></body></html>
