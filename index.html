<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar</title><style>
:root{--bg:#07101a;--panel:#0d1724;--line:#22354d;--txt:#edf4ff;--muted:#8fa2ba;--blue:#4f8cff;--green:#35d69a;--red:#ff6577;--amber:#ffc45f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081424,#060b12);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}.app{max-width:1380px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{font-weight:900;font-size:20px}.muted{color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,.chip,input,select{border:1px solid var(--line);background:#0b1420;color:#fff;border-radius:10px;padding:9px 11px}.btn{cursor:pointer;text-decoration:none}.btn.primary{background:#1f64e8;border-color:#2f79ff;font-weight:800}.hero{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:10px;margin-bottom:10px}.card{background:rgba(13,23,36,.96);border:1px solid var(--line);border-radius:15px}.hero .card{padding:14px}.hero h2{margin:0 0 6px;font-size:19px}.stat b{display:block;font-size:23px;margin-top:4px}.toolbar{padding:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input{min-width:170px;flex:1}.toolbar .status{margin-left:auto}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);gap:10px}.panel{padding:12px}.tabs{display:flex;gap:7px;margin-bottom:10px}.tab{background:#0b1420;color:#c8d6e8;border:1px solid var(--line);border-radius:9px;padding:8px 11px}.tab.active{background:#16355c;border-color:#4f8cff}.tablebox{overflow:auto;max-height:690px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px 8px;border-bottom:1px solid #1a2a3f;font-size:12px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.sym{font-weight:850;cursor:pointer}.pill{font-size:10px;padding:4px 7px;border:1px solid #314a68;border-radius:999px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.chart{height:360px;overflow:hidden;border-radius:13px;background:#09111b;margin-bottom:10px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mini{padding:11px;background:#09131f;border:1px solid #20354f;border-radius:11px}.mini span{display:block;color:var(--muted);font-size:10px}.mini b{font-size:19px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sectionTitle h3{margin:0;font-size:14px}.details{margin-top:10px}.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #1d2e44;font-size:11px}.kv span{color:var(--muted)}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.footer{padding:14px 2px;color:#70859f;font-size:11px}@media(max-width:920px){.hero{grid-template-columns:1fr 1fr}.hero .intro{grid-column:1/-1}.layout{grid-template-columns:1fr}.chart{height:320px}}@media(max-width:600px){.app{padding:9px}.top{align-items:flex-start;flex-direction:column}.brand{font-size:18px}.hero{grid-template-columns:1fr 1fr}.hero .intro{grid-column:1/-1}.toolbar{align-items:stretch}.toolbar input,.toolbar select,.toolbar .btn{width:100%}.toolbar .status{margin-left:0}.summary{grid-template-columns:1fr 1fr}.chart{height:300px}.nav{width:100%}.nav .btn{flex:1;text-align:center}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">PulseRadar</div><div class="muted">복잡한 지표보다 먼저, 시장·구조·과열을 한눈에</div></div><nav class="nav"><a class="btn" href="/technique-lab.html">상세 분석</a><a class="btn" href="/historical-validation.html">검증 연구</a></nav></header>
<section class="hero"><div class="card intro"><h2>시장 스캐너</h2><div class="muted">현물을 우선 사용하고, 현물에 없는 종목은 Binance USD-M 무기한 선물 데이터를 사용합니다. 점수는 수익 확률이 아닙니다.</div></div><div class="card stat"><span class="muted">전체 종목</span><b id="statAll">-</b></div><div class="card stat"><span class="muted">필터 통과</span><b id="statPass">-</b></div><div class="card stat"><span class="muted">PRE 상위 10%</span><b id="statPre">-</b></div></section>
<section class="card toolbar"><input id="search" placeholder="BTC, ETH, STBL 검색"><select id="pageSize"><option>25</option><option selected>50</option><option>100</option></select><button id="refresh" class="btn primary">새로고침</button><span id="status" class="muted status">불러오는 중...</span></section>
<div class="layout"><section class="card panel"><div class="tabs"><button class="tab active" data-tab="ALL">전체</button><button class="tab" data-tab="SURGE">움직임 강함</button><button class="tab" data-tab="PRE">준비 단계</button></div><div class="tablebox"><table><thead><tr><th>종목</th><th>시장</th><th>가격</th><th>24h</th><th>거래대금</th><th>PRE</th><th>SURGE</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="actions"><button id="prev" class="btn">이전</button><span id="pageInfo" class="muted"></span><button id="next" class="btn">다음</button></div></section>
<aside><div id="tv" class="card chart"></div><section class="card panel"><div class="sectionTitle"><h3 id="selectedTitle">종목을 선택하세요</h3><span id="marketBadge" class="pill">-</span></div><div class="summary"><div class="mini"><span>SURGE</span><b id="dSurge">-</b></div><div class="mini"><span>PRE</span><b id="dPre">-</b></div><div class="mini"><span>신뢰도</span><b id="dGrade">-</b></div><div class="mini"><span>단계</span><b id="preStage">-</b></div></div><div class="details"><div class="kv"><span>5m</span><b id="tf5">-</b></div><div class="kv"><span>15m</span><b id="tf15">-</b></div><div class="kv"><span>1h</span><b id="tf1h">-</b></div><div class="kv"><span>위험 상태</span><b id="risk">-</b></div></div><div class="actions"><a id="detailLink" class="btn primary" href="/technique-lab.html">상세 구조 분석</a></div></section></aside></div><div class="footer">교육·연구용 · 자동 주문 없음 · 미래 수익을 보장하지 않음</div></main>
<script>
let rows=[],view=[],page=1,tab='ALL',selected=null;const $=id=>document.getElementById(id);const fmt=(v,d=2)=>Number.isFinite(+v)?(+v).toLocaleString('ko-KR',{maximumFractionDigits:d}):'-';const pct=v=>(+v>0?'+':'')+fmt(v,2)+'%';function price(v){v=+v;if(!Number.isFinite(v))return'-';return v>=100?fmt(v,2):v>=1?fmt(v,4):v.toPrecision(5)}
async function loadAll(){try{$('status').textContent='시장 데이터 불러오는 중...';const r=await fetch('/api/market?minVolume=500000',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||('HTTP '+r.status));rows=d.results||[];$('statAll').textContent=d.total??rows.length;$('statPass').textContent=d.eligible??rows.filter(x=>x.pass).length;$('statPre').textContent=rows.filter(x=>x.pass&&x.preTopPct!=null&&x.preTopPct<=10).length;$('status').textContent=`${rows.length}개 · 현물 ${d.spotCount??'-'} · 선물전용 ${d.futuresOnlyCount??'-'}`;apply();if(!selected){const f=rows.find(x=>x.symbol==='BTCUSDT')||rows[0];if(f)select(f)}}catch(e){$('status').textContent='데이터 오류: '+e.message}}
function apply(){const q=$('search').value.trim().toUpperCase();view=rows.filter(r=>(!q||r.symbol.includes(q))&&(tab==='ALL'||(tab==='SURGE'&&r.surgeScore>=60)||(tab==='PRE'&&r.pass&&r.preTopPct!=null&&r.preTopPct<=20))).sort((a,b)=>tab==='PRE'?((a.preRank??99999)-(b.preRank??99999)):Math.max(b.surgeScore,b.preScore)-Math.max(a.surgeScore,a.preScore));const size=+$('pageSize').value,total=Math.max(1,Math.ceil(view.length/size));page=Math.min(page,total);$('tbody').innerHTML=view.slice((page-1)*size,page*size).map(r=>`<tr><td><span class="sym" data-s="${r.symbol}">${r.symbol.replace('USDT','')}</span></td><td><span class="pill ${r.market==='futures'?'amber':'green'}">${r.market==='futures'?'선물':'현물'}</span></td><td>${price(r.price)}</td><td class="${r.change24>=0?'green':'red'}">${pct(r.change24)}</td><td>$${fmt(r.quoteVol24,0)}</td><td class="amber">${r.preRank?'#'+r.preRank:'-'}</td><td class="green">${r.surgeScore}</td></tr>`).join('');document.querySelectorAll('.sym').forEach(el=>el.onclick=()=>select(rows.find(r=>r.symbol===el.dataset.s)));$('pageInfo').textContent=`${page}/${total} · ${view.length}종목`}
async function select(r){selected=r;$('selectedTitle').textContent=r.symbol;$('marketBadge').textContent=r.market==='futures'?'선물 무기한':'현물';$('dSurge').textContent=r.surgeScore;$('dPre').textContent=r.preScore;$('detailLink').href='/technique-lab.html?symbol='+encodeURIComponent(r.symbol);tv(r.symbol,r.market);try{const x=await fetch('/api/detail?symbol='+encodeURIComponent(r.symbol),{cache:'no-store'}),d=await x.json();if(!x.ok||!d.ok)throw Error(d.error||('HTTP '+x.status));$('dSurge').textContent=d.surge?.score??'-';$('dPre').textContent=d.preSurge?.score??'-';$('dGrade').textContent=d.confidence?.grade??'-';$('preStage').textContent=d.preSurge?.stage??'-';const m=new Map((d.timeframes||[]).map(f=>[f.tf,f]));for(const [id,tf] of [['tf5','5m'],['tf15','15m'],['tf1h','1h']]){const f=m.get(tf);$(id).textContent=f?`RSI ${fmt(f.rsi14,0)} · Vol ${fmt(f.volRatio,1)}x`:'-'}$('risk').textContent=d.riskGate?.excluded?'위험 게이트':d.riskGate?.warn?.length?'주의':'통과'}catch(e){$('risk').textContent='정밀 분석 실패'}}
function tv(symbol,market='spot'){const box=$('tv');box.innerHTML='';const w=document.createElement('div');w.style.height='100%';w.className='tradingview-widget-container__widget';const s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';s.async=true;s.innerHTML=JSON.stringify({autosize:true,symbol:market==='futures'?`BINANCE:${symbol}.P`:`BINANCE:${symbol}`,interval:'60',timezone:'Asia/Seoul',theme:'dark',style:'1',locale:'kr',allow_symbol_change:false,hide_side_toolbar:true,support_host:'https://www.tradingview.com'});box.appendChild(w);box.appendChild(s)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;page=1;apply()});$('search').oninput=()=>{page=1;apply()};$('pageSize').onchange=()=>{page=1;apply()};$('refresh').onclick=loadAll;$('prev').onclick=()=>{if(page>1){page--;apply()}};$('next').onclick=()=>{const t=Math.ceil(view.length/(+$('pageSize').value));if(page<t){page++;apply()}};loadAll();setInterval(loadAll,60000);
</script></body></html>
