<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;min-width:0;background:#06101a;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="shell"></iframe><script>
const shell=document.getElementById('shell');shell.src='/analysis-shell-v7.html'+location.search;
let histTimer=null,histKey='',histBusy=false,histCache=new Map();
function deepest(){try{let w=shell.contentWindow,d=shell.contentDocument;for(let i=0;i<7;i++){if(!d)break;const f=d.querySelector('iframe#shell,iframe#app');if(!f?.contentWindow||!f.contentDocument)break;w=f.contentWindow;d=f.contentDocument}return d?{w,d}:null}catch{return null}}
const num=v=>{v=Number(v);return Number.isFinite(v)?v:null};
function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function avg(a){a=a.filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function f(v,d=2){v=num(v);return v==null?'-':v.toFixed(d)}
async function json(u){const r=await fetch(u,{cache:'no-store'}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('응답 형식 오류')}if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));return j}
function currentState(){const q=deepest();if(!q)return null;const s=(q.d.getElementById('symbol')?.value||'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g,''),tf=q.d.querySelector('[data-tf].active')?.dataset?.tf||'4h';let bias=q.w.D?.bias?.label||q.w.D?.bias||q.d.getElementById('bias')?.textContent||'';bias=String(bias);const dir=/bull|상승|up/i.test(bias)?1:/bear|하락|down/i.test(bias)?-1:null;const scores=[];function walk(x,depth=0){if(!x||depth>4)return;if(Array.isArray(x)){x.forEach(v=>walk(v,depth+1));return}if(typeof x==='object'){for(const[k,v]of Object.entries(x)){if(/score/i.test(k)&&Number.isFinite(+v)&&+v>=0&&+v<=100)scores.push(+v);else if(typeof v==='object')walk(v,depth+1)}}}walk(q.w.D?.trendlineComparison);walk(q.w.D?.trendlines);walk(q.w.F?.trendlines);return{...q,symbol:s,tf,dir,lineScore:med(scores)}}
function ensureUI(){const q=deepest();if(!q)return false;const d=q.d;if(d.getElementById('historicalV8'))return true;const aside=d.querySelector('.side');if(!aside)return false;const box=d.createElement('div');box.id='historicalV8';box.className='box';box.style.marginTop='9px';box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3 style="margin:0">과거 유사 구조 반응</h3><span id="histAuditV8" class="muted">대기</span></div><div class="muted" id="histRuleV8" style="margin-top:5px;line-height:1.5">현재 방향과 추세선 품질이 비슷했던 과거 canonical 이벤트를 비교합니다.</div><div class="scoreGrid" style="margin-top:7px"><div class="score"><b>유사 사례</b><strong id="histNV8">-</strong><small>전체 / HOLDOUT</small></div><div class="score"><b>40봉 중앙 반응</b><strong id="histR40V8">-</strong><small>HOLDOUT · 이벤트 방향 기준</small></div><div class="score"><b>40봉 +비율</b><strong id="histPosV8">-</strong><small>HOLDOUT 분포 · 확률 예측 아님</small></div><div class="score"><b>MFE / MAE</b><strong id="histExcV8">-</strong><small>HOLDOUT 중앙값</small></div></div><div class="rows" style="margin-top:7px"><div class="row"><span>DEV 10/20/40봉</span><b id="histDevV8">-</b></div><div class="row"><span>VALID 10/20/40봉</span><b id="histValV8">-</b></div><div class="row"><span>HOLDOUT 10/20/40봉</span><b id="histHoldV8">-</b></div><div class="row"><span>표본 경고</span><b id="histWarnV8">-</b></div></div><div class="muted" style="margin-top:7px;line-height:1.5">과거 반응 분포이며 미래 상승·하락 확률이나 매수·매도 지시가 아닙니다. HOLDOUT은 결과에 맞춘 임계값 조정에 사용하지 않습니다.</div><a id="histLinkV8" class="btn" style="display:inline-block;margin-top:7px" href="/historical-validation.html">전체 검증 열기</a>`;aside.appendChild(box);const st=d.createElement('style');st.id='hist-v8-style';st.textContent='@media(max-width:700px){#historicalV8 .scoreGrid{grid-template-columns:1fr 1fr!important}#historicalV8 .row{grid-template-columns:minmax(0,118px) minmax(0,1fr)!important}#historicalV8 strong{font-size:17px!important}}';d.head.appendChild(st);return true}
function set(id,v){const q=deepest(),e=q?.d.getElementById(id);if(e)e.textContent=v}
function split(a){a=[...a].sort((x,y)=>(+x.time||0)-(+y.time||0));const d=Math.floor(a.length*.5),v=Math.floor(a.length*.75);return{DEV:a.slice(0,d),VALID:a.slice(d,v),HOLDOUT:a.slice(v)}}
function stats(a){return{n:a.length,r10:med(a.map(x=>num(x.r10))),r20:med(a.map(x=>num(x.r20))),r40:med(a.map(x=>num(x.r40))),pos:a.length?a.filter(x=>num(x.r40)>0).length/a.length*100:null,mfe:med(a.map(x=>num(x.mfe40))),mae:med(a.map(x=>num(x.mae40))),score:avg(a.map(x=>num(x.score)))}}
function row(s){return s.n?`${f(s.r10)}% · ${f(s.r20)}% · ${f(s.r40)}% (N=${s.n})`:'표본 없음'}
function chooseSimilar(events,dir,lineScore){let a=events.filter(e=>dir==null||+e.dir===dir);let rule=dir==null?'방향 필터 없음':'현재 구조 방향 일치';if(lineScore!=null){a=a.filter(e=>Number.isFinite(+e.score)&&Math.abs(+e.score-lineScore)<=15);rule+=` + 추세선 품질 ${lineScore.toFixed(0)}±15`}else rule+=' + 추세선 품질 데이터 부족';return{events:a,rule}}
async function refreshHistorical(force=false){if(histBusy||!ensureUI())return;const s=currentState();if(!s)return;const key=s.symbol+'|'+s.tf;if(!force&&key===histKey&&histCache.has(key)){renderHistorical(histCache.get(key),s);return}histBusy=true;set('histAuditV8','불러오는 중');set('histRuleV8','과거 확정봉 구조 이벤트를 point-in-time 방식으로 재구성 중...');try{const data=await json(`/api/historical-structure-study?symbol=${encodeURIComponent(s.symbol)}&interval=${encodeURIComponent(s.tf)}&bars=3000&_=${Date.now()}`),events=data.canonical?.events||[],pick=chooseSimilar(events,s.dir,s.lineScore),sp=split(pick.events),pack={data,pick,sp,at:Date.now()};histCache.set(key,pack);histKey=key;renderHistorical(pack,s)}catch(e){set('histAuditV8','오류');set('histRuleV8','과거 검증 로딩 실패 · '+e.message);set('histNV8','-');set('histR40V8','-');set('histPosV8','-');set('histExcV8','-')}finally{histBusy=false}}
function renderHistorical(pack,s){const{data,pick,sp}=pack,dev=stats(sp.DEV),val=stats(sp.VALID),hold=stats(sp.HOLDOUT),audit=data.canonical?.audit?.pass===true;set('histAuditV8',audit?'Canonical Audit PASS':'Canonical Audit WARN');set('histRuleV8',`${s.symbol} ${s.tf} · ${pick.rule} · 3000봉 연구 표본`);set('histNV8',`${pick.events.length} / ${hold.n}`);set('histR40V8',hold.r40==null?'-':`${hold.r40>=0?'+':''}${f(hold.r40)}%`);set('histPosV8',hold.pos==null?'-':f(hold.pos,1)+'%');set('histExcV8',hold.mfe==null||hold.mae==null?'-':`${f(hold.mfe)} / ${f(hold.mae)}%`);set('histDevV8',row(dev));set('histValV8',row(val));set('histHoldV8',row(hold));set('histWarnV8',hold.n<10?'HOLDOUT 표본 적음':hold.n<25?'HOLDOUT 표본 제한적':'표본 확인 가능');const q=deepest(),a=q?.d.getElementById('histLinkV8');if(a)a.href=`/historical-validation.html?symbol=${encodeURIComponent(s.symbol)}&tf=${encodeURIComponent(s.tf)}`}
function hook(){ensureUI();setTimeout(()=>refreshHistorical(true),1500);clearInterval(histTimer);histTimer=setInterval(()=>{ensureUI();const s=currentState();if(!s)return;const key=s.symbol+'|'+s.tf;if(key!==histKey)refreshHistorical(true);else if(!histBusy&&(!histCache.get(key)||Date.now()-histCache.get(key).at>5*60*1000))refreshHistorical(true)},15000)}
shell.addEventListener('load',()=>{setTimeout(hook,900);setTimeout(hook,2200)});window.addEventListener('beforeunload',()=>clearInterval(histTimer));
</script></body></html>
