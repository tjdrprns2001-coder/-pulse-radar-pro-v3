<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><title>PulseRadar · Forex Book 실전 랩</title><link rel="stylesheet" href="/ui/pulse-child-normalize.css?v=20260922-fx1"><link rel="stylesheet" href="/ui/forex-book/forex-book-lab.css?v=20260922-fx1"></head><body><main class="fxApp">
<header class="fxTop"><div><b>Forex Book 실전 랩</b><small>All you should know about Forex · 현재 확보 소스 p.201~350</small></div><span class="source">책 기반 + 자동화 근사</span></header>
<div class="warning"><b>소스 범위</b> 업로드된 PDF는 파일명은 201~406이지만 실제 수록은 인쇄 p.201~350입니다. p.351~406은 소스가 없어 임의 구현하지 않습니다.</div>
<section class="toolbar"><input id="symbol" value="BTCUSDT" aria-label="종목"><select id="tf"><option>5m</option><option>15m</option><option selected>1h</option><option>4h</option><option>12h</option><option>1d</option><option>3d</option><option>1w</option></select><button id="run">분석 실행</button><span id="status">대기</span></section>
<section class="stats"><div><span>대표 패턴</span><b id="best">-</b></div><div><span>근거 완성도</span><b id="score">-</b></div><div><span>방향</span><b id="bias">-</b></div><div><span>RSI</span><b id="rsi">-</b></div></section>
<section class="chartCard"><div id="chart"></div><div id="fallback" hidden>차트를 불러오지 못했습니다.</div></section>
<nav class="tabs"><button class="active" data-tab="summary">실전 요약</button><button data-tab="candles">캔들 p.205~246</button><button data-tab="indicators">지표 p.336~350</button><button data-tab="risk">리스크 p.269~318</button><button data-tab="macro">거시경제 p.319~335</button><button data-tab="education">교육·윤리 p.201~268</button></nav>
<section id="summary" class="panel active"><div id="summaryCards" class="grid"></div></section>
<section id="candles" class="panel"><div id="candleCards" class="grid"></div></section>
<section id="indicators" class="panel"><div id="indicatorCards" class="grid"></div></section>
<section id="risk" class="panel"><article class="box"><h3>포지션 리스크 계산기</h3><div class="form"><label>계좌잔고<input id="balance" type="number" value="10000"></label><label>위험률 %<input id="riskPct" type="number" step=".1" value="1"></label><label>진입가<input id="entry" type="number" step="any"></label><label>손절가<input id="stop" type="number" step="any"></label><label>레버리지<input id="leverage" type="number" step="1" value="1"></label><button id="calcRisk">계산</button></div><div id="riskResult"></div></article><article class="box"><h3>트레이딩 플랜</h3><div class="form"><label>스타일<select id="style"><option value="scalping">스캘핑</option><option value="day">데이</option><option value="swing" selected>스윙</option><option value="position">포지션</option></select></label><label>목표<input id="goal" placeholder="예: 월간 규칙 준수 90%"></label><label>기본 R:R<input id="rr" type="number" value="2" step=".1"></label><button id="makePlan">플랜 생성</button></div><div id="planResult"></div></article></section>
<section id="macro" class="panel"><article class="box"><h3>경제 이벤트 플레이북</h3><select id="macroType"><option value="central_bank">중앙은행</option><option value="gdp">GDP</option><option value="employment">고용/NFP</option><option value="inflation">인플레이션</option><option value="trade_geopolitics">무역·지정학</option></select><div id="macroResult"></div></article></section>
<section id="education" class="panel"><div id="educationCards" class="grid"></div></section>
<footer>교육·연구용 · 자동 주문 없음 · 점수는 승률이 아니라 근거 완성도</footer></main>
