<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="shell"></iframe><script>
const shell=document.getElementById('shell');shell.src='/analysis-shell-v11.html'+location.search;let timer=null,catalog=[];
function deepest(){try{let w=shell.contentWindow,d=shell.contentDocument;for(let i=0;i<16;i++){if(!d)break;const f=d.querySelector('iframe#shell,iframe#app');if(!f?.contentWindow||!f.contentDocument)break;w=f.contentWindow;d=f.contentDocument}return d?{w,d}:null}catch{return null}}
async function loadCatalog(){if(catalog.length)return catalog;const r=await fetch('/api/market?catalog=1&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'종목 목록 로딩 실패');catalog=j.symbols||[];return catalog}
function renderList(q=''){const x=deepest();if(!x)return;const d=x.d,list=d.getElementById('symbolRowsV12'),meta=d.getElementById('symbolMetaV12');if(!list)return;const s=String(q||'').trim().toUpperCase(),matched=catalog.filter(x=>!s||x.symbol.includes(s));if(meta)meta.textContent=`전체 ${catalog.length}개 · 검색 결과 ${matched.length}개 · Binance USDT 현물 + USD-M 무기한 선물`;list.innerHTML=matched.map(x=>`<button class="symV12" data-symbol="${x.symbol}"><b>${x.symbol}</b><small>${x.spot?'현물':''}${x.spot&&x.futures?' + ':''}${x.futures?'선물':''}</small></button>`).join('');list.querySelectorAll('.symV12').forEach(b=>b.onclick=()=>choose(b.dataset.symbol))}
function choose(symbol){const x=deepest();if(!x)return;const d=x.d,w=x.w,input=d.getElementById('symbol');if(input){input.value=symbol;input.dispatchEvent(new Event('change',{bubbles:true}))}closePicker();try{w.symbol=symbol}catch{}try{w.run&&w.run()}catch{}const u=new URL(location.href);u.searchParams.set('symbol',symbol);history.replaceState(null,'',u)}
function closePicker(){deepest()?.d.getElementById('symbolPickerV12')?.classList.remove('open')}
function injectFallback(x){if(!x?.d)return;const add=(id,src)=>{if(x.d.getElementById(id))return;const s=x.d.createElement('script');s.id=id;s.src=src;s.defer=false;x.d.body.appendChild(s)};add('analysisFuturesClientV15','/analysis-futures-client.js?v=15');add('patternFallingWedgeClientV3','/pattern-falling-wedge-client.js?v=3');add('trendlineVisualClientV7','/trendline-visual-client.js?v=7');add('mtfSnapshotClientV7','/mtf-snapshot-client.js?v=7');add('mobileLayoutOrganizerV3','/mobile-layout-organizer.js?v=3');add('patternValidationClientV3','/pattern-validation-client.js?v=3');add('calibrationReadinessClientV1','/calibration-readiness-client.js?v=1')}
function install(){const x=deepest();if(!x)return;injectFallback(x);const{d}=x;if(d.getElementById('symbolPickerV12'))return;const input=d.getElementById('symbol');if(!input)return;const btn=d.createElement('button');btn.id='symbolBrowseV12';btn.className='btn';btn.textContent='종목 전체';input.insertAdjacentElement('afterend',btn);const p=d.createElement('div');p.id='symbolPickerV12';p.innerHTML=`<div class="panelV12"><div class="headV12"><b>전체 코인 종목</b><button id="symbolCloseV12" class="btn">닫기</button></div><input id="symbolSearchV12" placeholder="BTC, ETH, SOL, XPIN처럼 검색"><div id="symbolMetaV12" class="metaV12">목록 불러오는 중...</div><div id="symbolRowsV12" class="rowsV12"></div></div>`;d.body.appendChild(p);const st=d.createElement('style');st.textContent=`#symbolPickerV12{display:none;position:fixed;inset:0;z-index:99999;background:rgba(2,7,13,.88);padding:12px}.panelV12{height:calc(100dvh - 24px);max-width:760px;margin:auto;background:#08131f;border:1px solid #29405a;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}#symbolPickerV12.open{display:block}.headV12{display:flex;justify-content:space-between;align-items:center}.panelV12 input{width:100%;font-size:16px;padding:12px}.metaV12{font-size:11px;color:#8da2ba}.rowsV12{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:auto}.symV12{text-align:left;background:#0b1825;border:1px solid #223a53;color:#fff;border-radius:9px;padding:10px}.symV12 b,.symV12 small{display:block}.symV12 small{color:#86a0ba;font-size:9px}@media(max-width:700px){.rowsV12{grid-template-columns:repeat(2,minmax(0,1fr))}}`;d.head.appendChild(st);btn.onclick=async()=>{p.classList.add('open');try{await loadCatalog();renderList('')}catch(e){d.getElementById('symbolMetaV12').textContent='목록 오류 · '+e.message}};d.getElementById('symbolCloseV12').onclick=closePicker;d.getElementById('symbolSearchV12').oninput=e=>renderList(e.target.value)}
function hook(){install();clearInterval(timer);timer=setInterval(install,1600)}shell.addEventListener('load',()=>{setTimeout(hook,800);setTimeout(install,2200)});window.addEventListener('beforeunload',()=>clearInterval(timer));
</script></body></html>
