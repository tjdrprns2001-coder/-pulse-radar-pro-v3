<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#06101a}</style></head><body><iframe id="app" title="PulseRadar Pro 통합 분석"></iframe><script>
const q=new URLSearchParams(location.search),initSymbol=(q.get('symbol')||'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g,''),initTf=['15m','1h','4h','1d'].includes(q.get('tf'))?q.get('tf'):'4h',initMode=['snapshot','detail'].includes(q.get('mode'))?q.get('mode'):'snapshot';
const frame=document.getElementById('app');frame.src=`/analysis-v3.html?symbol=${encodeURIComponent(initSymbol)}&tf=${initTf}&mode=${initMode}`;
let derivTimer=null,liveTimer=null,stopped=false;const FAPI=['https://fapi.binance.com','https://fapi1.binance.com','https://fapi2.binance.com'];
async function api(url){const r=await fetch(url,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.reason||j.error||`HTTP ${r.status}`);return j}
async function publicJson(path){let last;for(const base of FAPI){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),4500);try{const r=await fetch(base+path,{cache:'no-store',signal:ctl.signal});clearTimeout(to);if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}catch(e){clearTimeout(to);last=e}}throw last||Error('public futures fetch failed')}
function doc(){try{return frame.contentDocument}catch{return null}}
function state(){const d=doc();let symbol=initSymbol,tf=initTf;if(d){const s=d.getElementById('symbol');if(s?.value)symbol=String(s.value).toUpperCase().replace(/[^A-Z0-9]/g,'')||symbol;const a=d.querySelector('[data-tf].active');if(a?.dataset?.tf)tf=a.dataset.tf}return{symbol,tf}}
function set(id,text,cls){const d=doc(),e=d&&d.getElementById(id);if(!e)return;if(text!=null)e.textContent=text;if(cls!=null)e.className=cls}
function comp(v){v=Number(v);return Number.isFinite(v)?Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}).format(v):'-'}
function fmt(v){v=Number(v);if(!Number.isFinite(v))return'-';return v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6)}
const n=v=>{v=Number(v);return Number.isFinite(v)?v:null};const pct=(a,b)=>{a=n(a);b=n(b);return a!=null&&b!=null&&a!==0?(b-a)/Math.abs(a)*100:null};const avg=a=>{a=a.filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
async function browserDeriv(symbol){const s=encodeURIComponent(symbol),[pR,oR,hR,tR,qR]=await Promise.allSettled([publicJson(`/fapi/v1/premiumIndex?symbol=${s}`),publicJson(`/fapi/v1/openInterest?symbol=${s}`),publicJson(`/futures/data/openInterestHist?symbol=${s}&period=1h&limit=25`),publicJson(`/futures/data/takerlongshortRatio?symbol=${s}&period=1h&limit=24`),publicJson(`/fapi/v1/ticker/24hr?symbol=${s}`)]);const p=pR.status==='fulfilled'?pR.value:null,o=oR.status==='fulfilled'?oR.value:null,h=hR.status==='fulfilled'&&Array.isArray(hR.value)?hR.value:[],t=tR.status==='fulfilled'&&Array.isArray(tR.value)?tR.value:[],qq=qR.status==='fulfilled'?qR.value:null;if(!p&&!o&&!h.length&&!t.length&&!qq)return null;const mark=n(p?.markPrice),contracts=n(o?.openInterest),oiUsd=mark!=null&&contracts!=null?mark*contracts:null,oi24=h.length>1?pct(h[0]?.sumOpenInterestValue??h[0]?.sumOpenInterest,h.at(-1)?.sumOpenInterestValue??h.at(-1)?.sumOpenInterest):null,funding=n(p?.lastFundingRate),fundingPct=funding!=null?funding*100:null;let ratios=t.map(x=>n(x.buySellRatio)).filter(Number.isFinite);if(!ratios.length)ratios=t.map(x=>{const b=n(x.buyVol),ss=n(x.sellVol);return b!=null&&ss>0?b/ss:null}).filter(Number.isFinite);const taker=avg(ratios),flags=[];if(oi24!=null&&oi24>=15)flags.push('OI 증가');if(oi24!=null&&oi24<=-15)flags.push('OI 감소');if(fundingPct!=null&&Math.abs(fundingPct)>=.03)flags.push(fundingPct>0?'양(+) 펀딩':'음(-) 펀딩');if(taker!=null&&taker>=1.15)flags.push('공격적 매수 우위');if(taker!=null&&taker<=.87)flags.push('공격적 매도 우위');return{available:true,pressure:flags.length>=3?'레버리지 과열':flags.length?'레버리지 확대':'중립',flags,openInterestContracts:contracts,openInterestUsdApprox:oiUsd,openInterestChange24hPct:oi24,fundingRatePct:fundingPct,takerBuySellRatio:taker,source:'Binance USD-M browser public REST'}}
async function pullDeriv(){const {symbol}=state();try{let d=await browserDeriv(symbol);if(!d){try{d=await api(`/api/structure?symbol=${encodeURIComponent(symbol)}&derivatives=1&_=${Date.now()}`)}catch{d=null}}if(!d?.available){set('pressure','미지원');set('pressureNote',d?.reason||d?.note||'USD-M 데이터 없음');set('oi','-');set('oi24','-');set('fund','-');set('taker','-');set('derSource','-');return}set('pressure',d.pressure||'중립');set('pressureNote',(d.flags||[]).slice(0,2).join(' · ')||'뚜렷한 쏠림 없음');set('oi',Number.isFinite(d.openInterestUsdApprox)?'$'+comp(d.openInterestUsdApprox):comp(d.openInterestContracts));set('oi24',Number.isFinite(d.openInterestChange24hPct)?`${d.openInterestChange24hPct>=0?'+':''}${d.openInterestChange24hPct.toFixed(1)}%`:'-');set('fund',Number.isFinite(d.fundingRatePct)?d.fundingRatePct.toFixed(4)+'%':'-');set('taker',Number.isFinite(d.takerBuySellRatio)?d.takerBuySellRatio.toFixed(2)+'x':'-');set('derSource',d.source||'공개 선물 데이터')}catch(e){set('pressure','데이터 오류');set('pressureNote','파생 데이터 재시도 중')}}
async function pullLive(){const {symbol,tf}=state();try{const d=await api(`/api/structure?symbol=${encodeURIComponent(symbol)}&interval=${tf}&market=spot&live=1&_=${Date.now()}`);if(!d.available||!d.candle)return;const k=d.candle;set('ohlc',`O ${fmt(k.open)} · H ${fmt(k.high)} · L ${fmt(k.low)} · C ${fmt(k.close)}`);const dd=doc(),live=dd&&dd.getElementById('live');if(live&&!/WebSocket 실시간/.test(live.textContent||'')){live.textContent='● REST 실시간';live.className='badge ok'}}catch(e){const dd=doc(),live=dd&&dd.getElementById('live');if(live&&/연결 오류|연결 준비|재연결/.test(live.textContent||'')){live.textContent='● REST 재시도';live.className='badge warn'}}}
function start(){if(stopped)return;clearInterval(derivTimer);clearInterval(liveTimer);pullDeriv();pullLive();derivTimer=setInterval(pullDeriv,20000);liveTimer=setInterval(pullLive,4000)}
frame.addEventListener('load',()=>setTimeout(start,1200));window.addEventListener('beforeunload',()=>{stopped=true;clearInterval(derivTimer);clearInterval(liveTimer)});
</script></body></html>
