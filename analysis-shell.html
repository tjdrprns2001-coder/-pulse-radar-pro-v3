<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#06101a}</style></head><body><iframe id="app" title="PulseRadar Pro 통합 분석"></iframe><script>
const q=new URLSearchParams(location.search),symbol=(q.get('symbol')||'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g,''),tf=['15m','1h','4h','1d'].includes(q.get('tf'))?q.get('tf'):'4h',mode=['snapshot','detail'].includes(q.get('mode'))?q.get('mode'):'snapshot';
const frame=document.getElementById('app');frame.src=`/analysis-v3.html?symbol=${encodeURIComponent(symbol)}&tf=${tf}&mode=${mode}`;
let derivTimer=null,liveTimer=null,stopped=false;
async function api(url){const r=await fetch(url,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.reason||j.error||`HTTP ${r.status}`);return j}
function doc(){try{return frame.contentDocument}catch{return null}}
function set(id,text,cls){const d=doc(),e=d&&d.getElementById(id);if(!e)return;if(text!=null)e.textContent=text;if(cls!=null)e.className=cls}
function comp(v){v=Number(v);return Number.isFinite(v)?Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}).format(v):'-'}
async function pullDeriv(){try{const d=await api(`/api/htf?mode=deriv&symbol=${encodeURIComponent(symbol)}&_=${Date.now()}`);if(!d.available){set('pressure','미지원');set('pressureNote',d.reason||'USD-M 데이터 없음');set('oi','-');set('oi24','-');set('fund','-');set('taker','-');set('derSource','-');return}set('pressure',d.pressure||'중립');set('pressureNote',(d.flags||[]).slice(0,2).join(' · ')||'뚜렷한 쏠림 없음');set('oi',Number.isFinite(d.openInterestUsdApprox)?'$'+comp(d.openInterestUsdApprox):comp(d.openInterestContracts));set('oi24',Number.isFinite(d.openInterestChange24hPct)?`${d.openInterestChange24hPct>=0?'+':''}${d.openInterestChange24hPct.toFixed(1)}%`:'-');set('fund',Number.isFinite(d.fundingRatePct)?d.fundingRatePct.toFixed(4)+'%':'-');set('taker',Number.isFinite(d.takerBuySellRatio)?d.takerBuySellRatio.toFixed(2)+'x':'-');set('derSource','Binance USD-M REST')}catch(e){set('pressure','데이터 오류');set('pressureNote','파생 데이터 재시도 중')}}
async function pullLive(){try{const d=await api(`/api/htf?mode=live&symbol=${encodeURIComponent(symbol)}&interval=${tf}&_=${Date.now()}`);if(!d.available)return;set('ohlc',`O ${fmt(d.open)} · H ${fmt(d.high)} · L ${fmt(d.low)} · C ${fmt(d.close)}`);set('liveVol',Number.isFinite(d.projectedVolumeRatio)?d.projectedVolumeRatio.toFixed(2)+'x':'-');const dd=doc(),live=dd&&dd.getElementById('live');if(live&&!/실시간 연결|연결됨/.test(live.textContent||'')){live.textContent='● REST 실시간';live.className='badge ok'}}catch(e){const dd=doc(),live=dd&&dd.getElementById('live');if(live&&/연결 오류|연결 준비|재연결/.test(live.textContent||'')){live.textContent='● REST 재시도';live.className='badge warn'}}}
function fmt(v){v=Number(v);if(!Number.isFinite(v))return'-';return v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6)}
function start(){if(stopped)return;clearInterval(derivTimer);clearInterval(liveTimer);pullDeriv();pullLive();derivTimer=setInterval(pullDeriv,20000);liveTimer=setInterval(pullLive,4000)}
frame.addEventListener('load',()=>setTimeout(start,1200));window.addEventListener('beforeunload',()=>{stopped=true;clearInterval(derivTimer);clearInterval(liveTimer)});
</script></body></html>
