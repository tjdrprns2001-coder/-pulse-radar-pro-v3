name: Whole Site Audit
on:
  pull_request:
    paths: ['*.html', 'ui/**', 'lib/**', 'render-temp-server.js', 'package*.json', 'tests/**', 'scripts/verify-site-browser.cjs', '.github/workflows/site-audit.yml']
  push:
    branches: [main]
    paths: ['*.html', 'ui/**', 'lib/**', 'render-temp-server.js', 'package*.json', 'tests/**', 'scripts/verify-site-browser.cjs', '.github/workflows/site-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test $(find tests lib -name '*.test.js' -not -path '*/node_modules/*')
      - run: npm install --prefix "$RUNNER_TEMP/site-audit" --no-save --package-lock=false playwright@1.55.0 lightweight-charts@5.2.1
      - run: '"$RUNNER_TEMP/site-audit/node_modules/.bin/playwright" install --with-deps chromium'
      - run: NODE_PATH="$RUNNER_TEMP/site-audit/node_modules" node scripts/verify-site-browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/site-audit/node_modules" node scripts/verify-condition-audit-browser.cjs
