name: QuantStyle research risk
on:
  push:
    branches: [main]
    paths:
      - 'lib/research-backtest-v2/quantstyle-performance.js'
      - 'lib/research-backtest-v2/binance-funding-audit.js'
      - 'scripts/verify-quantstyle-performance.js'
      - 'scripts/verify-binance-funding-audit.js'
      - 'scripts/verify-binance-funding-integration.js'
      - 'scripts/verify-quantstyle-integration.js'
      - 'scripts/run-bowl-walk-forward.js'
      - 'package.json'
      - '.github/workflows/quantstyle-risk-validation.yml'
  pull_request:
    paths:
      - 'lib/research-backtest-v2/quantstyle-performance.js'
      - 'scripts/verify-quantstyle-performance.js'
      - 'scripts/verify-quantstyle-integration.js'
      - 'scripts/run-bowl-walk-forward.js'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check lib/research-backtest-v2/quantstyle-performance.js
      - run: node --check scripts/run-bowl-walk-forward.js
      - run: npm run test:quantstyle-performance
      - run: npm run test:funding-audit
      - run: npm run test:bowl-walk-forward
