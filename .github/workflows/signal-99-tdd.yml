name: Signal 99 TDD
on:
  pull_request:
    branches: [main]
jobs:
  signal-99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Run signal 99 contracts
        run: |
          node scripts/verify-signal-health.js
          node scripts/verify-signal-backfill.js
          node scripts/verify-signal-calibration.js
          node scripts/verify-signal-evidence.js
          node scripts/verify-signal-alerts-v2.js
          node scripts/verify-signal-resilience.js
          node scripts/verify-signal-ops-api.js
