name: Research Backtest v2 TDD
on:
  pull_request:
    branches: [main]
jobs:
  research-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Run research v2 contracts
        run: |
          for f in $(find scripts -maxdepth 1 -name 'verify-research-*.js' | sort); do
            echo "==> $f"
            node "$f"
          done
