name: Signal Performance TDD
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-signal-performance-core.js
      - run: node scripts/verify-signal-performance-store.js
      - run: node scripts/verify-signal-performance-resolver.js
