name: TA indicator parity
on:
  push:
    branches: [main]
    paths:
      - 'lib/research-backtest-v2/ta-parity.js'
      - 'scripts/ta-parity-reference.py'
      - 'scripts/verify-ta-parity.js'
      - '.github/workflows/ta-indicator-parity.yml'
  pull_request:
    paths:
      - 'lib/research-backtest-v2/ta-parity.js'
      - 'scripts/ta-parity-reference.py'
      - 'scripts/verify-ta-parity.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check 'ta==0.11.0' 'pandas==2.2.3' 'numpy==2.1.3'
      - run: node scripts/verify-ta-parity.js
