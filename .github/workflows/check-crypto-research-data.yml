name: Crypto Research Data checks
on:
  push:
    branches: [feat/crypto-research-data-engine]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check lib/research-backtest-v2/crypto-data-engine.js
      - run: node --check lib/research-backtest-v2/dante-presets.js
      - run: node --check lib/research-backtest-v2/execution-simulator.js
      - run: node --check lib/research-backtest-v2/dante-backtest.js
      - run: node --check lib/research-backtest-v2/performance-report.js
      - run: node --check lib/research-backtest-v2/robustness.js
      - run: node --check lib/research-backtest-v2/portfolio-simulator.js
      - run: node --check lib/research-backtest-v2/baselines.js
      - run: node --check lib/research-backtest-v2/paper-trading.js
      - run: node --check lib/research-backtest-v2/runtime.js
      - run: node --check lib/research-backtest-v2/universe.js
      - run: node --check api/research-backtest.js
      - run: node --check ui/research-backtest.js
      - run: node scripts/verify-crypto-data-engine.js
      - run: node scripts/verify-dante-crypto-research.js
      - run: node scripts/verify-research-backtest-v2.js
      - run: node scripts/verify-v5-trader-workspace.js
