name: preignition-oos-ingest

on:
  push:
    branches:
      - feature/preignition-oos-ingest-20261001
    paths:
      - "workers/selector-runtime.mjs"
      - "lib/coin-scan/preignition-oos-store.js"
      - "lib/coin-scan/preignition-oos-store.test.js"
      - "db/selector-runtime-r04.sql"
      - ".github/workflows/preignition-oos-ingest.yml"
  pull_request:
    paths:
      - "workers/selector-runtime.mjs"
      - "lib/coin-scan/preignition-oos-store.js"
      - "lib/coin-scan/preignition-oos-store.test.js"
      - "db/selector-runtime-r04.sql"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check workers/selector-runtime.mjs
      - run: node --check lib/coin-scan/preignition-oos-store.js
      - run: node --test lib/coin-scan/preignition-oos-store.test.js
