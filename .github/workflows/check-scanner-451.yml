name: Final Book AI and Scanner release checks
on:
  push:
    branches: [fix/scanner-451-spot-fallback]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check lib/coin-scan/binance-provider.js
      - run: node --check lib/coin-scan/scan-service.js
      - run: node --check lib/coin-scan/auto-recommender.js
      - run: node --check lib/coin-scan/recommendation-history.js
      - run: node --check ui/book-ai/app.js
      - run: node scripts/verify-coin-scan-provider.js
      - run: node scripts/verify-coin-scan-451-fallback.js
      - run: node scripts/verify-auto-recommender.js
      - run: node scripts/verify-recommendation-history.js
      - run: node scripts/verify-coin-scan-core.js
      - run: node scripts/verify-coin-scan-deep.js
      - run: node scripts/verify-cross-oi-v2.js
      - run: node scripts/verify-v3-scanner.js
      - run: node scripts/verify-book-ai-watchlist.js
      - run: node scripts/verify-book-ai-ui.js
      - run: node scripts/verify-book-ai-contract.js
      - run: node scripts/verify-book-ai-adapter.js
      - run: node scripts/verify-book-ai-live-evidence.js
      - run: node scripts/verify-book-ai-rules.js
      - run: node scripts/verify-book-ai-setup-state.js
      - run: node scripts/verify-book-ai-fusion.js
      - run: node scripts/verify-book-ai-summary.js
      - run: node scripts/verify-book-ai-storage.js
      - run: node scripts/verify-book-ai-mtf.js
      - run: node scripts/verify-coin-scan-api.js
      - run: node scripts/verify-v4-1-mobile.js
      - run: node scripts/verify-v5-trader-workspace.js
