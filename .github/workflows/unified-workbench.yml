name: Unified Analyst Workbench Safety

on:
  pull_request:
    paths:
      - 'index.html'
      - 'workbench.html'
      - 'scripts/verify-unified-workbench.js'
      - 'scripts/verify-agg-flow-route.js'
      - 'api/index.js'
      - 'handlers/agg-trade-flow.js'
      - 'vercel.json'
      - '.github/workflows/unified-workbench.yml'
      - 'ui/analyst-nav.js'
      - 'ui/analyst-nav.css'
      - 'scripts/verify-analyst-navigation.js'
      - 'astra-scan.html'
      - 'dna-scan.html'
      - 'auto-chart-lab.html'
      - 'research-ai.html'
      - 'pulse-ai.html'
      - 'coin-report.html'
      - 'radar.html'
      - 'launch-origin.html'
      - 'dante-lab.html'
      - 'historical-validation.html'
      - 'ict-narrative-lab.html'
      - 'surge-pattern-lab.html'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'workbench.html'
      - 'scripts/verify-unified-workbench.js'
      - 'ui/analyst-nav.js'
      - 'ui/analyst-nav.css'
      - 'scripts/verify-analyst-navigation.js'
      - 'astra-scan.html'
      - 'dna-scan.html'
      - 'auto-chart-lab.html'
      - 'research-ai.html'
      - 'pulse-ai.html'
      - 'coin-report.html'
      - 'radar.html'
      - 'launch-origin.html'
      - 'dante-lab.html'
      - 'historical-validation.html'
      - 'ict-narrative-lab.html'
      - 'surge-pattern-lab.html'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static route, syntax and data-safety regression
        run: |
          node --check scripts/verify-unified-workbench.js
          node scripts/verify-unified-workbench.js
          node scripts/verify-vercel-hobby-limit.js
          node scripts/verify-agg-flow-route.js
          node scripts/verify-analyst-navigation.js
