name: Export Main Source
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar --exclude=.git -czf /tmp/pulseradar-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: pulseradar-source
          path: /tmp/pulseradar-source.tgz
          retention-days: 1
