name: Bowl224 TDD
on:
  pull_request:
    branches: [main]
jobs:
  bowl224:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: |
          for f in $(find scripts -maxdepth 1 -name 'verify-bowl224-*.js' | sort); do
            echo "==> $f"
            node "$f"
          done
