name: Public SEO Metadata
on:
  pull_request:
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'scripts/verify-seo-public.js'
      - '.github/workflows/seo-public.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-seo-public.js
