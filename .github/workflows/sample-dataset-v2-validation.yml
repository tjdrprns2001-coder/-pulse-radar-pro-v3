name: Sample Dataset v2 Validation

on:
  push:
    branches: [main]
    paths:
      - 'lib/coin-scan/master-samples.js'
      - 'lib/coin-scan/master-sample-dataset-v2.js'
      - 'lib/coin-scan/sample-similarity-v2.js'
      - 'lib/coin-scan/sample-blind-validation.js'
      - 'lib/coin-scan/sampling-v3.js'
      - 'lib/coin-scan/astra-auto-scanner.js'
      - 'lib/coin-scan/deep-scan.js'
      - 'lib/coin-scan/scan-service.js'
      - 'data/samples/**'
      - 'scripts/verify-master-sample-dataset-v2.js'
      - 'scripts/verify-sample-similarity-v2.js'
      - 'scripts/verify-sample-blind-validation.js'
      - 'scripts/verify-sampling-v3.js'
      - 'scripts/verify-astra-auto-scan.js'
      - 'scripts/verify-coin-scan-deep.js'
      - 'lib/coin-scan/sampling-v3-integrity.js'
      - 'lib/coin-scan/sampling-v3-alt-bars.js'
      - 'lib/coin-scan/sampling-v3-oos.js'
      - 'lib/coin-scan/binance-provider.js'
      - 'scripts/verify-sampling-v3-integrity.js'
      - 'scripts/verify-sampling-v3-alt-bars.js'
      - 'scripts/verify-sampling-v3-oos.js'
      - 'scripts/verify-coin-scan-provider.js'
      - 'lib/coin-scan/scan-run-service.js'
      - 'ui/coin-scan.js'
      - 'scripts/verify-auto-scan-sampling-v3.js'
      - 'scripts/verify-auto-scan-finder.js'
      - 'scripts/verify-scan-run-service.js'
      - '.github/workflows/sample-dataset-v2-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Master dataset
        run: npm run test:master-samples-v2
      - name: Similarity engine
        run: npm run test:sample-similarity-v2
      - name: Blind validation
        run: npm run test:sample-blind-validation
      - name: Sampling v3
        run: npm run test:sampling-v3
      - name: Sampling v3 integrity
        run: npm run test:sampling-v3-integrity
      - name: Sampling v3 alternative bars
        run: npm run test:sampling-v3-alt-bars
      - name: Sampling v3 OOS
        run: npm run test:sampling-v3-oos
      - name: Provider microstructure
        run: npm run test:coin-scan-provider
      - name: Automatic scanner Sampling v3.1
        run: npm run test:auto-scan-sampling-v3
      - name: Automatic scan run aggregation
        run: npm run test:scan-run-service
      - name: Automatic scanner UI wiring
        run: node scripts/verify-auto-scan-finder.js
      - name: Deep scan wiring
        run: npm run test:coin-scan-deep
      - name: Astra wiring
        run: node scripts/verify-astra-auto-scan.js
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-v2-validation
          path: data/samples/SAMPLE_LOO_VALIDATION_latest.json
          if-no-files-found: ignore
