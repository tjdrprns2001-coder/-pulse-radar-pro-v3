name: Full Universe Auto Scan

on:
  push:
    branches:
      - feature/full-universe-auto-scan-20260927
      - codex/mtf-whole-market-integration-20261002
      - codex/fullscan-kv-canonical-20261002
  pull_request:
    paths:
      - 'lib/coin-scan/full-universe-auto-scan.js'
      - 'lib/coin-scan/mtf-market-analyzer.js'
      - 'lib/coin-scan/mtf-market-analyzer.test.js'
      - 'lib/coin-scan/market-cap-provider.js'
      - 'lib/coin-scan/postgres-full-scan-store.js'
      - 'lib/coin-scan/kv-full-scan-store.js'
      - 'lib/coin-scan/kv-full-scan-store.test.js'
      - 'lib/coin-scan/binance-ws-shards.js'
      - 'workers/full-universe-auto-scan.mjs'
      - 'workers/selector-runtime.mjs'
      - 'workers/chartbro-oos-runtime.mjs'
      - 'full-scan.html'
      - 'ui/full-scan.js'
      - 'ui/full-scan.css'
      - 'lib/coin-scan/binance-ws-multiplexer.js'
      - 'lib/coin-scan/binance-provider.js'
      - 'scripts/verify-binance-ws-raw-event.js'
      - 'db/full-universe-scan-v1.sql'
      - 'docs/full-universe-auto-scan-v1.md'
      - 'scripts/verify-full-universe-auto-scan.js'
      - 'scripts/verify-full-universe-worker-contract.js'
      - '.github/workflows/check-full-universe-auto-scan.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-full-universe-auto-scan.js
      - run: node --test lib/coin-scan/mtf-market-analyzer.test.js
      - run: node --check lib/coin-scan/mtf-market-analyzer.js
      - run: node scripts/verify-full-universe-worker-contract.js
      - run: node --check workers/full-universe-auto-scan.mjs
      - run: node --check workers/selector-runtime.mjs
      - run: node --check lib/coin-scan/full-universe-auto-scan.js
      - run: node --check lib/coin-scan/market-cap-provider.js
      - run: node --check lib/coin-scan/postgres-full-scan-store.js
      - run: node --check lib/coin-scan/kv-full-scan-store.js
      - run: node --test lib/coin-scan/kv-full-scan-store.test.js
      - run: node --check workers/chartbro-oos-runtime.mjs
      - run: node --check lib/coin-scan/binance-ws-shards.js
      - run: node --check ui/full-scan.js
      - run: node scripts/verify-binance-ws-raw-event.js

  scanner-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:auto-scan-finder
