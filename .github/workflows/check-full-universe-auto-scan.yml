name: Full Universe Auto Scan

on:
  push:
    branches:
      - feature/full-universe-auto-scan-20260927
  pull_request:
    paths:
      - 'lib/coin-scan/full-universe-auto-scan.js'
      - 'lib/coin-scan/market-cap-provider.js'
      - 'lib/coin-scan/postgres-full-scan-store.js'
      - 'lib/coin-scan/binance-ws-shards.js'
      - 'workers/full-universe-auto-scan.mjs'
      - 'db/full-universe-scan-v1.sql'
      - 'docs/full-universe-auto-scan-v1.md'
      - 'scripts/verify-full-universe-auto-scan.js'
      - 'scripts/verify-full-universe-worker-contract.js'
      - '.github/workflows/check-full-universe-auto-scan.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-full-universe-auto-scan.js
      - run: node scripts/verify-full-universe-worker-contract.js
      - run: node --check workers/full-universe-auto-scan.mjs
      - run: node --check lib/coin-scan/full-universe-auto-scan.js
      - run: node --check lib/coin-scan/market-cap-provider.js
      - run: node --check lib/coin-scan/postgres-full-scan-store.js
      - run: node --check lib/coin-scan/binance-ws-shards.js

  scanner-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:auto-scan-finder
