name: Recovery Integration CI
on:
  push:
    branches:
      - integration/v-history-recovery-20260926
  workflow_dispatch:
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scanner recovery regressions
        run: |
          npm run test:v2-flow-scanner
          npm run test:presurge-book-fusion
          npm run test:coin-scan-core
          npm run test:coin-scan-deep
          npm run test:book-strategy-registry
          npm run test:entry-confirmation
          npm run test:fakeout-state
          npm run test:light-prescan
          npm run test:scan-run-service
      - name: Historical/research regressions
        run: |
          npm run test:setup-point-in-time-replay
          npm run test:bowl224-research-v1
      - name: Trader scanner regressions
        run: npm run test:trader-scan
      - name: API/UI regressions
        run: |
          npm run test:coin-scan-api
          npm run test:coin-scan-ui
          npm run test:coin-scan-provider
          npm run test:coin-scan-shell
