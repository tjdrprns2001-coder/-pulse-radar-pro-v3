name: Auto Chart Lab checks
on:
  pull_request:
    paths:
      - 'auto-chart-lab.html'
      - 'ui/auto-chart/**'
      - 'ui/chart/chart-data.js'
      - 'handlers/structure.js'
      - 'api/index.js'
      - 'scripts/verify-auto-chart-lab.js'
      - 'package.json'
      - '.github/workflows/check-auto-chart-lab.yml'
  push:
    branches: [main]
    paths:
      - 'auto-chart-lab.html'
      - 'ui/auto-chart/**'
      - 'scripts/verify-auto-chart-lab.js'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --omit=dev
      - run: node -c ui/auto-chart/state.js
      - run: node -c ui/auto-chart/data/normalize.js
      - run: node -c ui/auto-chart/data/market-data.js
      - run: node -c lib/futures-data.js
      - run: node -c api/index.js
      - run: node -c ui/auto-chart/analysis/level-state.js
      - run: node -c ui/auto-chart/analysis/volume.js
      - run: node -c ui/auto-chart/analysis/advanced.js
      - run: node -c ui/auto-chart/analysis/multi-timeframe.js
      - run: node -c ui/auto-chart/analysis/replay.js
      - run: node -c ui/auto-chart/analysis/core.js
      - run: node -c ui/auto-chart/analysis/setup-state.js
      - run: node -c ui/auto-chart/chart/renderer.js
      - run: node -c ui/auto-chart/ui/analysis-card.js
      - run: node -c ui/auto-chart/app.js
      - run: npm run test:auto-chart-lab
      - run: npm run test:auto-chart-transport
