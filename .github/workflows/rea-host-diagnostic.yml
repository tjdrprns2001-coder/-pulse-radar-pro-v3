name: REA CLI and MCP Diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/REA_INTEGRATION.md'
      - 'AGENTS.md'
      - '.codex/config.toml'
      - '.cursor/mcp.json'
      - '.mcp.json'
      - 'scripts/verify-rea-mcp.mjs'
      - 'scripts/verify-rea-static-analysis.mjs'
      - '.github/workflows/rea-host-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Print runtime versions
        run: |
          node --version
          npm --version
      - name: Verify pinned REA CLI
        run: |
          npx --yes rea-agents@6.5.0 --version
          npx --yes rea-agents@6.5.0 --help
      - name: Inspect REA host capabilities
        run: npx --yes rea-agents@6.5.0 capabilities
      - name: Verify project settings and MCP handshake
        run: node scripts/verify-rea-mcp.mjs
      - name: Run real static JavaScript reconstruction on owned sources
        run: node scripts/verify-rea-static-analysis.mjs
      - name: Read-only doctor report (native engines optional)
        shell: bash
        run: |
          set +e
          npx --yes rea-agents@6.5.0 doctor --json > "$RUNNER_TEMP/rea-doctor.json" 2>&1
          diagnostic_status=$?
          set -e
          sed -n '1,15p' "$RUNNER_TEMP/rea-doctor.json" | cut -c 1-1200
          echo "REA doctor exit status: $diagnostic_status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$diagnostic_status" -ne 0 ]; then
            echo "::warning::REA doctor reports optional provider or agent readiness gaps."
          fi
