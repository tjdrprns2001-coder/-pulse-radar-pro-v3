name: Foundation Verify

on:
  push:
    branches:
      - main
      - feat/unified-v2-m1-foundation
      - feat/unified-v2-m2-chart
      - feat/unified-v2-m3-smc
      - feat/unified-v2-m3-1-declutter
      - feat/unified-v2-m3-2-collision
      - feat/realtime-crypto-radar
      - signal-quality-v2-operations
      - feat/final-99-release
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'lib/**'
      - 'netlify/**'
      - 'ui/**'
      - 'tests/**'
      - 'radar.html'
      - 'pulse-unified.html'
      - 'unified-chart.html'
      - 'scanner-shell-v13.html'
      - 'performance-dashboard.html'
      - 'risk-calculator.html'
      - 'package.json'
      - 'vercel.json'
      - 'netlify.toml'
      - 'scripts/**'
      - 'RELEASE_CHECKLIST.md'
      - 'docs/superpowers/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'lib/**'
      - 'netlify/**'
      - 'ui/**'
      - 'tests/**'
      - 'radar.html'
      - 'pulse-unified.html'
      - 'unified-chart.html'
      - 'scanner-shell-v13.html'
      - 'performance-dashboard.html'
      - 'risk-calculator.html'
      - 'package.json'
      - 'vercel.json'
      - 'netlify.toml'
      - 'scripts/**'
      - 'RELEASE_CHECKLIST.md'
      - 'docs/superpowers/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository
        run: npm run verify
