name: Foundation Verify

on:
  push:
    branches:
      - feat/unified-v2-m1-foundation
      - feat/unified-v2-m2-chart
      - feat/unified-v2-m3-smc
      - feat/unified-v2-m3-1-declutter
      - feat/unified-v2-m3-2-collision
      - feat/multi-chart-workspace-v1
      - feat/milestone-3-3-liquidity-ict
  pull_request:
    paths:
      - 'ui/**'
      - 'tests/**'
      - 'pulse-unified.html'
      - 'unified-chart.html'
      - 'multi-chart.html'
      - 'snapshot-analysis.html'
      - 'scanner-shell-v13.html'
      - 'package.json'
      - 'scripts/**'
      - 'RELEASE_CHECKLIST.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Milestone 3.3 and multi-chart
        run: |
          node scripts/verify-milestone3-3.js
          node scripts/verify-multi-chart.js
      - name: Verify repository
        shell: bash
        run: |
          if [ -f scripts/verify-radar-core.js ]; then
            npm run verify
          else
            node scripts/verify-milestone3-2.js
            node scripts/verify-milestone3-1.js
            node scripts/verify-milestone3.js
            node scripts/verify-milestone2.js
            node scripts/verify-milestone1.js
            node scripts/calibration-self-check.js
            node scripts/release-gate.js
          fi
