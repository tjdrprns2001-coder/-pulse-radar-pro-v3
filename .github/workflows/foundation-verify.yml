name: Foundation Verify

on:
  push:
    branches:
      - feat/unified-v2-m1-foundation
      - feat/unified-v2-m2-chart
      - feat/unified-v2-m3-smc
      - feat/unified-v2-m3-1-declutter
      - feat/unified-v2-m3-2-collision
      - feat/multi-chart-workspace-v1
  pull_request:
    paths:
      - 'ui/**'
      - 'tests/**'
      - 'pulse-unified.html'
      - 'unified-chart.html'
      - 'multi-chart.html'
      - 'scanner-shell-v13.html'
      - 'package.json'
      - 'scripts/**'
      - 'RELEASE_CHECKLIST.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository
        run: npm run verify