name: Astra Long Entry
# validates long-entry evidence and presentation

on:
  push:
    branches:
      - feature/astra-concrete-long-entry-20261001
      - codex/long-entry-details-20261001
      - codex/ict-kst-long-v2
      - codex/chartbro-session-bidirectional-20261002
      - codex/chartbro-complete-context-20261002
      - codex/chartbro-oos-loop-20261002
      - codex/chartbro-oos-runtime-20261002
      - main
    paths:
      - "lib/coin-scan/amd-long-entry.js"
      - "lib/coin-scan/amd-short-entry.js"
      - "lib/coin-scan/amd-short-entry.test.js"
      - "lib/coin-scan/chartbro-context.js"
      - "lib/coin-scan/chartbro-context.test.js"
      - "lib/coin-scan/chartbro-oos-service.js"
      - "lib/coin-scan/chartbro-oos-service.test.js lib/coin-scan/render-kv-state-store.test.js"
      - "lib/coin-scan/render-kv-state-store.js"
      - "lib/coin-scan/render-kv-state-store.test.js"
      - "workers/chartbro-oos-runtime.mjs"
      - "api/astra-scan.js"
      - "api/chartbro-research.js"
      - "render-temp-server.js"
      - "workers/selector-runtime.mjs"
      - "lib/coin-scan/binance-provider.js"
      - "lib/coin-scan/amd-long-entry.test.js"
      - "lib/coin-scan/astra-auto-scanner.js"
      - "ui/astra-scan.js"
      - "ui/astra-scan.css"
      - "astra-scan.html"
      - "scripts/verify-long-entry-details.py"
      - "scripts/verify-astra-auto-scan.js"
      - ".github/workflows/astra-long-entry.yml"
  pull_request:
    paths:
      - "lib/coin-scan/amd-long-entry.js"
      - "lib/coin-scan/amd-short-entry.js"
      - "lib/coin-scan/amd-short-entry.test.js"
      - "lib/coin-scan/chartbro-context.js"
      - "lib/coin-scan/chartbro-context.test.js"
      - "lib/coin-scan/chartbro-oos-service.js"
      - "lib/coin-scan/chartbro-oos-service.test.js"
      - "lib/coin-scan/render-kv-state-store.js"
      - "lib/coin-scan/render-kv-state-store.test.js"
      - "workers/chartbro-oos-runtime.mjs"
      - "api/astra-scan.js"
      - "api/chartbro-research.js"
      - "render-temp-server.js"
      - "workers/selector-runtime.mjs"
      - "lib/coin-scan/binance-provider.js"
      - "lib/coin-scan/amd-long-entry.test.js"
      - "lib/coin-scan/astra-auto-scanner.js"
      - "ui/astra-scan.js"
      - "ui/astra-scan.css"
      - "astra-scan.html"
      - "scripts/verify-long-entry-details.py"
      - "scripts/verify-astra-auto-scan.js"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check lib/coin-scan/amd-long-entry.js
      - run: node --check lib/coin-scan/amd-short-entry.js
      - run: node --check lib/coin-scan/chartbro-context.js
      - run: node --check lib/coin-scan/chartbro-oos-service.js
      - run: node --check lib/coin-scan/render-kv-state-store.js
      - run: node --check workers/chartbro-oos-runtime.mjs
      - run: node --check api/astra-scan.js
      - run: node --check api/chartbro-research.js
      - run: node --check render-temp-server.js
      - run: node --check workers/selector-runtime.mjs
      - run: node --check lib/coin-scan/astra-auto-scanner.js
      - run: node --check ui/astra-scan.js
      - run: node --test lib/coin-scan/amd-long-entry.test.js lib/coin-scan/amd-short-entry.test.js lib/coin-scan/chartbro-context.test.js lib/coin-scan/chartbro-oos-service.test.js
      - run: node scripts/verify-astra-auto-scan.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify-long-entry-details.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-entry-details-fixtures
          path: artifacts/long-entry-details
          if-no-files-found: warn
          retention-days: 14
