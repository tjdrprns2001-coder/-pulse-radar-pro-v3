name: Serverless function budget
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'handlers/period-symmetry.js'
      - 'vercel.json'
      - 'scripts/verify-period-symmetry-route.js'
      - '.github/workflows/serverless-function-budget.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'handlers/period-symmetry.js'
      - 'vercel.json'
      - 'scripts/verify-period-symmetry-route.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-period-symmetry-route.js
      - run: node -c api/index.js
      - run: node -c handlers/period-symmetry.js
