name: Verify DNA runtime routing
on:
  pull_request:
    paths: ['dna-scan.html','scripts/verify-dna-scan-runtime.js','.github/workflows/verify-dna-scan-runtime.yml']
  push:
    branches: [main]
    paths: ['dna-scan.html','scripts/verify-dna-scan-runtime.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-dna-scan-runtime.js
