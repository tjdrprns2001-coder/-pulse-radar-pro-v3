<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar</title><script>(()=>{const q=new URLSearchParams(location.search);if(q.get('shell')==='1'){q.delete('shell');const s=q.toString();location.replace('/index.html'+(s?'?'+s:''));}})();</script><style>html,body{margin:0;width:100%;height:100%;background:#07101a;overflow:hidden}.frame{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#07101a;display:none}.frame.active{display:block}.analysisDock{position:fixed;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:100000;border:1px solid #4f8cff;background:#1f64e8;color:#fff;border-radius:999px;padding:12px 16px;font:800 13px system-ui,-apple-system,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer}.analysisDock.active{background:#0b1825;border-color:#29445d}.analysisDock span{opacity:.75;font-size:10px;margin-left:4px}@media(max-width:600px){.analysisDock{right:10px;bottom:calc(12px + env(safe-area-inset-bottom));padding:11px 14px;font-size:12px}}</style></head><body><iframe id="app" class="frame active"></iframe><iframe id="analysis" class="frame"></iframe><button id="analysisDock" class="analysisDock">통합 분석 <span>열기</span></button><script>
const app=document.getElementById('app'),analysis=document.getElementById('analysis'),dock=document.getElementById('analysisDock');let analysisLoaded=false,mode='scanner';
function query(){try{return new URL(app.contentWindow.location.href).search||location.search}catch{return location.search}}
function inject(){try{const d=app.contentDocument;if(!d)return;if(!d.getElementById('scannerFuturesClientV13')){const s=d.createElement('script');s.id='scannerFuturesClientV13';s.src='/scanner-futures-client.js?v=13';d.body.appendChild(s)}if(!d.getElementById('analysisEntryV2')){const style=d.createElement('style');style.id='analysisEntryV2';style.textContent='.pulseIntegratedAnalysis{background:#1f64e8!important;border-color:#4f8cff!important;color:#fff!important;font-weight:850!important}';d.head.appendChild(style);const nav=d.querySelector('.nav');if(nav){const b=d.createElement('button');b.className='btn pulseIntegratedAnalysis';b.textContent='통합 분석';b.onclick=()=>parent.postMessage({type:'pulse:open-analysis'},location.origin);nav.prepend(b)}const actions=d.querySelector('.actions');if(actions){const b=d.createElement('button');b.className='btn primary pulseIntegratedAnalysis';b.textContent='통합 분석';b.onclick=()=>parent.postMessage({type:'pulse:open-analysis'},location.origin);actions.appendChild(b)}}}catch(e){console.warn('scanner injection failed',e)}}
function showAnalysis(){const q=query();mode='analysis';app.classList.remove('active');analysis.classList.add('active');if(!analysisLoaded){analysis.src='/analysis-shell-v12.html'+q;analysisLoaded=true}else{try{if(q&&analysis.contentWindow.location.search!==q)analysis.src='/analysis-shell-v12.html'+q}catch{}}dock.classList.add('active');dock.innerHTML='시장 스캐너 <span>돌아가기</span>';history.replaceState(null,'',location.pathname+q+'#analysis')}
function showScanner(){mode='scanner';analysis.classList.remove('active');app.classList.add('active');dock.classList.remove('active');dock.innerHTML='통합 분석 <span>열기</span>';history.replaceState(null,'',location.pathname+query())}
app.src='/index.html'+location.search;app.addEventListener('load',inject);dock.onclick=()=>mode==='analysis'?showScanner():showAnalysis();window.addEventListener('message',e=>{if(e.data?.type==='pulse:open-analysis')showAnalysis();if(e.data?.type==='pulse:symbol'&&e.data.symbol){const q='?symbol='+encodeURIComponent(e.data.symbol);history.replaceState(null,'',location.pathname+q+(mode==='analysis'?'#analysis':''))}});if(location.hash==='#analysis')setTimeout(showAnalysis,80);
</script></body></html>
