<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar</title><style>html,body{margin:0;width:100%;height:100%;background:#07101a;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#eaf2fb}.mainbar{position:fixed;left:0;right:0;top:0;height:48px;z-index:100000;background:rgba(6,16,26,.96);border-bottom:1px solid #22354d;display:flex;align-items:center;padding:6px 10px;gap:7px;backdrop-filter:blur(12px)}.brand{font-weight:900;margin-right:4px;white-space:nowrap}.tab{border:1px solid #29445d;background:#0b1825;color:#b8c9da;border-radius:9px;padding:7px 11px;font-weight:750;cursor:pointer}.tab.active{background:#1f64e8;border-color:#4f8cff;color:#fff}.state{margin-left:auto;color:#7890a8;font-size:10px;white-space:nowrap}.frame{position:fixed;left:0;right:0;top:48px;bottom:0;width:100vw;height:calc(100dvh - 48px);border:0;background:#07101a;display:none}.frame.active{display:block}@media(max-width:600px){.mainbar{height:44px;padding:5px 7px}.brand{font-size:13px}.tab{padding:6px 8px;font-size:11px}.state{display:none}.frame{top:44px;height:calc(100dvh - 44px)}}</style></head><body><header class="mainbar"><span class="brand">PulseRadar</span><button id="scannerTab" class="tab active">시장 스캐너</button><button id="analysisTab" class="tab">통합 분석</button><span id="state" class="state">스캐너</span></header><iframe id="app" class="frame active"></iframe><iframe id="analysis" class="frame"></iframe><script>
const app=document.getElementById('app'),analysis=document.getElementById('analysis'),scannerTab=document.getElementById('scannerTab'),analysisTab=document.getElementById('analysisTab'),state=document.getElementById('state');let analysisLoaded=false;
function currentQuery(){try{const u=new URL(app.contentWindow.location.href);return u.search||location.search}catch{return location.search}}
function injectScanner(){try{const d=app.contentDocument;if(!d)return;if(!d.getElementById('scannerFuturesClientV13')){const s=d.createElement('script');s.id='scannerFuturesClientV13';s.src='/scanner-futures-client.js?v=13';s.defer=false;d.body.appendChild(s)}if(!d.getElementById('analysisFuturesClientV15')){const a=d.createElement('script');a.id='analysisFuturesClientV15';a.src='/analysis-futures-client.js?v=15';a.defer=false;d.body.appendChild(a)}}catch(e){console.warn('scanner client injection failed',e)}}
function show(which){const isAnalysis=which==='analysis';app.classList.toggle('active',!isAnalysis);analysis.classList.toggle('active',isAnalysis);scannerTab.classList.toggle('active',!isAnalysis);analysisTab.classList.toggle('active',isAnalysis);state.textContent=isAnalysis?'통합 분석':'스캐너';if(isAnalysis){const q=currentQuery();if(!analysisLoaded){analysis.src='/analysis-shell-v12.html'+q;analysisLoaded=true}else{try{const now=analysis.contentWindow.location.search;if(q&&now!==q)analysis.src='/analysis-shell-v12.html'+q}catch{}}history.replaceState(null,'',location.pathname+q+'#analysis')}else{history.replaceState(null,'',location.pathname+currentQuery())}}
app.src='/index.html'+location.search;app.addEventListener('load',injectScanner);scannerTab.onclick=()=>show('scanner');analysisTab.onclick=()=>show('analysis');if(location.hash==='#analysis')setTimeout(()=>show('analysis'),50);
window.addEventListener('message',e=>{if(e.data?.type==='pulse:symbol'&&e.data.symbol){const q='?symbol='+encodeURIComponent(e.data.symbol);history.replaceState(null,'',location.pathname+q+(analysis.classList.contains('active')?'#analysis':''))}});
</script></body></html>
