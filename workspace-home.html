<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/ui/pulse-child-normalize.css?v=20260921-v5"><title>PulseRadar V5 · 시장 데스크</title><style>
:root{--bg:#07111b;--panel:#0d1926;--panel2:#091521;--line:#20384f;--text:#edf5ff;--muted:#8ea4ba;--blue:#4f8cff;--green:#39d6a3;--amber:#ffc45f;--red:#ff6b7b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}.home{max-width:1320px;margin:auto;padding:12px 12px 120px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:#78adff}.hero h1{margin:5px 0 3px;font-size:27px}.hero p,.muted{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.refresh{border:1px solid #31557e;background:#10233a;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.pulse{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:12px 0}.metric{min-width:0;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.metric span{display:block;color:var(--muted);font-size:9px}.metric b{display:block;margin-top:4px;font-size:18px;overflow-wrap:anywhere}.metric small{display:block;margin-top:3px;color:#6f879f;font-size:8px}.up{color:var(--green)}.down{color:var(--red)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px}.card h2{font-size:15px;margin:0}.cardHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.badge{border:1px solid #31516f;border-radius:999px;padding:5px 8px;font-size:9px;color:#b8cbe0}.brief{font-size:14px;line-height:1.7;color:#dce7f2}.eventSummary{font-size:11px;line-height:1.55;color:#9fb5ca;padding:9px;background:var(--panel2);border-radius:10px;margin-top:9px}.warning{font-size:10px;color:#e7c979;margin-top:7px}.candidates{display:grid;gap:7px}.candidate{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid #213b53;border-radius:11px;background:var(--panel2);cursor:pointer}.candidate b{font-size:12px}.candidate p{grid-column:1/-1;margin:0;color:#92a8bd;font-size:9px;line-height:1.45}.candidate .score{font-size:12px;color:#9fc7ff}.events{display:grid;gap:7px}.event{padding:9px;background:var(--panel2);border-radius:10px}.event b{font-size:11px}.event p{margin:4px 0 0;color:var(--muted);font-size:9px;line-height:1.4}.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}.quick button{min-width:0;text-align:left;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:13px;padding:11px}.quick b{display:block;font-size:11px}.quick span{display:block;color:var(--muted);font-size:8px;margin-top:4px}.footerLine{display:flex;justify-content:space-between;gap:10px;margin-top:9px;color:var(--muted);font-size:9px}@media(max-width:950px){.pulse{grid-template-columns:repeat(3,minmax(0,1fr))}.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.home{padding:9px 9px 120px}.hero h1{font-size:22px}.pulse{grid-template-columns:1fr 1fr}.pulse .metric:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.card{padding:11px}.brief{font-size:13px}.candidate{padding:9px}}@media(max-width:420px){.quick{grid-template-columns:1fr}.refresh{padding:8px 9px}}
</style></head><body><main class="home">
<header class="hero"><div><span class="eyebrow">PULSERADAR V5 · MARKET DESK</span><h1>전체 시장 체크</h1><p>코어 스캔 · 확장 시장 · 파생 수급 · 이벤트 · AI 후보를 한 화면에서 확인합니다.</p></div><button id="refresh" class="refresh">지금 갱신</button></header>
<section class="pulse"><div class="metric"><span>시장 상태</span><b id="marketState">확인 중</b><small id="breadthText">breadth 계산 중</small></div><div class="metric"><span>BTC 24H</span><b id="btc">-</b><small id="btcPx">-</small></div><div class="metric"><span>ETH 24H</span><b id="eth">-</b><small id="ethPx">-</small></div><div class="metric"><span>코어 유니버스</span><b id="core">-</b><small>Binance USDT 무기한</small></div><div class="metric"><span>확장 유니버스</span><b id="extended">-</b><small>현물+8개 선물거래소 중복 제거</small></div><div class="metric"><span>다음 자동 갱신</span><b id="next">-</b><small>1시간 주기</small></div></section>
<section class="grid"><article class="card"><div class="cardHead"><h2>1시간 시장 브리핑</h2><span id="briefMode" class="badge">확인 중</span></div><div id="brief" class="brief">시장 요약을 불러오는 중…</div><div id="eventSummary" class="eventSummary">이벤트를 확인하는 중…</div><div id="warnings" class="warning"></div><div class="footerLine"><span id="updated">-</span><span>자동 갱신 60분</span></div></article><article class="card"><div class="cardHead"><h2>AI 후보 코인</h2><span id="candidateMode" class="badge">분석 중</span></div><div id="candidates" class="candidates"></div></article></section>
<section class="grid" style="margin-top:10px"><article class="card"><div class="cardHead"><h2>이벤트 · 공식 뉴스</h2><button class="refresh" data-view="intel">전체 보기</button></div><div id="events" class="events"></div></article><article class="card"><div class="cardHead"><h2>빠른 실행</h2><span class="badge">V5</span></div><div class="quick"><button data-view="autoscan"><b>🔥 전체스캔</b><span>코어 분류</span></button><button data-view="assistantscan"><b>◎ 연구 스캔</b><span>OI·taker 정밀</span></button><button data-view="analysis"><b>▤ 전문 분석</b><span>ICT·SMC·매물대</span></button><button data-view="mtfsnapshot"><b>▦ 8TF 스냅샷</b><span>1W→5m 비교</span></button><button data-view="dante"><b>⚡ 단테 랩</b><span>기법 실전 판별</span></button><button data-view="pulseai"><b>✦ Pulse AI</b><span>질문·브리핑</span></button></div></article></section>
</main><script>
const REFRESH=3600000,CACHE='pulse.home.v5.hourly';const $=id=>document.getElementById(id);let nextAt=Date.now()+REFRESH;
const num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d}):'-',pct=v=>Number.isFinite(Number(v))?(Number(v)>=0?'+':'')+Number(v).toFixed(2)+'%':'-';
function nav(view,symbol){try{parent.postMessage({type:'pulse-nav',view,symbol},'*')}catch{}if(window===parent){const u=new URL('/pulse-unified.html',location.origin);u.searchParams.set('view',view);if(symbol)u.searchParams.set('symbol',symbol);location.href=u}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function marketItem(rows,s){return(rows||[]).find(x=>String(x.symbol||'').toUpperCase()===s)}
function render(d){const m=d.market||{},scan=d.scan||{},ai=d.ai||{},b=scan.marketBreadth||{},btc=marketItem(m.results,'BTCUSDT'),eth=marketItem(m.results,'ETHUSDT');$('core').textContent=num(m.coreFuturesCount??scan.scanCount,0);$('extended').textContent=num(m.total,0);for(const [id,x] of [['btc',btc],['eth',eth]]){const el=$(id);el.textContent=x?pct(x.change24):'-';el.className=x&&Number(x.change24)>=0?'up':'down';$(id+'Px').textContent=x?num(x.price,6):'-'}const med=Number(b.median),up=Number(b.up)||0,down=Number(b.down)||0;let state='중립/혼조';if(Number.isFinite(med)&&med>=2&&up>down*1.5)state='강한 위험선호';else if(Number.isFinite(med)&&med>0&&up>down)state='상승 우위';else if(Number.isFinite(med)&&med<=-2&&down>up*1.5)state='강한 위험회피';else if(Number.isFinite(med)&&med<0&&down>up)state='하락 우위';$('marketState').textContent=state;$('breadthText').textContent=Number.isFinite(med)?'상승 '+up+' / 하락 '+down+' · 중앙값 '+pct(med):'breadth N/A';$('brief').textContent=ai.summary||'AI 브리핑이 없으면 코어 스캔 데이터만 표시합니다.';$('eventSummary').textContent=ai.eventSummary||'확인된 이벤트 요약 없음';$('briefMode').textContent=ai.aiGenerated?'AI 브리핑':'규칙 기반';$('candidateMode').textContent=ai.aiGenerated?'AI + 스캐너':'스캐너 기반';$('warnings').textContent=(ai.dataWarnings||[]).join(' · ');$('updated').textContent='업데이트 '+new Date(d.updatedAt||Date.now()).toLocaleString('ko-KR');const scanMap=new Map((scan.items||[]).map(x=>[x.symbol,x])),watch=(ai.watch||[]).map(x=>scanMap.get(x.symbol)||x),fallback=(scan.items||[]).filter(x=>['PRE-SURGE','ACCUMULATION-PRE','META-PRE','ANOMALY'].includes(x.scanClass?.key)).sort((a,b)=>(Number(b.tradeSignal?.confidence)||0)-(Number(a.tradeSignal?.confidence)||0)||(Number(b.candidateScore)||0)-(Number(a.candidateScore)||0));const list=(watch.length?watch:fallback).slice(0,7),box=$('candidates');box.innerHTML='';if(!list.length)box.textContent='현재 우선 후보 없음';for(const x of list){const c=document.createElement('div');c.className='candidate';const name=document.createElement('b');name.textContent=x.symbol||'-';const score=document.createElement('span');score.className='score';score.textContent=(x.tradeSignal?.confidence!=null?x.tradeSignal.confidence+'%':x.candidateScore!=null?x.candidateScore+'점':'관찰');const p=document.createElement('p');p.textContent=[x.scanClass?.label||x.category||'',x.v2Flow?.type||x.v2Type||'',x.v2Flow?.stageLabel||'',x.tradeSignal?.invalidations?.[0]||x.reason||''].filter(Boolean).join(' · ');c.append(name,score,p);c.onclick=()=>nav('report',x.symbol);box.append(c)}const eb=$('events');eb.innerHTML='';const ev=(ai.eventCatalysts||[]).slice(0,5);if(!ev.length)eb.textContent='현재 확인된 공식/신뢰 이벤트 없음';for(const x of ev){const e=document.createElement('div');e.className='event';const b=document.createElement('b');b.textContent=(x.symbol||'')+' · '+(x.titleKo||x.eventTypeKo||'이벤트');const p=document.createElement('p');p.textContent=[x.timingKo,x.sourceTierKo,x.technicalStateKo].filter(Boolean).join(' · ');e.append(b,p);eb.append(e)}}
async function refresh(force=false){$('refresh').disabled=true;try{const [mr,sr,ar]=await Promise.allSettled([fetch('/api/market?minVolume=500000',{cache:'no-store'}).then(r=>r.json()),fetch('/api/coin-scan?mode=summary&limit=500',{cache:'no-store'}).then(r=>r.json()),fetch('/api/pulse-ai?mode=brief',{cache:'no-store'}).then(r=>r.json())]);const data={market:mr.status==='fulfilled'?mr.value:{},scan:sr.status==='fulfilled'?sr.value:{},ai:ar.status==='fulfilled'?ar.value:{},updatedAt:Date.now()};render(data);try{localStorage.setItem(CACHE,JSON.stringify(data))}catch{}nextAt=Date.now()+REFRESH}catch(e){$('brief').textContent='시장 브리핑 갱신 실패 · '+e.message}finally{$('refresh').disabled=false}}
function init(){let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE)||'null')}catch{}if(cached&&Date.now()-Number(cached.updatedAt||0)<REFRESH){render(cached);nextAt=Number(cached.updatedAt)+REFRESH}else refresh(true);$('refresh').onclick=()=>refresh(true);setInterval(()=>refresh(true),REFRESH);setInterval(()=>{$('next').textContent=Math.max(0,Math.ceil((nextAt-Date.now())/60000))+'분'},30000);$('next').textContent=Math.max(0,Math.ceil((nextAt-Date.now())/60000))+'분'}
init();
</script></body></html>
