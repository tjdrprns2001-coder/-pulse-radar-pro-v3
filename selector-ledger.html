<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar · Selector 원장</title><link rel="stylesheet" href="/ui/selector-ledger.css?v=20260925-r01"></head>
<body><main class="ledgerApp">
<header class="top"><div><h1>Selector 검증 원장 · r0.1~r0.4</h1><p>읽기 전용 · append-only snapshot · transition · replay · outcome monitor</p></div><div class="actions"><a href="/coin-scan.html">자동스캔</a><a href="/api/coin-scan?mode=selector-history&action=export&format=json&limit=1000">JSON</a><a href="/api/coin-scan?mode=selector-history&action=export&format=csv&limit=1000">CSV</a><button id="refresh">새로고침</button></div></header>
<section class="summary" id="summary"><div><span>Snapshot</span><b id="snapCount">0</b></div><div><span>후보</span><b id="candidateCount">0</b></div><div><span>감시</span><b id="watchCount">0</b></div><div><span>이벤트</span><b id="eventCount">0</b></div><div><span>충돌</span><b id="conflictCount">0</b></div><div><span>위험필터</span><b id="riskCount">0</b></div><div><span>데이터/제외</span><b id="blockedCount">0</b></div></section>
<section class="filters"><input id="query" placeholder="종목 검색"><select id="classification"><option value="">전체 분류</option><option>CANDIDATE</option><option>WATCHLIST</option><option>EVENT_RISK</option><option>CONFLICTED</option><option>RISK_FILTERED</option><option>INSUFFICIENT_DATA</option><option>REJECTED</option></select><button id="loadTransitions">상태 전이 보기</button><button id="loadEvidence">증거 원장</button><button id="loadAblation">A/B/C/D OOS</button><button id="runtimeHealth">런타임 상태</button></section>
<div id="status" class="status">불러오는 중…</div>
<section id="rows" class="rows"></section>
<dialog id="replayDialog"><form method="dialog"><button class="close">닫기</button></form><pre id="replayOut"></pre></dialog>
</main><script src="/ui/selector-ledger.js?v=20260925-r01" defer></script></body></html>
