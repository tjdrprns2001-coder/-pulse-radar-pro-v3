<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseRadar 상세 분석</title><style>
:root{--bg:#07101a;--panel:#0d1724;--line:#22354d;--txt:#edf4ff;--muted:#8fa2ba;--blue:#4f8cff;--green:#35d69a;--red:#ff6577;--amber:#ffc45f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081424,#060b12);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}.app{max-width:1380px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-weight:900;font-size:20px}.muted{font-size:11px;color:var(--muted)}.btn,input,select{background:#0b1420;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}.btn{text-decoration:none;cursor:pointer}.primary{background:#1f64e8;border-color:#2f79ff;font-weight:800}.toolbar{display:grid;grid-template-columns:1fr 110px auto;gap:8px;padding:11px;margin-bottom:10px}.card{background:rgba(13,23,36,.96);border:1px solid var(--line);border-radius:15px}.status{grid-column:1/-1}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:10px}.chartCard{overflow:hidden}.chartHead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.toggles{display:flex;gap:7px;flex-wrap:wrap}.toggles label{font-size:10px;color:#b8c8da}.chartWrap{background:#09111b}.chartWrap canvas{display:block;width:100%;height:auto;min-height:520px}.side{display:flex;flex-direction:column;gap:10px}.summary{padding:12px}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#09131f;border:1px solid #20354f;border-radius:11px;padding:11px}.mini span{display:block;font-size:10px;color:var(--muted)}.mini b{font-size:19px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.section{padding:12px}.section h3{font-size:13px;margin:0 0 8px}.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #1d2e44;font-size:11px}.kv span{color:var(--muted)}details{border-top:1px solid #1d2e44;margin-top:8px;padding-top:8px}summary{cursor:pointer;font-size:11px;color:#cbd9e9}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:10px;border:1px solid #314a68;border-radius:999px;padding:4px 7px}.footer{padding:14px 2px;color:#70859f;font-size:11px}@media(max-width:900px){.layout{grid-template-columns:1fr}.chartWrap canvas{min-height:420px}}@media(max-width:600px){.app{padding:9px}.top{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr 100px}.toolbar .primary,.status{grid-column:1/-1}.chartWrap canvas{min-height:350px}.summaryGrid{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">상세 구조 분석</div><div class="muted">핵심만 먼저 보고, 세부 정보는 필요할 때 펼쳐보세요.</div></div><a class="btn" href="/">← 시장 스캐너</a></header>
<section class="card toolbar"><input id="symbol" value="BTCUSDT"><select id="tf"><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select><button id="run" class="btn primary">분석 실행</button><div id="status" class="muted status">대기</div></section>
<div class="layout"><section class="card chartCard"><div class="chartHead"><div id="chartTitle" class="muted">-</div><div class="toggles"><label><input id="sw" type="checkbox" checked> 스윙</label><label><input id="ev" type="checkbox" checked> BOS/CHoCH</label><label><input id="tl" type="checkbox" checked> 추세선</label><label><input id="zones" type="checkbox" checked> 지지/저항</label></div></div><div class="chartWrap"><canvas id="chart" width="1080" height="620"></canvas></div></section>
<aside class="side"><section class="card summary"><div class="summaryGrid"><div class="mini"><span>구조</span><b id="bias">-</b></div><div class="mini"><span>최근 이벤트</span><b id="event">-</b></div><div class="mini"><span>지지 추세선</span><b id="supState">-</b></div><div class="mini"><span>저항 추세선</span><b id="resState">-</b></div></div></section>
<section class="card section"><h3>현재 관찰 요약</h3><div class="kv"><span>현재가</span><b id="price">-</b></div><div class="kv"><span>다음 지지</span><b id="support">-</b></div><div class="kv"><span>다음 저항</span><b id="resistance">-</b></div><div class="kv"><span>구조 무효화 기준</span><b id="invalid">-</b></div><div class="kv"><span>데이터 무결성</span><b id="audit">-</b></div></section>
<section class="card section"><h3>추세선</h3><div class="kv"><span>지지</span><b id="supInfo">-</b></div><div class="kv"><span>저항</span><b id="resInfo">-</b></div><details><summary>세부 구조 보기</summary><div class="chips" id="swings"></div><div class="kv"><span>Raw vs Canonical</span><b id="cmp">-</b></div></details></section>
<section class="card section"><h3>기술 진단</h3><div class="kv"><span>EMA 5/20/60</span><b id="ema">-</b></div><div class="kv"><span>변동성</span><b id="vol">-</b></div><div class="kv"><span>FVG</span><b id="fvg">-</b></div><div class="kv"><span>오더블록</span><b id="ob">-</b></div><details><summary>고급 검증 도구</summary><div class="chips"><a class="btn" href="/historical-validation.html">과거 검증</a><a class="btn" href="/structure-validation.html">무결성 검증</a></div></details></section></aside></div><div class="footer">교육·연구용 · 자동 주문 없음 · 개인화 매수/매도 지시 없음</div></main>
<script>
const $=s=>document.querySelector(s),cv=$('#chart'),ctx=cv.getContext('2d');let STATE=null;const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;function pf(x){x=+x;if(!Number.isFinite(x))return'-';return x>=100?x.toFixed(2):x>=1?x.toFixed(4):x.toFixed(6)}function ema(a,p){let k=2/(p+1),v=a[0],o=[];a.forEach((x,i)=>{v=i?x*k+v*(1-k):x;o.push(v)});return o}async function api(u){let r=await fetch(u,{cache:'no-store'}),t=await r.text();if(!r.ok)throw Error('HTTP '+r.status);let d=JSON.parse(t);if(!d.ok)throw Error(d.error||'API 오류');return d}function idxByTime(e,b){let t=+e.eventTime||+e.time,bi=null,bd=Infinity;if(!t)return null;b.forEach((k,i)=>{let kt=+k.time||+k.openTime||+k.closeTime,z=Math.abs(kt-t);if(z<bd){bd=z;bi=i}});return bi}
function calc(d,b){let off=(d.candles||[]).length-b.length,sw=(d.canonicalSwings||[]).map(x=>({...x,i:x.pivotIndex-off})).filter(x=>x.i>=0&&x.i<b.length),ev=(d.events||[]).map(x=>({...x,i:idxByTime(x,b)})).filter(x=>x.i!=null),c=b.map(x=>+x.close),E=[5,20,60].map(p=>ema(c,p).at(-1)),emaState=E[0]>E[1]&&E[1]>E[2]?'상승 정렬':E[0]<E[1]&&E[1]<E[2]?'하락 정렬':'혼합',labels=sw.slice(-4).map(x=>x.label),bias=labels.includes('HH')&&labels.includes('HL')?'상승':labels.includes('LH')&&labels.includes('LL')?'하락':'혼합',atr=+b.at(-1).atr||0,atrPct=c.at(-1)?atr/c.at(-1)*100:0;let fv=[];for(let i=2;i<b.length;i++){if(+b[i].low>+b[i-2].high)fv.push({side:'상승',low:+b[i-2].high,high:+b[i].low});if(+b[i].high<+b[i-2].low)fv.push({side:'하락',low:+b[i].high,high:+b[i-2].low})}let ob=[];ev.slice(-8).forEach(e=>{for(let j=Math.max(1,e.i-5);j<e.i;j++){let k=b[j],bull=+k.close>+k.open;if((e.dir==='up'&&!bull)||(e.dir==='down'&&bull)){ob.push({dir:e.dir==='up'?'상승':'하락',low:+k.low,high:+k.high});break}}});return{off,sw,ev,bias,emaState,atrPct,fv,ob}}
function drawTrend(L,label,color,F,x,y,b,W,p){if(!L)return;let start=Math.max(0,(L.anchorA?.barIndex??0)-F.off),end=b.length-1,base=L.anchorA?.barIndex??0,price=i=>(+L.intercept)+(+L.slope)*(i+F.off);ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x(start),y(price(start-F.off)));ctx.lineTo(x(end),y(price(end-F.off)));ctx.stroke();ctx.fillStyle=color;ctx.font='bold 10px sans-serif';ctx.fillText(label,Math.max(p.l,x(end)-75),Math.max(14,Math.min(610,y(price(end-F.off))-6)));ctx.restore()}
function draw(d,b,F){let W=cv.width,H=cv.height,p={l:28,r:82,t:30,b:28},hi=Math.max(...b.map(x=>+x.high)),lo=Math.min(...b.map(x=>+x.low)),span=hi-lo||1,x=i=>p.l+i*(W-p.l-p.r)/(b.length-1),y=v=>p.t+(hi-v)/span*(H-p.t-p.b);ctx.fillStyle='#09111b';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1b2c42';for(let i=0;i<6;i++){let yy=p.t+i*(H-p.t-p.b)/5;ctx.beginPath();ctx.moveTo(p.l,yy);ctx.lineTo(W-p.r,yy);ctx.stroke();ctx.fillStyle='#7d91aa';ctx.font='11px sans-serif';ctx.fillText(pf(hi-i*span/5),W-p.r+7,yy+4)}if($('#zones').checked)(d.zones||[]).slice(0,5).forEach(z=>{ctx.save();ctx.globalAlpha=.12;ctx.fillStyle=z.type==='support'?'#35d69a':'#ff6577';ctx.fillRect(p.l,y(+z.high),W-p.l-p.r,Math.max(2,y(+z.low)-y(+z.high)));ctx.restore()});let bw=Math.max(2,Math.min(7,(W-p.l-p.r)/b.length*.65));b.forEach((k,i)=>{let up=+k.close>=+k.open,c=up?'#2ec9a4':'#ef6678',xx=x(i);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(xx,y(+k.high));ctx.lineTo(xx,y(+k.low));ctx.stroke();ctx.fillRect(xx-bw/2,y(Math.max(+k.open,+k.close)),bw,Math.max(1,y(Math.min(+k.open,+k.close))-y(Math.max(+k.open,+k.close))))});if($('#tl').checked){drawTrend(d.trendlines?.support,'지지','#35d69a',F,x,y,b,W,p);drawTrend(d.trendlines?.resistance,'저항','#ff6577',F,x,y,b,W,p)}if($('#sw').checked)F.sw.slice(-10).forEach(q=>{ctx.fillStyle=q.type==='L'?'#35d69a':'#ffc45f';ctx.font='bold 10px sans-serif';ctx.fillText(q.label||q.type,x(q.i)+4,y(+q.price)-4)});if($('#ev').checked)F.ev.slice(-6).forEach(e=>{let yy=y(+e.level),xx=x(e.i);ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle=String(e.type).toUpperCase().includes('CHO')?'#35d69a':'#4f8cff';ctx.beginPath();ctx.moveTo(Math.max(p.l,xx-45),yy);ctx.lineTo(Math.min(W-p.r,xx+85),yy);ctx.stroke();ctx.restore();ctx.fillStyle='#dce8f6';ctx.font='10px sans-serif';ctx.fillText(e.type||'이벤트',xx+4,yy-4)});ctx.fillStyle='#dce8f6';ctx.font='bold 13px sans-serif';ctx.fillText(`${d.symbol} · ${d.interval}`,p.l,18);STATE={d,b,F}}
function render(d,b,F){let L=b.at(-1),e=F.ev.at(-1),sup=(d.zones||[]).filter(z=>z.type==='support')[0],res=(d.zones||[]).filter(z=>z.type==='resistance')[0],ts=d.trendlines?.support,tr=d.trendlines?.resistance,fd=x=>Number.isFinite(+x)?(+x).toFixed(2):'-';$('#bias').textContent=F.bias;$('#bias').className=F.bias==='상승'?'green':F.bias==='하락'?'red':'amber';$('#event').textContent=e?.type||'없음';$('#supState').textContent=ts?.state||'없음';$('#resState').textContent=tr?.state||'없음';$('#price').textContent=pf(L.close);$('#support').textContent=sup?`${pf(sup.low)}–${pf(sup.high)}`:'-';$('#resistance').textContent=res?`${pf(res.low)}–${pf(res.high)}`:'-';$('#invalid').textContent=F.bias==='상승'&&sup?`${pf(sup.low)} 하향 훼손 시 재평가`:F.bias==='하락'&&res?`${pf(res.high)} 상향 훼손 시 재평가`:'최근 구조 훼손 시 재평가';$('#audit').textContent=d.audit?.coreStatus==='PASS'?'통과':'확인 필요';$('#supInfo').textContent=ts?`${ts.touchCount}회 · ${ts.totalScore}점 · ${fd(ts.currentDistanceAtr)} ATR`:'없음';$('#resInfo').textContent=tr?`${tr.touchCount}회 · ${tr.totalScore}점 · ${fd(tr.currentDistanceAtr)} ATR`:'없음';$('#swings').innerHTML=F.sw.slice(-8).map(x=>`<span class="chip">${x.label} ${pf(x.price)}</span>`).join('');let c=d.trendlineComparison;$('#cmp').textContent=c?`Raw ${c.raw?.support?.touches??'-'}/${c.raw?.resistance?.touches??'-'} · Canonical ${c.canonical?.support?.touches??'-'}/${c.canonical?.resistance?.touches??'-'}`:'-';$('#ema').textContent=F.emaState;$('#vol').textContent=`ATR ${F.atrPct.toFixed(2)}%`;let fv=F.fv.at(-1),ob=F.ob.at(-1);$('#fvg').textContent=fv?`${fv.side} ${pf(fv.low)}–${pf(fv.high)}`:'없음';$('#ob').textContent=ob?`${ob.dir} ${pf(ob.low)}–${pf(ob.high)}`:'없음';$('#chartTitle').textContent=`${d.symbol} · ${d.interval} · 종가 ${pf(L.close)}`}
async function run(){let s=$('#symbol').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''),tf=$('#tf').value;$('#run').disabled=true;$('#status').textContent='확정봉 분석 중...';try{let d=await api(`/api/structure?symbol=${encodeURIComponent(s)}&interval=${encodeURIComponent(tf)}&limit=500&_=${Date.now()}`),b=(d.candles||[]).slice(-320);if(b.length<80)throw Error('캔들 부족');let F=calc(d,b);draw(d,b,F);render(d,b,F);$('#status').textContent=`완료 · ${s} · ${tf} · 확정봉 ${b.length}개`}catch(e){console.error(e);$('#status').textContent='분석 실패: '+e.message}finally{$('#run').disabled=false}}const q=new URLSearchParams(location.search).get('symbol');if(q)$('#symbol').value=q.toUpperCase();$('#run').onclick=run;['sw','ev','tl','zones'].forEach(id=>$('#'+id).onchange=()=>{if(STATE)draw(STATE.d,STATE.b,STATE.F)});run();
</script></body></html>
