<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PulseRadar Pro · 통합 분석</title><style>html,body{margin:0;width:100%;height:100%;background:#06101a;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#06101a}</style></head><body><iframe id="shell"></iframe><script>
const shell=document.getElementById('shell');shell.src='/analysis-shell-v8.html'+location.search;
let cmpTimer=null,cmpBusy=false,cmpKey='';
function deepest(){try{let w=shell.contentWindow,d=shell.contentDocument;for(let i=0;i<9;i++){if(!d)break;const f=d.querySelector('iframe#shell,iframe#app');if(!f?.contentWindow||!f.contentDocument)break;w=f.contentWindow;d=f.contentDocument}return d?{w,d}:null}catch{return null}}
const num=v=>{v=Number(v);return Number.isFinite(v)?v:null};
function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
async function json(u){const r=await fetch(u,{cache:'no-store'}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('응답 형식 오류')}if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));return j}
function state(){const q=deepest();if(!q)return null;const symbol=(q.d.getElementById('symbol')?.value||'BTCUSDT').toUpperCase().replace(/[^A-Z0-9]/g,''),tf=q.d.querySelector('[data-tf].active')?.dataset?.tf||'4h';let bias=q.w.D?.bias?.label||q.w.D?.bias||q.d.getElementById('bias')?.textContent||'';const dir=/bull|상승|up/i.test(String(bias))?1:/bear|하락|down/i.test(String(bias))?-1:null;return{...q,symbol,tf,dir}}
function ensureUI(){const q=deepest();if(!q)return false;const d=q.d;if(d.getElementById('structureCompareV9'))return true;const hist=d.getElementById('historicalV8'),aside=d.querySelector('.side');if(!aside)return false;const box=d.createElement('div');box.id='structureCompareV9';box.className='box';box.style.marginTop='9px';box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3 style="margin:0">현재 구조 vs 과거 유사 구조</h3><span id="cmpStatusV9" class="muted">대기</span></div><div class="muted" id="cmpRuleV9" style="margin-top:5px;line-height:1.5">현재 최근 40봉 경로와 유사 과거 구조의 40봉 반응을 정규화해 비교합니다.</div><div style="position:relative;height:230px;margin-top:8px;border:1px solid #20354a;border-radius:9px;background:#07111b;overflow:hidden"><canvas id="cmpCanvasV9" style="width:100%;height:100%;display:block"></canvas></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:9px;color:#91a6bd"><span>● 현재 최근 40봉</span><span>● HOLDOUT 중앙 경로</span><span>얇은 선 = 개별 HOLDOUT 사례</span></div><div class="rows" style="margin-top:7px"><div class="row"><span>현재 40봉 변화</span><b id="cmpNowV9">-</b></div><div class="row"><span>과거 HOLDOUT 40봉 중앙값</span><b id="cmpHistV9">-</b></div><div class="row"><span>비교 표본</span><b id="cmpNV9">-</b></div></div><div class="muted" style="margin-top:7px;line-height:1.5">시각 비교는 패턴 유사성 탐색용이며 미래 경로를 예측하지 않습니다.</div>`;if(hist?.nextSibling)aside.insertBefore(box,hist.nextSibling);else aside.appendChild(box);const st=d.createElement('style');st.id='cmp-v9-style';st.textContent='@media(max-width:700px){#structureCompareV9 canvas{height:205px!important}#structureCompareV9 .row{grid-template-columns:minmax(0,120px) minmax(0,1fr)!important}}';d.head.appendChild(st);return true}
function set(id,v){const e=deepest()?.d.getElementById(id);if(e)e.textContent=v}
function normalizeCurrent(c){const a=(c||[]).slice(-41).map(x=>num(x.close)).filter(Number.isFinite);if(a.length<10)return null;const b=a[0];return a.map((v,i)=>({x:i/(a.length-1)*40,y:(v/b-1)*100}))}
function split(a){a=[...a].sort((x,y)=>(+x.time||0)-(+y.time||0));const d=Math.floor(a.length*.5),v=Math.floor(a.length*.75);return{DEV:a.slice(0,d),VALID:a.slice(d,v),HOLDOUT:a.slice(v)}}
function choose(events,dir){let a=events.filter(e=>dir==null||+e.dir===dir);if(a.length<8)a=events;return a}
function points(e){return[{x:0,y:0},{x:10,y:num(e.r10)||0},{x:20,y:num(e.r20)||0},{x:40,y:num(e.r40)||0}]}
function interp(ps){const out=[];for(let x=0;x<=40;x++){let a=ps[0],b=ps.at(-1);for(let i=1;i<ps.length;i++)if(x<=ps[i].x){a=ps[i-1];b=ps[i];break}const t=(x-a.x)/Math.max(1,b.x-a.x);out.push({x,y:a.y+(b.y-a.y)*t})}return out}
function medianPath(events){const p=events.map(points);if(!p.length)return[];const anchors=[0,1,2,3].map(i=>({x:[0,10,20,40][i],y:med(p.map(a=>a[i].y))||0}));return interp(anchors)}
function draw(cur,hold){const q=deepest(),c=q?.d.getElementById('cmpCanvasV9');if(!c)return;const r=c.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);c.width=Math.max(320,Math.round(r.width*dpr));c.height=Math.max(180,Math.round(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height,pad={l:38,r:12,t:14,b:24},samples=hold.slice(-6).map(e=>interp(points(e))),mp=medianPath(hold),all=[...(cur||[]),...mp,...samples.flat()];let ymin=Math.min(-1,...all.map(p=>p.y)),ymax=Math.max(1,...all.map(p=>p.y));const span=Math.max(2,ymax-ymin);ymin-=span*.12;ymax+=span*.12;const X=v=>pad.l+v/40*(W-pad.l-pad.r),Y=v=>pad.t+(ymax-v)/(ymax-ymin)*(H-pad.t-pad.b);x.clearRect(0,0,W,H);x.strokeStyle='#17283b';x.lineWidth=1;for(const gx of [0,10,20,30,40]){x.beginPath();x.moveTo(X(gx),pad.t);x.lineTo(X(gx),H-pad.b);x.stroke()}for(const gy of [ymin,(ymin+ymax)/2,ymax]){x.beginPath();x.moveTo(pad.l,Y(gy));x.lineTo(W-pad.r,Y(gy));x.stroke()}x.fillStyle='#8096af';x.font='9px system-ui';x.fillText('0',X(0)-2,H-7);x.fillText('10',X(10)-5,H-7);x.fillText('20',X(20)-5,H-7);x.fillText('40봉',X(40)-18,H-7);x.fillText(ymax.toFixed(1)+'%',3,Y(ymax)+3);x.fillText(((ymin+ymax)/2).toFixed(1)+'%',3,Y((ymin+ymax)/2)+3);x.fillText(ymin.toFixed(1)+'%',3,Y(ymin)+3);function line(arr,stroke,width,alpha=1,dash=[]){if(!arr?.length)return;x.save();x.globalAlpha=alpha;x.strokeStyle=stroke;x.lineWidth=width;x.setLineDash(dash);x.beginPath();arr.forEach((p,i)=>i?x.lineTo(X(p.x),Y(p.y)):x.moveTo(X(p.x),Y(p.y)));x.stroke();x.restore()}samples.forEach(a=>line(a,'#64748b',1,.28,[3,3]));line(mp,'#a78bfa',2.4,.95);line(cur,'#35d69a',2.4,1);x.strokeStyle='#40546b';x.lineWidth=1;x.beginPath();x.moveTo(pad.l,Y(0));x.lineTo(W-pad.r,Y(0));x.stroke()}
async function refresh(force=false){if(cmpBusy||!ensureUI())return;const s=state();if(!s)return;const key=s.symbol+'|'+s.tf;if(!force&&key===cmpKey)return;cmpBusy=true;set('cmpStatusV9','불러오는 중');try{const current=s.w.D?.candles||s.w.D?.data?.candles||[],cur=normalizeCurrent(current);if(!cur)throw Error('현재 캔들 부족');const h=await json(`/api/historical-structure-study?symbol=${encodeURIComponent(s.symbol)}&interval=${encodeURIComponent(s.tf)}&bars=3000&_=${Date.now()}`),events=choose(h.canonical?.events||[],s.dir),sp=split(events),hold=sp.HOLDOUT||[];draw(cur,hold);const now=cur.at(-1)?.y,hm=med(hold.map(e=>num(e.r40)));set('cmpNowV9',now==null?'-':`${now>=0?'+':''}${now.toFixed(2)}%`);set('cmpHistV9',hm==null?'-':`${hm>=0?'+':''}${hm.toFixed(2)}%`);set('cmpNV9',`${events.length}개 · HOLDOUT ${hold.length}개`);set('cmpRuleV9',`${s.symbol} ${s.tf} · 현재 최근 40봉 vs 방향이 유사한 canonical 과거 이벤트 · 정규화 % 경로`);set('cmpStatusV9','완료');cmpKey=key}catch(e){set('cmpStatusV9','오류');set('cmpRuleV9','비교 로딩 실패 · '+e.message)}finally{cmpBusy=false}}
function hook(){ensureUI();setTimeout(()=>refresh(true),1800);clearInterval(cmpTimer);cmpTimer=setInterval(()=>{ensureUI();const s=state();if(!s)return;const k=s.symbol+'|'+s.tf;if(k!==cmpKey)refresh(true)},15000)}
shell.addEventListener('load',()=>{setTimeout(hook,900);setTimeout(hook,2400)});window.addEventListener('resize',()=>{const s=state();if(s){cmpKey='';setTimeout(()=>refresh(true),250)}});window.addEventListener('beforeunload',()=>clearInterval(cmpTimer));
</script></body></html>
