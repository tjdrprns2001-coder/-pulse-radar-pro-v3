<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기간대칭 · 밥그릇 스캐너</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#080f19;color:#e5edf7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0}p,small{color:#9eb1c8}nav{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#81b8ff}.panel{background:#111e2d;border:1px solid #29405a;border-radius:15px;padding:15px;margin:13px 0}button,input,select{font:inherit;border:1px solid #415b77;border-radius:9px;background:#0b1725;color:#fff;padding:10px}button{cursor:pointer;background:#285da5}button:disabled{opacity:.45}.control{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{max-width:160px}#progress{height:9px;border-radius:10px;background:#23374d;overflow:hidden}#bar{background:#41c99b;height:100%;width:0%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{padding:12px;background:#15283b;border-radius:10px}.stats strong{display:block;font-size:24px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid #29405a;text-align:left}th{color:#95abc4}table a{white-space:nowrap}.scroll{overflow:auto}.pill{border-radius:16px;background:#233e52;padding:3px 8px;font-size:12px}.PRE{color:#57dcad}.BREAKOUT{color:#ffd175}.ERROR{color:#ff8c95}@media(max-width:530px){h1{font-size:20px}.stats{grid-template-columns:repeat(3,1fr)}.wrap{padding:12px}td,th{font-size:12px}}
</style></head><body><main class="wrap"><nav><h1>기간대칭 · 밥그릇 탐지</h1><a href="/">홈</a></nav><p>하락 기간 대비 바닥 횡보 기간, 박스 상단, 112·224·448일선, OI·거래량 점검. 매수 추천이 아닌 연구용 신호입니다.</p><section class="panel"><div class="control"><label>검색 범위 <select id="scope"><option value="all">전체 코인 선물</option><option value="liquid">거래대금 상위 120개</option><option value="manual">직접 입력</option></select></label><label>24시간 상승 제한 <select id="change"><option value="10">+10% 이하</option><option value="5">+5% 이하</option><option value="999">제한 없음</option></select></label><input id="manual" placeholder="ONDOUSDT,APTUSDT" aria-label="직접 입력 코인"><button id="run">스캔 시작</button><button id="stop" disabled>중단</button><button id="csv" disabled>CSV 저장</button></div><p id="status" aria-live="polite">스캔 준비 완료</p><div id="progress"><div id="bar"></div></div></section><div class="stats"><div>조회 완료<strong id="done">0</strong></div><div>PRE 후보<strong id="pre">0</strong></div><div>돌파·재확인<strong id="other">0</strong></div></div><section class="panel"><h3>검색 결과</h3><p><small>확정 일봉만 사용 · 500개 미만은 데이터 부족 · 데이터 누락은 N/A · 스캔은 실행 버튼으로 시작</small></p><div class="scroll"><table><thead><tr><th>종목</th><th>단계</th><th>기간비</th><th>박스 거리</th><th>일봉 거래량</th><th>1H OI</th><th>15m 점화</th><th>차트</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let stopped=false,results=[];
const safe=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const label={PRE:'돌파 전',BREAKOUT:'돌파 확인',RETEST_WATCH:'눌림 관찰',ABOVE_BOX_UNCONFIRMED:'돌파 미확인',EXTENDED:'과열',WAIT:'대기',NO_PATTERN:'패턴 미충족',NO_HISTORY:'데이터 부족',ERROR:'오류'};
async function get(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('조회 실패 '+r.status);return r.json()}
function render(){let sorted=[...results].sort((a,b)=>({PRE:0,RETEST_WATCH:1,BREAKOUT:2,ABOVE_BOX_UNCONFIRMED:3,WAIT:4,EXTENDED:5,NO_PATTERN:6,NO_HISTORY:7,ERROR:8}[a.stage]??9)-({PRE:0,RETEST_WATCH:1,BREAKOUT:2,ABOVE_BOX_UNCONFIRMED:3,WAIT:4,EXTENDED:5,NO_PATTERN:6,NO_HISTORY:7,ERROR:8}[b.stage]??9));
 $('rows').innerHTML=sorted.map(x=>'<tr><td>'+safe(x.symbol)+'</td><td class="'+safe(x.stage)+'">'+safe(label[x.stage]||x.stage)+'</td><td>'+(x.ratio??'—')+'</td><td>'+(x.distancePct??'—')+'%</td><td>'+(x.rvol??'—')+'배</td><td>'+(x.oi60Pct??'N/A')+'%</td><td>'+(x.ignition?'확인':'미확인')+'</td><td><a target="_blank" rel="noopener" href="https://www.binance.com/en/futures/'+encodeURIComponent(x.symbol)+'">열기</a></td></tr>').join('');
 $('done').textContent=results.length;$('pre').textContent=results.filter(x=>x.stage==='PRE').length;$('other').textContent=results.filter(x=>['BREAKOUT','RETEST_WATCH'].includes(x.stage)).length;
 $('csv').disabled=!results.length;
}
$('run').onclick=async()=>{if($('run').disabled)return;stopped=false;results=[];render();$('run').disabled=true;$('stop').disabled=false;try{
 let symbols=[];if($('scope').value==='manual')symbols=$('manual').value.toUpperCase().split(/[,\s]+/).filter(x=>/^[A-Z0-9]{2,25}USDT$/.test(x)).slice(0,100);
 else{let universe=await get('/api/period-symmetry?mode=universe');symbols=universe.symbols.filter(x=>x.change24h<=Number($('change').value)).sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0,$('scope').value==='liquid'?120:1000).map(x=>x.symbol);}
 if(!symbols.length)throw Error('검색할 종목이 없습니다');
 for(let i=0;i<symbols.length&&!stopped;i+=3){let part=symbols.slice(i,i+3);try{let out=await get('/api/period-symmetry?symbols='+encodeURIComponent(part.join(','))+'&deep=true');results.push(...out.results)}catch(e){results.push(...part.map(symbol=>({symbol,stage:'ERROR',message:String(e)})))}
 $('status').textContent=results.length+' / '+symbols.length+'개 처리됨';$('bar').style.width=(100*results.length/symbols.length)+'%';render();}
 $('status').textContent=stopped?'중단됨 — '+results.length+'개 조회':'조회 완료 — '+results.length+'개. 오류 항목 확인 필요';
 }catch(e){$('status').textContent='오류: '+e.message}finally{$('run').disabled=false;$('stop').disabled=true}};
$('stop').onclick=()=>{stopped=true;$('stop').disabled=true};
$('csv').onclick=()=>{const keys=['symbol','stage','price','declineBars','baseBars','ratio','declinePct','boxLow','boxTop','distancePct','sma112','sma224','sma448','rvol','oi60Pct','oi15Pct','takerRatio','ignition','message'];const csv=[keys.join(','),...results.map(x=>keys.map(k=>JSON.stringify(x[k]??'')).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='period-symmetry-scan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
